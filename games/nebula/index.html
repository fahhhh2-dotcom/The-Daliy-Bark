<!DOCTYPE html>
<html lang="en">
<head>
<script src="../account.js"></script>
<script src="../avatar.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nebula Blaster</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #05030f; overflow: hidden; touch-action: none; }
  body { font-family: 'Press Start 2P', monospace; color: #fff; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 100%; height: 100%; max-width: 560px; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 24px; background: radial-gradient(ellipse at center, rgba(40,10,80,.55), rgba(5,3,15,.88)); }
  .hidden { display: none; }
  h1 { font-size: clamp(22px, 7vw, 38px); line-height: 1.3; background: linear-gradient(180deg,#ffe36e,#ff5fd2 60%,#7b5cff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 12px rgba(255,95,210,.5)); }
  p { font-size: 10px; line-height: 2; color: #c9bfff; max-width: 360px; }
  .big { font-size: 14px; color: #fff; }
  button { font-family: inherit; font-size: 13px; padding: 16px 26px; border: 3px solid #ff5fd2; background: #1a0b33; color: #fff; cursor: pointer; border-radius: 6px; box-shadow: 0 0 18px rgba(255,95,210,.5), inset 0 0 10px rgba(255,95,210,.3); }
  button:hover { background: #2c1157; }
  .keys { font-size: 9px; color: #8f84c9; line-height: 2.2; }
  .pw { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 8px; color: #c9bfff; }
  .pw span b { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="start" class="overlay">
    <h1>NEBULA<br>BLASTER</h1>
    <p>Blast asteroids and alien ships. Grab power-ups. Survive the boss every 5 waves!</p>
    <div class="pw">
      <span><b style="background:#4dfcff"></b>Triple shot</span>
      <span><b style="background:#7dff6a"></b>Shield</span>
      <span><b style="background:#ff4d6d"></b>Extra life</span>
      <span><b style="background:#ffe36e"></b>Bomb</span>
    </div>
    <button id="playBtn">▶ PLAY</button>
    <div class="keys">← → ↑ ↓ / WASD to move · auto-fire<br>SPACE = bomb · P = pause<br>On phone: drag your finger to fly</div>
    <p id="bestStart"></p>
  </div>

  <div id="over" class="overlay hidden">
    <h1>GAME OVER</h1>
    <p class="big" id="finalScore"></p>
    <p id="finalBest"></p>
    <button id="againBtn">↻ PLAY AGAIN</button>
  </div>

  <div id="paused" class="overlay hidden">
    <h1>PAUSED</h1>
    <button id="resumeBtn">▶ RESUME</button>
  </div>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- storage ----------
function getBest() { try { return +localStorage.getItem('nebulaBest') || 0; } catch(e) { return 0; } }
function setBest(v) { try { localStorage.setItem('nebulaBest', v); } catch(e) {} }
const bestStartEl = document.getElementById('bestStart');
if (getBest()) bestStartEl.textContent = 'BEST: ' + getBest();

// ---------- sound ----------
let ac = null;
function initAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e) { ac = null; } }
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function boom(big) {
  if (!ac) return;
  const len = big ? 0.6 : 0.25;
  const buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const s = ac.createBufferSource(), g = ac.createGain();
  g.gain.value = big ? 0.25 : 0.12;
  s.buffer = buf; s.connect(g); g.connect(ac.destination); s.start();
}

// ---------- input ----------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key === ' ' && state === 'play') useBomb();
  if (e.key.toLowerCase() === 'p') togglePause();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let touch = null;
cv.addEventListener('pointerdown', e => { touch = { x: e.offsetX, y: e.offsetY, px: player.x, py: player.y }; });
cv.addEventListener('pointermove', e => {
  if (!touch) return;
  player.x = clamp(touch.px + (e.offsetX - touch.x) * 1.3, 16, W - 16);
  player.y = clamp(touch.py + (e.offsetY - touch.y) * 1.3, 40, H - 24);
});
window.addEventListener('pointerup', () => touch = null);
// double-tap for bomb
let lastTap = 0;
cv.addEventListener('pointerdown', () => { const t = performance.now(); if (t - lastTap < 300 && state === 'play') useBomb(); lastTap = t; });

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- background ----------
const stars = [];
for (let i = 0; i < 140; i++) stars.push({ x: Math.random(), y: Math.random(), z: rand(0.2, 1) });
const nebulae = [
  { x: 0.2, y: 0.3, r: 0.5, c: 'rgba(255,60,200,0.10)' },
  { x: 0.8, y: 0.7, r: 0.6, c: 'rgba(90,70,255,0.12)' },
  { x: 0.5, y: 1.1, r: 0.5, c: 'rgba(0,220,255,0.08)' },
];

// ---------- game state ----------
let state = 'menu';
let player, bullets, enemies, eBullets, parts, powers, floaters;
let score, lives, wave, waveTimer, spawnLeft, shake, bombs, boss, flash, combo, comboTimer;

function reset() {
  player = { x: W / 2, y: H - 80, r: 14, cool: 0, triple: 0, shield: 0, inv: 2 };
  bullets = []; enemies = []; eBullets = []; parts = []; powers = []; floaters = [];
  score = 0; lives = 3; wave = 0; shake = 0; bombs = 2; boss = null; flash = 0; combo = 0; comboTimer = 0;
  nextWave();
}

function nextWave() {
  wave++;
  waveTimer = 2.2;
  if (wave % 5 === 0) { spawnLeft = 0; spawnBoss(); floater(W / 2, H / 2, '⚠ BOSS WAVE ⚠', '#ff4d6d', 28); }
  else { spawnLeft = 8 + wave * 3; floater(W / 2, H / 2, 'WAVE ' + wave, '#ffe36e', 22); }
}

function spawnBoss() {
  const lvl = wave / 5;
  boss = { x: W / 2, y: -80, ty: 110, r: 46, hp: 60 + lvl * 50, max: 60 + lvl * 50, t: 0, lvl, hit: 0 };
  beep(90, 1, 'sawtooth', 0.08, -40);
}

function spawnEnemy() {
  const roll = Math.random();
  const sp = 1 + wave * 0.08;
  if (roll < 0.45) { // asteroid
    const r = rand(14, 28);
    enemies.push({ kind: 'rock', x: rand(r, W - r), y: -r, vx: rand(-30, 30), vy: rand(60, 120) * sp, r, hp: Math.ceil(r / 9), rot: 0, vr: rand(-2, 2), pts: 10, shape: Array.from({ length: 9 }, () => rand(0.75, 1.15)) });
  } else if (roll < 0.8 || wave < 2) { // zigzag saucer
    enemies.push({ kind: 'saucer', x: rand(30, W - 30), y: -20, vy: rand(70, 100) * sp, r: 16, hp: 2, t: rand(0, 6), amp: rand(60, 140), cx: 0, pts: 25, fire: rand(1, 3) });
    enemies[enemies.length - 1].cx = enemies[enemies.length - 1].x;
  } else { // diver
    enemies.push({ kind: 'diver', x: rand(30, W - 30), y: -20, vx: 0, vy: 50, r: 14, hp: 3, t: 0, pts: 40, locked: false });
  }
}

function burst(x, y, color, n = 16, spd = 200) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.8), max: 0.8, c: color, sz: rand(1.5, 4) });
  }
}
function floater(x, y, text, c, size = 12) { floaters.push({ x, y, text, c, size, life: 1.4 }); }

function dropPower(x, y) {
  if (Math.random() > 0.14) return;
  const types = ['triple', 'triple', 'shield', 'shield', 'life', 'bomb'];
  powers.push({ x, y, type: types[Math.floor(Math.random() * types.length)], t: 0 });
}
const powerColor = { triple: '#4dfcff', shield: '#7dff6a', life: '#ff4d6d', bomb: '#ffe36e' };

function useBomb() {
  if (bombs <= 0) return;
  bombs--; flash = 1; shake = 18; boom(true);
  beep(200, 0.6, 'sawtooth', 0.1, -180);
  enemies.forEach(e => { score += e.pts; burst(e.x, e.y, '#ffe36e', 20); });
  enemies = []; eBullets = [];
  if (boss) { boss.hp -= 25; boss.hit = 0.2; }
}

function hurtPlayer() {
  if (player.inv > 0) return;
  if (player.shield > 0) { player.shield = 0; player.inv = 1; beep(500, 0.3, 'triangle', 0.08, -300); burst(player.x, player.y, '#7dff6a', 24); return; }
  lives--; shake = 20; boom(true); burst(player.x, player.y, '#ff5fd2', 40, 300);
  player.inv = 2.5; player.triple = 0; combo = 0;
  if (lives <= 0) gameOver();
}

function gameOver() {
  state = 'over';
  const best = Math.max(getBest(), score);
  setBest(best);
  document.getElementById('finalScore').textContent = 'SCORE: ' + score;
  document.getElementById('finalBest').textContent = (score >= best && score > 0 ? '★ NEW BEST! ★' : 'BEST: ' + best) + '  ·  WAVE ' + wave;
  setTimeout(() => document.getElementById('over').classList.remove('hidden'), 900);
}

function addScore(p, x, y) {
  combo++; comboTimer = 1.5;
  const mult = 1 + Math.floor(combo / 10);
  score += p * mult;
  if (mult > 1) floater(x, y, '+' + p * mult, '#ffe36e', 9);
}

// ---------- update ----------
function update(dt) {
  // stars
  stars.forEach(s => { s.y += dt * s.z * 0.25; if (s.y > 1) { s.y = 0; s.x = Math.random(); } });

  if (state !== 'play' && state !== 'over') return;

  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 2);
  comboTimer -= dt; if (comboTimer <= 0) combo = 0;

  if (state === 'play') {
    // player move
    const sp = 330;
    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a']) dx--;
    if (keys['arrowright'] || keys['d']) dx++;
    if (keys['arrowup'] || keys['w']) dy--;
    if (keys['arrowdown'] || keys['s']) dy++;
    player.x = clamp(player.x + dx * sp * dt, 16, W - 16);
    player.y = clamp(player.y + dy * sp * dt, 40, H - 24);
    player.inv -= dt; player.triple -= dt; player.shield -= dt;

    // auto fire
    player.cool -= dt;
    if (player.cool <= 0) {
      player.cool = 0.14;
      bullets.push({ x: player.x, y: player.y - 18, vx: 0, vy: -620 });
      if (player.triple > 0) {
        bullets.push({ x: player.x - 8, y: player.y - 12, vx: -140, vy: -600 });
        bullets.push({ x: player.x + 8, y: player.y - 12, vx: 140, vy: -600 });
      }
      beep(880, 0.05, 'square', 0.015, -400);
    }
    // engine trail
    parts.push({ x: player.x + rand(-4, 4), y: player.y + 16, vx: rand(-20, 20), vy: rand(120, 200), life: 0.3, max: 0.3, c: Math.random() < 0.5 ? '#ff5fd2' : '#ffe36e', sz: rand(2, 4) });
  }

  // waves
  if (waveTimer > 0) waveTimer -= dt;
  else if (spawnLeft > 0) {
    if (Math.random() < dt * (1.4 + wave * 0.15)) { spawnEnemy(); spawnLeft--; }
  } else if (!boss && enemies.length === 0 && state === 'play') nextWave();

  // bullets
  bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

  // enemies
  enemies.forEach(e => {
    if (e.kind === 'rock') { e.x += e.vx * dt; e.y += e.vy * dt; e.rot += e.vr * dt; if (e.x < e.r || e.x > W - e.r) e.vx *= -1; }
    else if (e.kind === 'saucer') {
      e.t += dt; e.y += e.vy * dt; e.x = clamp(e.cx + Math.sin(e.t * 2) * e.amp, 20, W - 20);
      e.fire -= dt;
      if (e.fire <= 0 && e.y > 0 && e.y < H * 0.7) {
        e.fire = rand(1.6, 3) / (1 + wave * 0.05);
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, c: '#ff4d6d' });
        beep(300, 0.08, 'triangle', 0.02);
      }
    } else if (e.kind === 'diver') {
      e.t += dt;
      if (e.t < 1.2) e.y += 60 * dt;
      else {
        if (!e.locked) { e.locked = true; const a = Math.atan2(player.y - e.y, player.x - e.x); e.vx = Math.cos(a) * 380; e.vy = Math.sin(a) * 380; beep(600, 0.2, 'sawtooth', 0.03, 400); }
        e.x += e.vx * dt; e.y += e.vy * dt;
      }
    }
    // hit by bullets
    bullets.forEach(b => {
      if (!b.dead && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        b.dead = true; e.hp--; e.flash = 0.08;
        burst(b.x, b.y, '#fff', 4, 80);
        if (e.hp <= 0 && !e.dead) {
          e.dead = true; addScore(e.pts, e.x, e.y); boom(false);
          burst(e.x, e.y, e.kind === 'rock' ? '#c9a77a' : e.kind === 'saucer' ? '#4dfcff' : '#ff5fd2', 22);
          shake = Math.max(shake, 5);
          if (e.kind === 'rock' && e.r > 20) for (let k = 0; k < 2; k++) enemies.push({ kind: 'rock', x: e.x, y: e.y, vx: rand(-90, 90), vy: rand(80, 150), r: e.r * 0.55, hp: 1, rot: 0, vr: rand(-3, 3), pts: 5, shape: Array.from({ length: 9 }, () => rand(0.75, 1.15)) });
          dropPower(e.x, e.y);
        }
      }
    });
    if (e.flash) e.flash -= dt;
    // hit player
    if (state === 'play' && !e.dead && Math.hypot(player.x - e.x, player.y - e.y) < e.r + player.r * 0.7) {
      if (player.inv <= 0) { e.dead = true; burst(e.x, e.y, '#fff', 16); }
      hurtPlayer();
    }
  });
  enemies = enemies.filter(e => !e.dead && e.y < H + 60 && e.y > -200 && e.x > -60 && e.x < W + 60);

  // boss
  if (boss) {
    const b = boss;
    b.t += dt; b.hit -= dt;
    b.y += (b.ty - b.y) * dt * 1.5;
    b.x = W / 2 + Math.sin(b.t * 0.8) * (W / 2 - 70);
    if (b.y > 60) {
      // patterns
      const rate = 1.1 - Math.min(0.5, b.lvl * 0.1);
      if (Math.floor(b.t / rate) !== Math.floor((b.t - dt) / rate)) {
        const n = 10 + b.lvl * 2, off = b.t;
        for (let i = 0; i < n; i++) { const a = off + i * Math.PI * 2 / n; eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, c: '#ff5fd2' }); }
        beep(150, 0.15, 'sawtooth', 0.03);
      }
      if (Math.floor(b.t / 0.25) !== Math.floor((b.t - dt) / 0.25) && Math.floor(b.t) % 4 === 0) {
        const a = Math.atan2(player.y - b.y, player.x - b.x);
        eBullets.push({ x: b.x, y: b.y + 30, vx: Math.cos(a) * 280, vy: Math.sin(a) * 280, c: '#ffe36e' });
      }
    }
    bullets.forEach(bl => {
      if (!bl.dead && Math.hypot(bl.x - b.x, bl.y - b.y) < b.r) { bl.dead = true; b.hp--; b.hit = 0.06; score += 2; burst(bl.x, bl.y, '#ff5fd2', 3, 90); }
    });
    if (state === 'play' && Math.hypot(player.x - b.x, player.y - b.y) < b.r + 10) hurtPlayer();
    if (b.hp <= 0) {
      score += 500 * b.lvl; floater(b.x, b.y, '+' + 500 * b.lvl, '#ffe36e', 18);
      for (let i = 0; i < 6; i++) setTimeout(() => { burst(b.x + rand(-40, 40), b.y + rand(-30, 30), ['#ff5fd2', '#ffe36e', '#4dfcff'][i % 3], 40, 320); boom(true); }, i * 120);
      shake = 30; flash = 0.8;
      powers.push({ x: b.x - 30, y: b.y, type: 'life', t: 0 }, { x: b.x + 30, y: b.y, type: 'triple', t: 0 });
      bombs = Math.min(bombs + 1, 5);
      boss = null; eBullets = [];
    }
  }

  // enemy bullets
  eBullets.forEach(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (state === 'play' && Math.hypot(b.x - player.x, b.y - player.y) < player.r * 0.6 + 4) { b.dead = true; hurtPlayer(); }
  });
  eBullets = eBullets.filter(b => !b.dead && b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);

  // power-ups
  powers.forEach(p => {
    p.t += dt; p.y += 70 * dt; p.x += Math.sin(p.t * 3) * 0.6;
    if (state === 'play' && Math.hypot(p.x - player.x, p.y - player.y) < 26) {
      p.dead = true;
      beep(660, 0.1, 'triangle', 0.06); setTimeout(() => beep(990, 0.15, 'triangle', 0.06), 80);
      if (p.type === 'triple') { player.triple = 10; floater(p.x, p.y, 'TRIPLE SHOT!', powerColor.triple); }
      if (p.type === 'shield') { player.shield = 12; floater(p.x, p.y, 'SHIELD!', powerColor.shield); }
      if (p.type === 'life') { lives = Math.min(lives + 1, 6); floater(p.x, p.y, '+1 LIFE!', powerColor.life); }
      if (p.type === 'bomb') { bombs = Math.min(bombs + 1, 5); floater(p.x, p.y, '+1 BOMB!', powerColor.bomb); }
    }
  });
  powers = powers.filter(p => !p.dead && p.y < H + 20);

  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; p.life -= dt; });
  parts = parts.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= 30 * dt; f.life -= dt; });
  floaters = floaters.filter(f => f.life > 0);
}

// ---------- draw ----------
const SHIPC = (() => { try { if (window.ArcadeAvatar) { const c = ArcadeAvatar.colors(); return { body: c.shirt, wing: c.hat === 'none' ? c.pants : c.hatC }; } } catch (e) {} return { body: '#ff5fd2', wing: '#7b5cff' }; })();
function drawShip(x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = '#ff5fd2'; ctx.shadowBlur = 16;
  // wings
  ctx.fillStyle = SHIPC.wing;
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-17, 14); ctx.lineTo(-6, 10); ctx.lineTo(0, 14); ctx.lineTo(6, 10); ctx.lineTo(17, 14); ctx.closePath(); ctx.fill();
  // body
  const g = ctx.createLinearGradient(0, -20, 0, 14);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, SHIPC.body);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-7, 10); ctx.lineTo(7, 10); ctx.closePath(); ctx.fill();
  // cockpit
  ctx.shadowBlur = 0; ctx.fillStyle = '#4dfcff';
  ctx.beginPath(); ctx.ellipse(0, -4, 2.6, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.save();
  ctx.fillStyle = '#05030f'; ctx.fillRect(0, 0, W, H);
  nebulae.forEach(n => {
    const g = ctx.createRadialGradient(n.x * W, n.y * H, 0, n.x * W, n.y * H, n.r * Math.max(W, H));
    g.addColorStop(0, n.c); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${s.z})`; ctx.fillRect(s.x * W, s.y * H, s.z * 2, s.z * 2 + (state === 'play' ? s.z * 3 : 0)); });

  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.4, rand(-shake, shake) * 0.4);

  if (state === 'play' || state === 'over' || state === 'paused') {
    // power-ups
    powers.forEach(p => {
      const c = powerColor[p.type];
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.shadowColor = c; ctx.shadowBlur = 18;
      ctx.strokeStyle = c; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 11 + Math.sin(p.t * 6) * 1.5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = c; ctx.font = '10px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText({ triple: 'T', shield: 'S', life: '♥', bomb: 'B' }[p.type], 0.5, 1);
      ctx.restore();
    });

    // bullets
    ctx.shadowBlur = 12; ctx.shadowColor = '#4dfcff'; ctx.fillStyle = '#bffeff';
    bullets.forEach(b => ctx.fillRect(b.x - 2, b.y - 8, 4, 14));
    eBullets.forEach(b => { ctx.shadowColor = b.c; ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill(); });
    ctx.shadowBlur = 0;

    // enemies
    enemies.forEach(e => {
      ctx.save(); ctx.translate(e.x, e.y);
      const hit = e.flash > 0;
      if (e.kind === 'rock') {
        ctx.rotate(e.rot);
        ctx.fillStyle = hit ? '#fff' : '#6b5844'; ctx.strokeStyle = '#c9a77a'; ctx.lineWidth = 2;
        ctx.beginPath();
        e.shape.forEach((m, i) => { const a = i / e.shape.length * Math.PI * 2; const px = Math.cos(a) * e.r * m, py = Math.sin(a) * e.r * m; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(e.r * 0.25, -e.r * 0.2, e.r * 0.25, 0, Math.PI * 2); ctx.fill();
      } else if (e.kind === 'saucer') {
        ctx.shadowColor = '#4dfcff'; ctx.shadowBlur = 14;
        ctx.fillStyle = hit ? '#fff' : '#2fb3c4';
        ctx.beginPath(); ctx.ellipse(0, 2, 18, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = hit ? '#fff' : '#bffeff';
        ctx.beginPath(); ctx.ellipse(0, -3, 8, 7, 0, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#ffe36e';
        for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 9, 3, 2, 0, Math.PI * 2); ctx.fill(); }
      } else {
        ctx.rotate(e.locked ? Math.atan2(e.vy, e.vx) - Math.PI / 2 : 0);
        ctx.shadowColor = '#ff5fd2'; ctx.shadowBlur = 14;
        ctx.fillStyle = hit ? '#fff' : '#c2186b';
        ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(-13, -10); ctx.lineTo(0, -4); ctx.lineTo(13, -10); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffe36e'; ctx.beginPath(); ctx.arc(0, 2, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    });

    // boss
    if (boss) {
      const b = boss;
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 30;
      ctx.fillStyle = b.hit > 0 ? '#fff' : '#3a0f4f';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + b.t * 0.5; const rr = i % 2 ? b.r * 0.75 : b.r; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ff5fd2'; ctx.lineWidth = 3; ctx.stroke();
      const eg = ctx.createRadialGradient(0, 0, 2, 0, 0, 20);
      eg.addColorStop(0, '#fff'); eg.addColorStop(0.4, '#ff4d6d'); eg.addColorStop(1, '#5a0020');
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000'; const lx = clamp((player.x - b.x) / 40, -6, 6), ly = clamp((player.y - b.y) / 40, -6, 6);
      ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // hp bar
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(40, 54, W - 80, 8);
      ctx.fillStyle = '#ff4d6d'; ctx.fillRect(40, 54, (W - 80) * Math.max(0, b.hp / b.max), 8);
    }

    // player
    if (state !== 'over' && lives > 0 && (player.inv <= 0 || Math.floor(player.inv * 12) % 2 === 0)) {
      drawShip(player.x, player.y);
      if (player.shield > 0) {
        ctx.strokeStyle = `rgba(125,255,106,${player.shield < 2 ? (Math.floor(player.shield * 8) % 2 ? 0.9 : 0.2) : 0.8})`;
        ctx.lineWidth = 2.5; ctx.shadowColor = '#7dff6a'; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.arc(player.x, player.y, 26, 0, Math.PI * 2); ctx.stroke(); ctx.shadowBlur = 0;
      }
    }

    // particles
    parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.sz, p.sz); });
    ctx.globalAlpha = 1;

    // floaters
    ctx.textAlign = 'center';
    floaters.forEach(f => { ctx.globalAlpha = Math.min(1, f.life); ctx.fillStyle = f.c; ctx.font = f.size + 'px "Press Start 2P"'; ctx.shadowColor = f.c; ctx.shadowBlur = 10; ctx.fillText(f.text, f.x, f.y); });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    // HUD
    ctx.textAlign = 'left'; ctx.font = '12px "Press Start 2P"'; ctx.fillStyle = '#fff';
    ctx.fillText(String(score).padStart(6, '0'), 14, 28);
    ctx.font = '8px "Press Start 2P"'; ctx.fillStyle = '#8f84c9';
    ctx.fillText('WAVE ' + wave, 14, 44);
    if (combo >= 10) { ctx.fillStyle = '#ffe36e'; ctx.fillText('x' + (1 + Math.floor(combo / 10)) + ' COMBO', 90, 44); }
    ctx.textAlign = 'right'; ctx.font = '13px sans-serif';
    ctx.fillStyle = '#ff4d6d'; ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 14, 26);
    ctx.font = '8px "Press Start 2P"'; ctx.fillStyle = '#ffe36e';
    ctx.fillText('BOMB ' + '●'.repeat(bombs), W - 14, 44);
  }

  if (flash > 0) { ctx.fillStyle = `rgba(255,240,200,${flash * 0.6})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function loop(t) {
  const dt = Math.min(0.033, (t - last) / 1000); last = t;
  if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- UI ----------
function start() {
  initAudio(); resize(); reset(); state = 'play';
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
}
function togglePause() {
  if (state === 'play') { state = 'paused'; document.getElementById('paused').classList.remove('hidden'); }
  else if (state === 'paused') { state = 'play'; document.getElementById('paused').classList.add('hidden'); }
}
document.getElementById('playBtn').onclick = start;
document.getElementById('againBtn').onclick = start;
document.getElementById('resumeBtn').onclick = togglePause;
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
</script>
</body>
</html>
