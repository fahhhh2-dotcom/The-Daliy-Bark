<!doctype html><html><head>
<script src="../account.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deep Blue Fishing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen game. Top bar, ocean canvas filling the middle, big thumb controls, tab bar for Book / Tank / Shop */
:root{
  --deep:#04223a; --panel:#0b3554; --panel2:#0f4468; --line:#1f6189;
  --foam:#eaf8fc; --mute:#93bdd2; --sun:#ffc93c; --coral:#ff6b4a; --kelp:#46d38b;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--deep);color:var(--foam);font-family:var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:1.45rem;letter-spacing:.01em;color:var(--foam);line-height:1}
.brand span{color:var(--sun)}
.right{display:flex;align-items:center;gap:8px}
.mbtn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.mbtn svg{width:20px;height:20px;fill:var(--sun);stroke:var(--coral)}
.mbtn .wave{stroke:var(--sun)}
.mbtn[aria-pressed="false"] .wave{display:none}
.mbtn .off{display:none}
#loader{position:fixed;inset:0;z-index:999;background:#7cc8ec;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;transition:opacity .5s}
#loader.out{opacity:0;pointer-events:none}
#ldCv{position:absolute;inset:0;width:100%;height:100%}
.ldBox{position:relative;width:min(440px,calc(100% - 32px));margin-bottom:max(18px,env(safe-area-inset-bottom));background:rgba(4,34,58,.88);border:2px solid var(--line);border-radius:18px;padding:14px 16px 16px;text-align:center;backdrop-filter:blur(4px)}
.ldTitle{font-family:var(--display);font-size:1.7rem;margin:0 0 10px;color:var(--foam)}
.ldTitle span{color:var(--sun)}
.ldBar{height:12px;border-radius:8px;background:#06263f;border:2px solid var(--line);overflow:hidden}
#ldFill{height:100%;width:0;background:linear-gradient(90deg,var(--kelp),var(--sun));border-radius:6px;transition:width .2s}
.ldTxt{margin:6px 0 10px;color:var(--mute);font-size:.9rem}
.ldTip{background:#fff3c4;color:#4a3500;border-radius:12px;padding:10px 12px;font-size:.92rem;line-height:1.35;text-align:left}
.ldTip b{color:#7a4a00}
#ldCode{margin-top:8px;width:100%}
.ldBtns{display:flex;gap:8px;margin-top:10px}
.ldBtns .btn{flex:1}

@keyframes beat{50%{transform:scale(1.08)}}
.mbtn[aria-pressed="false"] svg{fill:var(--mute)}
.mbtn[aria-pressed="false"] .off{display:block}
.money{font-family:var(--display);font-size:1.25rem;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--sun);font-variant-numeric:tabular-nums}
#stage{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#0d5c8a}
#game{display:block;width:100%;height:100%;touch-action:none}
.travel{position:absolute;left:calc(50% - 50px);bottom:48px;max-width:calc(100% - 130px);overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);z-index:4;border:none;border-radius:999px;padding:10px 18px;font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;background:linear-gradient(180deg,#ffb03a,#ff5a1a);color:#3a0e00;box-shadow:0 4px 0 #a8360e;white-space:nowrap}
.travel.home{background:linear-gradient(180deg,#7fe3d6,#1f8fc0);color:#032a3a;box-shadow:0 4px 0 #13607f}
.travel.locked{background:#3a2a24;color:#ffc93c;box-shadow:0 4px 0 #1a120e}
.travel.sure{background:#ff5a1a;color:#fff}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(4,34,58,.88);border:2px solid var(--sun);color:var(--foam);padding:6px 14px;border-radius:999px;font-weight:800;font-size:.9rem;max-width:92%;width:max-content;text-align:center;line-height:1.3;pointer-events:none;transition:opacity .3s;z-index:10;border-radius:16px}
.controls{display:grid;grid-template-columns:1fr;gap:8px}
.controls button{touch-action:none;border:none;border-radius:14px;height:60px;display:flex;align-items:center;justify-content:center}
.dir{background:var(--panel2);border:2px solid var(--line)!important}
.dir svg{width:28px;height:28px;fill:var(--foam)}
.dir.on,.dir:active{background:var(--line)}
#act{background:var(--sun);color:#3a2300;font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;box-shadow:0 4px 0 #b9851a}
#act.on{transform:translateY(3px);box-shadow:0 1px 0 #b9851a}
#act.fight{background:var(--coral);color:#fff;box-shadow:0 4px 0 #b4402a}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{font-size:.88rem}
.tabs button{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:900;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.tabs small{font-weight:700;color:var(--mute);font-size:.75rem;font-variant-numeric:tabular-nums}
.tabs button.active{background:var(--panel2);border-color:var(--sun)}

/* Sheets and modal */
.sheet{position:absolute;inset:0;background:rgba(4,30,52,.97);display:flex;flex-direction:column;z-index:5}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:2px solid var(--line);gap:10px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.01em}
.sheet-head p{margin:0;color:var(--mute);font-size:.85rem;font-weight:700}
.x{background:var(--panel2);border:2px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:1.3rem;font-weight:900;flex:none}
.sheet-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text}
.detail{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.detail canvas{width:100%;height:120px;display:block}
.detail h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem;text-wrap:balance}
.detail p{margin:0;line-height:1.45;font-size:.95rem;max-width:65ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--mute);font-weight:800;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:2px solid currentColor;width:max-content}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.cell{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cell canvas{width:100%;height:56px;display:block}
.cell b{font-size:.78rem;font-weight:900;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.cell i{font-style:normal;width:8px;height:8px;border-radius:50%}
.cell.sel{border-color:var(--sun)}
.tankview{width:100%;height:240px;flex:none;touch-action:none;display:block;border-radius:14px;border:2px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.row canvas{width:64px;height:40px;flex:none}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .txt b{font-weight:900}
.row .txt span{font-size:.8rem;color:var(--mute);font-weight:700}
.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:900;background:var(--sun);color:#3a2300;flex:none}
.btn.alt{background:var(--kelp);color:#06301a}
.btn:disabled{background:#2b4a60;color:#7f9bad;cursor:not-allowed}
.shopcard{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.shopcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shopcard h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.25rem}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:8px;border-radius:4px;background:#244c66}
.pips i.on{background:var(--sun)}
.shopcard p{margin:0;font-size:.9rem;color:var(--mute);line-height:1.4}
.shopcard .now{color:var(--foam);font-weight:800}
.empty{color:var(--mute);text-align:center;padding:16px;font-weight:700;line-height:1.5}
.how{color:var(--mute);font-size:.85rem;line-height:1.5;margin:0}

#catch{position:absolute;inset:0;background:rgba(2,18,32,.8);display:flex;align-items:center;justify-content:center;padding:14px;z-index:6}
.card{max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--sun);border-radius:18px;width:100%;max-width:380px;padding:14px;display:flex;flex-direction:column;gap:8px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.card canvas{width:100%;height:130px;display:block;border-radius:12px;background:radial-gradient(circle at 50% 50%,#1d6fa0,#0a3352)}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.05}
.card p{margin:0;line-height:1.45;font-size:.93rem}
.card .new{color:var(--sun);font-weight:900;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.card .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.btn.rel{grid-column:1/-1;background:transparent;border:2px solid var(--line);color:var(--foam)}
.row .btns2{display:flex;flex-direction:column;gap:4px;flex:none}
.row .btns2 .btn{padding:6px 10px;font-size:.82rem}
.btn.small{padding:6px 10px;font-size:.82rem}
.hurt{color:var(--coral);font-weight:900}
.card .btns .btn{padding:12px 8px}
h4.sec{margin:6px 0 -4px;font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--sun);letter-spacing:.03em;text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:10px}
.btn.feed{background:var(--kelp);color:#06301a;padding:12px;font-size:1rem}
.love{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.92rem}
.lovebar{flex:1;min-width:80px;height:10px;border-radius:5px;background:#244c66;overflow:hidden}
.lovebar i{display:block;height:100%;background:#ff7ab8;border-radius:5px}
.shopcard.decor{flex-direction:row;align-items:center;gap:12px}
.shopcard.decor canvas{width:96px;height:80px;border-radius:10px;flex:none}
.dtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#cSwap{flex-direction:column;gap:6px}
#cSwap:not([hidden]){display:flex}
#cSwap p{margin:4px 0 0;font-weight:800;font-size:.9rem}
.swaprow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px 8px;text-align:left;width:100%}
.swaprow canvas{width:52px;height:32px;flex:none}
.swaprow span{flex:1;min-width:0;font-weight:800;font-size:.85rem;line-height:1.25}
.swaprow small{display:block;color:var(--mute);font-weight:700}
.swaprow b{color:var(--sun);font-size:.85rem;flex:none}
.tankbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.sponge{background:#ffe066;color:#4a3a00;padding:12px 8px}
.btn.sponge.on{background:var(--coral);color:#fff}
.clean{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.85rem;color:var(--mute)}
.cleanbar{flex:1;height:10px;border-radius:5px;background:#244c66;overflow:hidden}
.cleanbar i{display:block;height:100%;width:100%;background:var(--kelp);border-radius:5px}
.btn.rel.warn{border-color:var(--coral);color:var(--coral)}
@media (max-width:430px){.brand{font-size:1.15rem}}
.live{font-weight:900;font-variant-numeric:tabular-nums;font-size:.95rem}
.tanknav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tanknav b{font-family:var(--display);font-weight:400;font-size:1.2rem;text-align:center;flex:1;min-width:0}
.tarrow{width:44px;height:40px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.tarrow svg{width:22px;height:22px;fill:var(--sun)}
.tarrow:disabled{opacity:.35;cursor:default}
.btn.alt.needs{background:#2b4a60;color:#cfe3ee}
.tcard.ice{border-color:#7fcfff;background:linear-gradient(160deg,#164a6e,#0b3554 70%)}
.tcard.ocean{border-color:#46b8d8}
.btn.tbtn.lava{background:linear-gradient(180deg,#ffb03a,#ff5a1a);color:#3a0e00}
.btn.tbtn.ice{background:linear-gradient(180deg,#f0fcff,#7fcfff);color:#03304a}
.btn.tbtn.ocean{background:linear-gradient(180deg,#7fe3d6,#1f8fc0);color:#032a3a}
.btn.tbtn:disabled{background:#2b4a60;color:#7f9bad}
.lavatag.ice{background:linear-gradient(180deg,#f0fcff,#7fcfff);color:#03304a}
.cell.lv.ice{border-color:#3a7aa0}
.tcard.lava,.lavacard{border-color:#ff7a2f;background:linear-gradient(160deg,#4a1a10,#0b3554 70%)}
.btn.lavabtn{background:linear-gradient(180deg,#ffb03a,#ff5a1a);color:#3a0e00}
.btn.lavabtn:disabled{background:#2b4a60;color:#7f9bad}
.mv{display:flex;flex-direction:column;gap:2px;font-size:.72rem;font-weight:800;color:var(--mute)}
.mv select{font:inherit;font-size:.82rem;font-weight:800;color:var(--foam);background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:5px 6px;max-width:130px}
.lavatag{display:inline-block;font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#3a0e00;background:linear-gradient(180deg,#ffb03a,#ff5a1a);border-radius:999px;padding:1px 6px;line-height:1.4}
.lavatag.big{font-size:.72rem;padding:2px 9px}
.cell{position:relative}
.cell .lavatag{position:absolute;top:4px;right:4px}
.cell.lv{border-color:#7a3a1a}
.cell.lv.sel{border-color:var(--sun)}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.savebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.savebox{width:100%;font:600 .75rem ui-monospace,Menlo,Consolas,monospace;color:var(--foam);background:var(--deep);border:2px solid var(--line);border-radius:10px;padding:8px;resize:vertical;word-break:break-all;-webkit-user-select:text;user-select:text}
.fmv{font:inherit;font-size:.78rem;font-weight:800;color:var(--foam);background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:4px 4px;max-width:110px}
.booktabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btab{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:900;line-height:1.15}
.btab small{font-weight:700;color:var(--mute);font-size:.72rem;font-variant-numeric:tabular-nums}
.btab svg{width:14px;height:14px;fill:var(--mute)}
.btab.on{border-color:var(--sun);background:var(--panel2)}
.btab.lava.on{border-color:#ff7a2f;background:linear-gradient(180deg,#4a1a10,#0f4468)}
.btab.ice.on{border-color:#7fcfff;background:linear-gradient(180deg,#1e5a80,#0f4468)}
.btab:disabled{opacity:.55;cursor:not-allowed}
.mutpill{font-weight:900;letter-spacing:.02em}
.mapbtn{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:10px;z-index:3;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:rgba(4,30,52,.85);color:var(--foam);border-radius:999px;padding:6px 12px 6px 9px;font-weight:900;font-size:.85rem}
.mapbtn svg{width:18px;height:18px;fill:var(--sun)}
.mapbtn.live{border-color:#7fe3d6;color:#7fe3d6}
.bigcode{font-family:var(--display);font-size:1.25rem;letter-spacing:.08em;word-break:break-all;-webkit-user-select:all;user-select:all;color:var(--sun);text-align:center;margin:4px 0}
.codein{font:inherit;font-family:var(--display);font-size:1.6rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--foam);background:var(--deep);border:2px solid var(--line);border-radius:12px;padding:8px;width:100%}
.nickin{font:inherit;font-size:1rem;font-weight:800;color:var(--foam);background:var(--deep);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
@media (max-height:620px){.controls button{height:50px}.tabs button{padding:5px 4px}}
</style>

<div id="loader" role="dialog" aria-label="Loading Deep Blue Fishing">
  <canvas id="ldCv" aria-hidden="true"></canvas>
  <div class="ldBox">
    <h1 class="ldTitle">Deep <span>Blue</span> Fishing</h1>
    <div class="ldBar"><div id="ldFill"></div></div>
    <p class="ldTxt" id="ldTxt">Loading the ocean…</p>
    <div class="ldTip"><b>Keep your save code!</b> It lets you get your fish and money back on any phone, tablet or computer. You can copy it here or in the Shop under <b>Your save</b>.</div>
    <textarea id="ldCode" class="savebox" rows="3" readonly hidden aria-label="Your save code"></textarea>
    <div class="ldBtns"><button class="btn alt" id="ldCopy">Copy my save code</button><button class="btn" id="ldPlay" disabled>Play!</button></div>
  </div>
</div>
<div id="app">
  <header class="bar">
    <div class="brand">Deep <span>Blue</span> Fishing</div>
    <div class="right">
      <button class="mbtn" id="sfxBtn" aria-label="Sounds on" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/><path class="off" d="M3 3l18 18" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <div class="money" aria-label="Money">$<span id="money">0</span></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" aria-label="Ocean fishing game"></canvas>
    <button id="visitBtn" class="mapbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 19c0-3 2.7-5.5 6-5.5s6 2.5 6 5.5v1H2zm13.5 1v-1c0-1.9-.8-3.6-2-4.8.8-.4 1.6-.7 2.5-.7 2.8 0 5 2 5 4.6V20z"/></svg><span id="visitLbl">Visit</span></button>
    <div id="toast" style="opacity:0"></div>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-head">
        <div><h2 id="sheetTitle">Fish Book</h2><p id="sheetSub"></p></div>
        <button class="x" id="closeSheet" aria-label="Close">×</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>

    <button id="travel" class="travel" hidden></button>
    <div id="catch" hidden>
      <div class="card">
        <span class="new" id="cNew">New in your Fish Book!</span>
        <canvas id="cCanvas"></canvas>
        <span class="badge" id="cRarity">Common</span>
        <h3 id="cName">Sardine</h3>
        <div class="meta" id="cMeta"></div>
        <p id="cFact"></p>
        <div class="btns">
          <button class="btn alt" id="cKeep">Put in tank</button>
          <button class="btn" id="cSell">Sell</button>
          <button class="btn rel" id="cRelease">Release back into the ocean</button>
        </div>
        <div id="cSwap" class="swap" hidden></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="act">CAST</button>

}
function spawnSpot(){

/* ---------- Casting ---------- */
function castAt(x,y){
  sfx.cast();
  const dx=x-boat.x,dy=y-boat.y,dist=Math.hypot(dx,dy);
  if(dist>castR()){x=boat.x+dx/dist*castR();y=boat.y+dy/dist*castR();}
  x=clamp(x,8,WORLD-8);y=clamp(y,8,WORLD-8);
  const tip=rodTip();boat.tx=null;
  Object.assign(hook,{state:'fly',sx:tip.x,sy:tip.y,ex:x,ey:y,x:tip.x,y:tip.y,t:0,spot:null});
  boat.a=Math.atan2(y-boat.y,x-boat.x)-Math.PI/2;
}
function autoCast(){
  let best=null,bd=1e9;
  for(const s of spots){const d=Math.hypot(s.x-boat.x,s.y-boat.y);if(d<=castR()+12&&d<bd){bd=d;best=s;}}
  if(best)castAt(best.x+rand(-5,5),best.y+rand(-5,5));
  else{const a=boat.a;castAt(boat.x+Math.cos(a)*castR()*.8,boat.y+Math.sin(a)*castR()*.8);}
}
function landBobber(){
  hook.state='wait';hook.x=hook.ex;hook.y=hook.ey;
  splashes.push({x:hook.x,y:hook.y,t:0});
  if(onIsland(hook.x,hook.y,-4)){sfx.sand();}else sfx.plop();
  if(onIsland(hook.x,hook.y,-4)){toast('That landed on the sand! Reel in and try the water.');return;}
  const s=spots.find(s=>Math.hypot(s.x-hook.x,s.y-hook.y)<30);
  if(s){
    if(s.d>uv('line')+.001){toast(`Too deep! Your line reaches ${Math.round(uv('line')*MAX_M)} m, but this water is ${Math.round(s.d*MAX_M)} m.`);return;}
    hook.spot=s;hook.wait=rand(.8,2.2)*(frenzy()?.5:1);return;
  }
  // open water: fish can still bite, just slower than at bubbles
  const d=depthAt(hook.x,hook.y);
  if(d>uv('line')+.001){toast(`Too deep! Your line reaches ${Math.round(uv('line')*MAX_M)} m, but this water is ${Math.round(d*MAX_M)} m.`);return;}
  const sp=pickSpecies(clamp(d+rand(-.03,.03),.02,1),zoneAt(hook.x,hook.y));if(!sp)return;
  hook.spot={x:hook.x,y:hook.y,d,sp,huge:sp.r<7&&Math.random()<.03*uv('luck'),virtual:true};hook.wait=frenzy()?rand(1.2,3.5):rand(3.5,9);
  if((openHints=(openHints||0)+1)<=2)toast('Waiting for a bite... Fish bite faster at bubbles!');
}
let openHints=0;
function reelIn(){hook.state='idle';hook.spot=null;}

/* ---------- Input ---------- */
function actDown(){if(paused)return;input.a=true;$('act').classList.add('on');

}
function actUp(){input.a=false;castHold=false;$('act').classList.remove('on');}
function bindHold(el,down,up){

bindHold($('act'),actDown,actUp);
bindHold(cv,e=>{

  if(hook.state==='idle'){const cb=crewBoats.find(q=>Math.hypot(q.x-x,q.y-y)<30);if(cb){openSheet('bucket');return;}const o=others().find(q=>Math.hypot(q.x-x,q.y-y)<34);if(o){visitPeer=o.peer;openSheet('visit');return;}

  }
  if(onIsland(x,y,14)){toast("That's an island. Your boat can't sail on sand!");return;}

const keys={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};

/* ---------- Fight ---------- */
function startFight(){
  const s=hook.spot;if(!s)return;sfx.hook();
  fight={treasure:!s.huge&&s.sp.r<5&&Math.random()<.03*uv('luck'),sp:s.sp,huge:!!s.huge,s:s.sp.s*(s.huge?1.6:1),d0:s.d,pos:.5,target:rand(.15,.85),timer:.6,zone:.5,vel:0,progress:.3,inZone:false};
  hook.state='fight';castHold=false;
}
function updateFight(dt){
  const f=fight,R=RAR[f.sp.r],rk=S.rod/(UP.rod.val.length-1),zw=uv('rod')*(f.sp.ultra?.72:f.sp.r>=7?.85:1),half=zw/2;f.zw=zw;
  let spd=R.spd*(f.huge?1.2:1)*(1-.35*rk);
  if(f.dash>0){f.dash-=dt;spd*=2.6;}
  f.timer-=dt;if(f.timer<=0){f.target=rand(.06,.94);f.timer=rand(.45,1.4)/spd;
    if(f.sp.r>=4&&Math.random()<.18+.08*(f.sp.r-4)){f.dash=.35;f.target=f.pos>.5?rand(.03,.25):rand(.75,.97);}}
  const diff=f.target-f.pos;f.pos+=Math.sign(diff)*Math.min(Math.abs(diff),spd*.38*dt);
  f.vel=clamp(f.vel+(input.a?2.1:-2.1)*dt,-1.15,1.15);f.zone+=f.vel*dt;
  if(f.zone<half){f.zone=half;f.vel=-f.vel*.3;} if(f.zone>1-half){f.zone=1-half;f.vel=-f.vel*.3;}
  f.inZone=Math.abs(f.pos-f.zone)<half;
  sfx.reel(dt,f.inZone);
  const GAIN=[.3,.29,.26,.23,.19,.155,.135,.11][f.sp.r]*(f.sp.ultra?.8:1);
  f.progress+=f.inZone?(GAIN*(f.huge?.82:1)+.04*S.reel+.06*rk)*dt:-(.13+.06*f.sp.r+(f.huge?.05:0))*(1-.5*rk)*dt;
  const tip=rodTip(),k=clamp((f.progress-.3)/.7,0,1)*.85,s=hook.spot;
  if(s){hook.x=s.x+(tip.x-s.x)*k;hook.y=s.y+(tip.y-s.y)*k;}
  if(Math.random()<dt*10)splashes.push({x:hook.x+rand(-6,6),y:hook.y+rand(-6,6),t:.4});if(Math.random()<dt*1.5)sfx.splash();
  if(f.progress>=1&&f.treasure){const zi=zoneAt(hook.x,hook.y),cash=Math.round(rand(30,120)*(1+zi*1.2));removeSpot(hook.spot);fight=null;hook.state='idle';hook.spot=null;
    S.money+=cash;save();updateHud();sfx.catch(2);sfx.coins();toast(`You reeled up a sunken treasure chest! +$${cash}`);return;}
  if(f.progress>=1&&hook.spot&&hook.spot.test){const ts=hook.spot,sp=f.sp;spots=spots.filter(x=>x!==ts);fight=null;hook.state='idle';hook.spot=null;sfx.catch(7,true);sfx.sparkle();try{const d=testCaught();d[S.world+'-'+ts.test]=1;localStorage.setItem('dbf-test-caught',JSON.stringify(d));}catch(e){}toast(`TEST: You caught the ${sp.name}! (Not saved to your book, tank or money.)`);clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,6000);}
  else if(f.progress>=1){const sp=f.sp,hg=f.huge;removeSpot(hook.spot);fight=null;hook.state='idle';hook.spot=null;sfx.catch(sp.r,hg);showCatch(sp,hg);}
  else if(f.progress<=0){sfx.escape();toast(f.treasure?'Something heavy slipped off your hook!':`The ${f.huge?'huge ':''}${f.sp.name} got away!`);removeSpot(hook.spot);fight=null;hook.state='idle';hook.spot=null;}
}
function removeSpot(s){if(s&&s.test)return;spots=spots.filter(x=>x!==s);}

/* ---------- Update ---------- */
function update(dt){
  T+=dt;legendT-=dt;hintT-=dt;bumpT-=dt;
  {const near=false,tb=$('travel');
    if(tb.hidden===near){tb.hidden=!near;if(near){tb.dataset.sure='';paintTravel();}}
}
  if(weather.on){weather.t+=dt;if(weather.t>=weather.dur){weather.on=false;weather.next=360+Math.random()*540;toast(WEATHER[S.world].end);}}
  else{weather.next-=dt;if(weather.next<=0){weather.on=true;weather.t=0;weather.dur=80+Math.random()*50;toast(WEATHER[S.world].start);sfx.weather(S.world);}}
  if(weather.on&&S.world==='ocean'&&Math.random()<dt*3)sfx.rainTick();
  const nn=nightAmt()>.5;if(nn!==wasNight){wasNight=nn;toast(nn?'Night is falling. Rare fish come out at night!':'The sun is coming up.');}
  let mx=(input.r?1:0)-(input.l?1:0),my=(input.d?1:0)-(input.u?1:0);
  if(!fight&&(mx||my)){if(hook.state!=='idle')reelIn();boat.tx=boat.x+mx*30;boat.ty=boat.y+my*30;}
  boat.moving=false;
  if(!fight&&boat.tx!=null){
    const dx=boat.tx-boat.x,dy=boat.ty-boat.y,d=Math.hypot(dx,dy);
    if(d<3){boat.tx=null;}else{
      const want=Math.atan2(dy,dx);let da=((want-boat.a+Math.PI*3)%(Math.PI*2))-Math.PI;boat.a+=clamp(da,-4*dt,4*dt);
      const sp=Math.min(150*uv('engine'),d*3)*(.45+.55*Math.max(0,Math.cos(da)));
      boat.x+=Math.cos(boat.a)*sp*dt;boat.y+=Math.sin(boat.a)*sp*dt;boat.moving=sp>10;
      if(boat.moving&&Math.random()<dt*30)wake.push({x:boat.x-Math.cos(boat.a)*20,y:boat.y-Math.sin(boat.a)*20,t:0});
    }
  }
  boat.x=clamp(boat.x,18,WORLD-18);boat.y=clamp(boat.y,18,WORLD-18);
  for(const I of ISLANDS){const di=Math.hypot(boat.x-I.x,boat.y-I.y)||1;
    if(di<I.r+24){const k=(I.r+24)/di;boat.x=I.x+(boat.x-I.x)*k;boat.y=I.y+(boat.y-I.y)*k;}}
  // buoy line
  const R=zoneR(),dc=Math.hypot(boat.x-C.x,boat.y-C.y);
  if(dc>R-22){const k=(R-22)/dc;boat.x=C.x+(boat.x-C.x)*k;boat.y=C.y+(boat.y-C.y)*k;boat.tx=null;
    if(bumpT<=0){sfx.bump();toast(S.zone<ZONES.length-1?`Buoy line! Unlock "${ZONES[S.zone+1].n}" in the Shop to sail farther.`:'That\'s the edge of the map!');bumpT=3.5;}}
  updateCam();

  if(hook.state==='fly'){
    hook.t+=dt/.45;const p=Math.min(1,hook.t);
    hook.x=hook.sx+(hook.ex-hook.sx)*p;hook.y=hook.sy+(hook.ey-hook.sy)*p-Math.sin(p*Math.PI)*36;
    if(p>=1)landBobber();
  }else if(hook.state==='wait'){
    if(Math.hypot(hook.x-boat.x,hook.y-boat.y)>castR()+40)reelIn();
    else if(hook.spot){
      if(!hook.spot.virtual&&!spots.includes(hook.spot)){hook.spot=null;}
      else{hook.wait-=dt;if(hook.wait<=0){hook.state='bite';hook.biteT=1.25;splashes.push({x:hook.x,y:hook.y,t:0});sfx.bite();}}
    }
  }else if(hook.state==='bite'){
    hook.biteT-=dt;
    if(hook.biteT<=0){sfx.miss();toast('Too slow! Tap HOOK IT as soon as the bobber dips.');removeSpot(hook.spot);hook.spot=null;hook.state='wait';}
  }else if(hook.state==='fight')updateFight(dt);

  for(const s of spots){if(hook.spot!==s)s.age+=dt;
    if(s.sp.r>=2&&Math.random()<dt*s.sp.r*1.5)sparks.push({x:s.x+rand(-18,18),y:s.y+rand(-18,18),life:1,c:s.sp.black?'#d0103a':s.sp.r>=7?`hsl(${Math.random()*360},100%,72%)`:RAR[s.sp.r].c});}
  spots=spots.filter(s=>hook.spot===s||s.age<s.life);
  spawnT-=dt;if(spawnT<=0&&spots.length<maxSpots()){spawnSpot();spawnT=22/Math.max(1,maxSpots())*rand(.6,1.4);}
  for(const k in BOOSTS){const on=boostLeft(k)>0;if(boostWas[k]&&!on)toast(`Your ${BOOSTS[k].name} has ended.`);boostWas[k]=on;}
  for(const w of wake)w.t+=dt;wake=wake.filter(w=>w.t<1.4);updateCrewBoats(dt);
  for(const s of splashes)s.t+=dt;splashes=splashes.filter(s=>s.t<.8);
  for(const s of sparks)s.life-=dt*1.3;sparks=sparks.filter(s=>s.life>0);

  const a=$('act');
  const lbl={idle:'CAST',fly:'REEL IN',wait:'REEL IN',bite:'HOOK IT!',fight:'HOLD!'}[hook.state];
  if(a.textContent!==lbl)a.textContent=lbl;
  a.classList.toggle('fight',hook.state==='fight'||hook.state==='bite');
}

/* ---------- Render ---------- */
const inView=(x,y,m=80)=>x>cam.x-m&&x<cam.x+W+m&&y>cam.y-m&&y<cam.y+H+m;

  g.beginPath();g.moveTo(x-r*2,y);g.lineTo(x,y+r*.6);g.lineTo(x+r*2,y);g.lineTo(x,y-r*.6);g.closePath();g.fill();}
function drawIsleItem(id,x,y){

  case 'campfire':g.fillStyle='#7a5530';g.save();g.rotate(.5);g.fillRect(-7,-1.5,14,3);g.rotate(-1);g.fillRect(-7,-1.5,14,3);g.restore();
    {const fl=g.createRadialGradient(0,-2,0,0,-2,9+Math.sin(T*12)*1.5);fl.addColorStop(0,'#fff2a0');fl.addColorStop(.5,'#ff8a1a');fl.addColorStop(1,'rgba(255,60,0,0)');g.fillStyle=fl;ell(g,0,-2,9,9);g.fill();}break;
  case 'palms':for(const [px,py,s2] of [[-6,-3,.7],[6,2,.8],[0,7,.6]]){g.fillStyle='#2f8a3a';for(let i=0;i<6;i++){const a=i/6*Math.PI*2;g.beginPath();g.ellipse(px+Math.cos(a)*7*s2,py+Math.sin(a)*7*s2,8*s2,3*s2,a,0,Math.PI*2);g.fill();}g.fillStyle='#7a5530';ell(g,px,py,2.5*s2,2.5*s2);g.fill();}break;

  case 'house':sh();rr(g,-11,-8,24,20,2);g.fill();g.fillStyle='#f4f0e6';rr(g,-12,-9,24,20,2);g.fill();g.fillStyle='#2b6cb0';g.beginPath();g.moveTo(-14,-2);g.lineTo(0,-14);g.lineTo(14,-2);g.closePath();g.fill();g.fillStyle='#8ec5ff';g.fillRect(-8,0,5,5);g.fillRect(3,0,5,5);break;
  case 'fountain':g.fillStyle='#b8b0a4';ell(g,0,0,12,12);g.fill();g.fillStyle='#5ab8e8';ell(g,0,0,9,9);g.fill();g.fillStyle='#d8d0c4';ell(g,0,0,3,3);g.fill();

    {const a=T*1.5;g.fillStyle='rgba(255,240,150,.22)';g.beginPath();g.moveTo(0,0);g.arc(0,0,70,a-.18,a+.18);g.closePath();g.fill();}break;
  case 'statue':g.fillStyle='#8a7a5a';rr(g,-8,2,16,6,2);g.fill();g.save();g.rotate(-.5+Math.sin(T*2)*.05);const gs=g.createLinearGradient(-10,-8,10,4);gs.addColorStop(0,'#fff2a0');gs.addColorStop(1,'#d4a017');g.fillStyle=gs;
    g.beginPath();g.ellipse(0,-4,10,5,0,0,Math.PI*2);g.fill();g.beginPath();g.moveTo(-9,-4);g.lineTo(-15,-9);g.lineTo(-15,1);g.closePath();g.fill();g.restore();if(Math.random()<.04)sparks.push({x:x+rand(-10,10),y:y+rand(-10,4),life:1,c:'#ffe066'});break;
  case 'mansion':g.fillStyle='rgba(0,0,0,.18)';rr(g,-17,-11,36,26,3);g.fill();g.fillStyle='#f8f2e4';rr(g,-18,-12,36,26,3);g.fill();g.fillStyle='#7a2a6a';g.beginPath();g.moveTo(-20,-4);g.lineTo(-10,-17);g.lineTo(10,-17);g.lineTo(20,-4);g.closePath();g.fill();

function drawIsland(I,idx){

    g.fillStyle='rgba(210,245,255,.35)';ell(g,x,y,r+12,r+12);g.fill();
    g.fillStyle='#bfe6f6';g.beginPath();for(let i=0;i<=11;i++){const a=i/11*Math.PI*2,q=r*(.85+((i*37+idx*13)%30)/100),px=x+Math.cos(a)*q,py=y+Math.sin(a)*q;i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();g.fill();
    g.fillStyle='#f4fcff';g.beginPath();for(let i=0;i<=11;i++){const a=i/11*Math.PI*2,q=r*(.6+((i*53+idx*7)%25)/100),px=x-r*.08+Math.cos(a)*q,py=y-r*.1+Math.sin(a)*q;i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();g.fill();

    g.fillStyle='#2e2826';ell(g,x,y,r,r);g.fill();g.fillStyle='#4a3e36';ell(g,x,y,r*.72,r*.72);g.fill();
    g.strokeStyle='#ff6b1a';g.lineWidth=3;for(let i=0;i<4;i++){const a=i*1.6+.4;g.beginPath();g.moveTo(x+Math.cos(a)*r*.3,y+Math.sin(a)*r*.3);g.lineTo(x+Math.cos(a+.2)*r*.6,y+Math.sin(a+.2)*r*.6);g.lineTo(x+Math.cos(a-.1)*r*.92,y+Math.sin(a-.1)*r*.92);g.stroke();}
    const lg=g.createRadialGradient(x,y,0,x,y,r*.42);lg.addColorStop(0,'#fff2a0');lg.addColorStop(.45,'#ff7a1a');lg.addColorStop(1,'rgba(200,40,0,0)');g.fillStyle=lg;const p=1+Math.sin(T*3+idx)*.06;ell(g,x,y,r*.42*p,r*.42*p);g.fill();
    for(let i=0;i<3;i++){const k=((T*.25+i/3)%1);g.fillStyle=`rgba(90,90,100,${.35*(1-k)})`;ell(g,x+8+k*30,y-k*50,8+k*16,8+k*16);g.fill();}
    return;}
  if(I.type==='crystal'){
    const gl=g.createRadialGradient(x,y,r*.3,x,y,r+30);gl.addColorStop(0,'rgba(170,120,255,.35)');gl.addColorStop(1,'rgba(120,240,255,0)');g.fillStyle=gl;ell(g,x,y,r+30,r+30);g.fill();
    g.fillStyle='#e9e3f6';ell(g,x,y,r,r);g.fill();g.fillStyle='#d4c9ee';ell(g,x+r*.1,y+r*.1,r*.7,r*.6);g.fill();
    for(let i=0;i<7;i++){const a=i*.9+idx,d2=r*(.15+(i%3)*.18),cx=x+Math.cos(a)*d2,cy=y+Math.sin(a)*d2,sz=r*(.22-(i%3)*.04),hh=(i*50+T*20)%360;
      g.fillStyle=`hsla(${hh},80%,72%,.95)`;g.beginPath();g.moveTo(cx,cy-sz*1.5);g.lineTo(cx+sz*.55,cy);g.lineTo(cx,cy+sz*.6);g.lineTo(cx-sz*.55,cy);g.closePath();g.fill();
      g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.moveTo(cx,cy-sz*1.5);g.lineTo(cx+sz*.18,cy-sz*.2);g.lineTo(cx,cy);g.closePath();g.fill();}
    if(Math.random()<.05)sparks.push({x:x+rand(-r,r),y:y+rand(-r,r),life:1,c:`hsl(${Math.random()*360},90%,75%)`});
    return;}
  g.fillStyle='rgba(255,255,255,.35)';ell(g,x,y,r+6+Math.sin(T*2+idx)*1.5,r+6+Math.sin(T*2+idx)*1.5);g.fill();
  const gr=g.createRadialGradient(x,y,r*.4,x,y,r);const LVi=S.world==='lava',ICi=S.world==='ice';gr.addColorStop(0,LVi?'#5a4a42':ICi?'#ffffff':'#f6dea0');gr.addColorStop(1,LVi?'#3a2e2a':ICi?'#cfe6f2':'#e8c47a');g.fillStyle=gr;ell(g,x,y,r,r);g.fill();
  g.fillStyle=LVi?'#6a7a3a':ICi?'#e8f6ff':'#5fb35a';g.beginPath();for(let i=0;i<=24;i++){const a=i/24*Math.PI*2,q=r*.62+Math.sin(i*2.3+idx)*r*.08;i?g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q):g.moveTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}g.closePath();g.fill();
  const palms=I.home?[[-18,-12,1.1],[20,14,.9],[-6,26,.8]]:[[-r*.15,-r*.1,r/60],[r*.25,r*.2,r/75]];

  if(I.home){

    for(const it of its){const sl=ISLE_SLOTS[it.slot];if(!sl)continue;drawIsleItem(it.id,x+sl[0]*r,y+sl[1]*r);}
    g.save();g.translate(x+r*.66,y+r*.66);g.rotate(-Math.PI/4);g.fillStyle='#9a6b3f';g.fillRect(-5,0,10,40);g.fillStyle='#7a5230';for(let i=0;i<7;i++)g.fillRect(-6,4+i*5.5,12,1.5);g.restore();
    g.fillStyle='#c0503a';rr(g,x-36,y-2,22,18,3);g.fill();g.fillStyle='#8a3426';g.beginPath();g.moveTo(x-39,y);g.lineTo(x-25,y-12);g.lineTo(x-11,y);g.fill();

}
function drawSpot(s){
  if(!inView(s.x,s.y))return;
  const fade=Math.min(1,s.age/1.2,(s.life-s.age)/2),hooked=hook.spot===s;
  const al=hooked?1:clamp(fade,0,1),sc=(.8+Math.min(s.sp.s,100)/110)*(s.huge?1.7:1);
  if(s.sp.r>=3){const gl=g.createRadialGradient(s.x,s.y,0,s.x,s.y,34*sc);gl.addColorStop(0,`rgba(${s.sp.black?'40,0,20':s.sp.r>=7?hueRGB((T*90)%360):({3:'200,140,255',4:'255,210,80',5:'255,90,140',6:'255,130,50'})[s.sp.r]},${(s.sp.black?.75:.38)*al})`);gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;ell(g,s.x,s.y,34*sc,34*sc);g.fill();}
  g.lineWidth=1.5;
  for(let k=0;k<3;k++){const p=(T*.7+k/3+s.ph)%1;g.strokeStyle=`rgba(255,255,255,${(1-p)*.5*al})`;ell(g,s.x,s.y,p*24*sc,p*20*sc);g.stroke();}
  const tint=s.sp.black?'16,8,22':s.sp.r>=7?hueRGB((T*90+60)%360):s.sp.r===6?'255,195,140':s.sp.r===5?'255,175,205':s.sp.r===4?'255,226,130':S.world==='lava'?'255,236,190':'235,250,255';
  for(let i=0;i<7;i++){const p=(T*1.2+i*.37+s.ph)%1,ang=i*2.1+s.ph,rad=(3+(i*5)%13)*sc;
    const bx=s.x+Math.cos(ang)*rad,by=s.y+Math.sin(ang)*rad;
    if(p<.85){const br=(1+p*3.2)*Math.min(1.3,sc);g.fillStyle=`rgba(${tint},${.25*al})`;ell(g,bx,by,br,br);g.fill();g.strokeStyle=`rgba(${tint},${.9*al})`;g.lineWidth=1;ell(g,bx,by,br,br);g.stroke();
      g.fillStyle=`rgba(255,255,255,${.9*al})`;ell(g,bx-br*.35,by-br*.35,br*.25,br*.25);g.fill();}
    else{g.strokeStyle=`rgba(${tint},${(1-p)*4*al})`;g.lineWidth=1;for(let j=0;j<4;j++){const a=j*Math.PI/2+.4;g.beginPath();g.moveTo(bx+Math.cos(a)*3,by+Math.sin(a)*3);g.lineTo(bx+Math.cos(a)*6,by+Math.sin(a)*6);g.stroke();}}
  }
}
function drawBuoys(){
  if(S.zone>=ZONES.length-1)return;const R=zoneR();
  g.fillStyle='rgba(3,16,34,.32)';g.beginPath();g.rect(cam.x-20,cam.y-20,W+40,H+40);g.arc(C.x,C.y,R,0,Math.PI*2);g.fill('evenodd');
  const dc=Math.hypot(cam.x+W/2-C.x,cam.y+H/2-C.y);if(dc+Math.hypot(W,H)<R)return;
  const step=46/R;
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;g.setLineDash([3,4]);g.beginPath();g.arc(C.x,C.y,R,0,Math.PI*2);g.stroke();g.setLineDash([]);
  for(let a=0,i=0;a<Math.PI*2;a+=step,i++){const x=C.x+Math.cos(a)*R,y=C.y+Math.sin(a)*R+Math.sin(T*2+i)*1.5;if(!inView(x,y,20))continue;
    g.fillStyle='rgba(0,0,0,.2)';ell(g,x+2,y+3,7,7);g.fill();
    g.fillStyle=i%2?'#ff4d3a':'#ffc93c';ell(g,x,y,7,7);g.fill();g.fillStyle='#fff';ell(g,x,y,3.5,3.5);g.fill();}
}
function drawBoat(){drawBoatAt(boat.x,boat.y,boat.a,'#e4572e');}

  g.fillStyle='rgba(0,20,40,.25)';g.beginPath();g.ellipse(3,4,27,13,0,0,Math.PI*2);g.fill();
  g.fillStyle=hull;g.beginPath();g.moveTo(28,0);g.quadraticCurveTo(16,-13,-18,-12);g.quadraticCurveTo(-23,0,-18,12);g.quadraticCurveTo(16,13,28,0);g.fill();
  g.fillStyle='#fff';g.beginPath();g.moveTo(24,0);g.quadraticCurveTo(14,-10,-15,-9.5);g.lineTo(-15,9.5);g.quadraticCurveTo(14,10,24,0);g.fill();
  g.fillStyle='#c9a46a';g.beginPath();g.moveTo(21,0);g.quadraticCurveTo(12,-8,-13,-7.5);g.lineTo(-13,7.5);g.quadraticCurveTo(12,8,21,0);g.fill();
  g.strokeStyle='rgba(90,60,30,.4)';g.lineWidth=1;for(let i=-9;i<=15;i+=6){g.beginPath();g.moveTo(i,-7);g.lineTo(i,7);g.stroke();}
  g.fillStyle='#8a5a33';g.fillRect(8,-8,4,16);

  g.fillStyle='#2b5d8a';ell(g,-4,0,6,7.5);g.fill();
  g.fillStyle='rgba(0,0,0,.2)';ell(g,-3,1,8,8);g.fill();
  g.fillStyle='#ffc93c';ell(g,-4,0,8,8);g.fill();g.fillStyle='#f0b324';ell(g,-4,0,4.5,4.5);g.fill();
  g.restore();
}
function drawMinimap(){
  const s=92,x0=W-s-10,y0=H-s-40,V=Math.min(WORLD/2,zoneR()*1.6),ox=C.x-V,oy=C.y-V,k=s/(2*V);
  const P=(x,y)=>[x0+(x-ox)*k,y0+(y-oy)*k];
  g.fillStyle='rgba(4,30,52,.85)';rr(g,x0-4,y0-4,s+8,s+8,10);g.fill();
  g.save();rr(g,x0,y0,s,s,7);g.clip();
  g.fillStyle='#0a1a2c';g.fillRect(x0,y0,s,s);
  g.drawImage(mapCv,ox/MF,oy/MF,2*V/MF,2*V/MF,x0,y0,s,s);
  if(S.zone<ZONES.length-1){g.fillStyle='rgba(3,16,34,.4)';g.beginPath();g.rect(x0,y0,s,s);g.arc(x0+(C.x-ox)*k,y0+(C.y-oy)*k,zoneR()*k,0,Math.PI*2);g.fill('evenodd');}
  const vis=()=>true;
  g.fillStyle='#e8c47a';for(const I of ISLANDS){if(!vis(I.x,I.y))continue;const [px,py]=P(I.x,I.y);ell(g,px,py,Math.max(1.5,I.r*k),Math.max(1.5,I.r*k));g.fill();}
  for(const b of crewBoats){const [px,py]=P(b.x,b.y);g.fillStyle=CREW_COL[b.k];ell(g,px,py,2,2);g.fill();}
  for(const o of others()){const [px,py]=P(o.x,o.y);g.fillStyle=o.color;ell(g,px,py,2.8,2.8);g.fill();}
  const [cx,cy]=P(cam.x,cam.y);g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1;g.strokeRect(cx,cy,W*k,H*k);
  const [bx,by]=P(boat.x,boat.y);g.fillStyle='#ff4d3a';ell(g,bx,by,3,3);g.fill();g.strokeStyle='#fff';g.stroke();
  g.restore();
}
function render(){
  g.setTransform(SC,0,0,SC,0,0);
  if(mapCv){g.imageSmoothingEnabled=true;g.drawImage(mapCv,cam.x/MF,cam.y/MF,W/MF,H/MF,0,0,W,H);}
  {const sh=weather.on&&S.world!=='ocean'&&weather.t<3?(3-weather.t)*2.5:0;g.translate(-cam.x+(Math.random()-.5)*sh,-cam.y+(Math.random()-.5)*sh);}
  g.strokeStyle=S.world==='lava'?'rgba(255,230,160,.55)':'rgba(255,255,255,.5)';g.lineWidth=1.3;g.lineCap='round';
  for(const gl of glints){const x=cam.x+(((gl.x-cam.x)%600)+600)%600-60,y=cam.y+(((gl.y-cam.y)%1000)+1000)%1000;
    if(y>cam.y+H)continue;const a=Math.max(0,Math.sin(T*1.4+gl.ph));if(a<.05)continue;g.globalAlpha=a*.6;
    g.beginPath();g.moveTo(x-gl.l/2,y);g.quadraticCurveTo(x,y-3,x+gl.l/2,y);g.stroke();}
  g.globalAlpha=1;
  g.font='800 11px Nunito, system-ui, sans-serif';g.textAlign='center';g.textBaseline='middle';
  for(const l of labels){if(inView(l.x,l.y)){g.fillStyle='rgba(225,245,255,.55)';g.fillText(l.m+' m',l.x,l.y-8);}}
  ISLANDS.forEach(drawIsland);
  if(zoneAt(boat.x,boat.y)>=3){const G=70;for(let gx=Math.floor(cam.x/G);gx<=Math.floor((cam.x+W)/G);gx++)for(let gy=Math.floor(cam.y/G);gy<=Math.floor((cam.y+H)/G);gy++){
    const hv=Math.sin(gx*127.1+gy*311.7)*43758.5453,fr=hv-Math.floor(hv);if(fr<.5)continue;const px=gx*G+fr*60,py=gy*G+((fr*7)%1)*60,zz=zoneAt(px,py);if(zz<4)continue;
    const a=.25+.35*Math.max(0,Math.sin(T*2+fr*20));g.fillStyle=zz>=5?`hsla(${(fr*360+T*40)%360},90%,72%,${a})`:(S.world==='lava'?`rgba(255,${150+Math.round(fr*80)},60,${a})`:S.world==='ice'?`rgba(255,255,255,${a})`:`rgba(120,240,255,${a})`);ell(g,px+Math.sin(T+fr*9)*4,py,1.8,1.8);g.fill();}}
  for(const w of wake){const k=w.t/1.4;g.strokeStyle=`rgba(255,255,255,${.5*(1-k)})`;g.lineWidth=1.5;ell(g,w.x,w.y,4+k*14,3+k*8);g.stroke();}
  for(const s of spots)drawSpot(s);
  for(const s of sparks){g.fillStyle=s.c;g.globalAlpha=s.life;star(s.x,s.y,2.2*s.life);}g.globalAlpha=1;
  drawBuoys();

const sfx=(()=>{
  let ac=null,out=null,noiseBuf=null,on=true,reelT=0;

  function silentWav(){const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
  function build(){

      const n=ac.sampleRate;noiseBuf=ac.createBuffer(1,n,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return ac;}catch(e){ac=null;return null;}}
  function ctx(){const c=build();if(c&&c.state!=='running')c.resume().catch(()=>{});return c;}
  function wake(){ // called from a tap: unlocks sound on phones, even with the silent switch on
    const c=build();if(!c)return;
    try{if(c.state!=='running')c.resume().catch(()=>{});const src=c.createBufferSource();src.buffer=c.createBuffer(1,1,22050);src.connect(c.destination);src.start(0);}catch(e){}
    try{if(!keep){keep=new Audio(silentWav());keep.loop=true;keep.volume=.01;keep.setAttribute('playsinline','');}if(keep.paused){const p=keep.play();if(p&&p.catch)p.catch(()=>{});}}catch(e){}
  }
  function tone(f,dur,{type='sine',vol=.25,slide=0,delay=0,attack=.005}={}){
    const c=ctx();if(!c||!on)return;const t=c.currentTime+delay;
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
