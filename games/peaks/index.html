<!DOCTYPE html>
<html lang="en">
<head>
<script src="../account.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Peak Finder: Mountains of the Americas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2a37; --paper:#fbf6ea; --ocean1:#bfe3f2; --ocean2:#8fcbe6;
    --land:#9cc78a; --land-edge:#5f8f55; --brown:#9a5b2a; --good:#2e9e5b; --bad:#d9483b; --gold:#f4b400;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:900px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
  header h1{font-family:Fredoka,sans-serif;font-size:20px;margin:0;line-height:1.1;flex:1}
  header h1 small{display:block;font-family:Nunito;font-weight:700;font-size:12px;color:#6b7280;letter-spacing:.3px}
  .pill{font-family:Fredoka;font-weight:600;background:#fff;border:2px solid #e8dcc0;border-radius:999px;padding:4px 12px;font-size:15px;white-space:nowrap}
  .tabs{display:flex;gap:6px;padding:0 14px 8px}
  .tabs button{flex:1;font:700 14px Nunito;padding:8px;border-radius:12px;border:2px solid #e8dcc0;background:#fff;color:var(--ink)}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  #mapwrap{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:18px;overflow:hidden;border:3px solid #e8dcc0;background:var(--ocean2);touch-action:manipulation}
  svg#map{width:100%;height:100%;display:block;user-select:none}
  .dot-g{cursor:pointer}
  .dot-g .ring{transition:fill .15s}
  .shake{animation:shake .35s}
  @keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  button{touch-action:manipulation;cursor:pointer}
  .zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
  .zoom button{width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.92);font:700 20px Fredoka;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
  #toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%) translateY(90px);background:#fff;padding:8px 14px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .25s;max-width:78%;text-align:center;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.bad{color:var(--bad)} #toast.good{color:var(--good)}
  #panel{padding:10px 14px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .card{background:#fff;border:2px solid #e8dcc0;border-radius:18px;padding:12px 14px}
  .find-label{font:800 12px Nunito;letter-spacing:1.5px;color:#9ca3af;text-transform:uppercase}
  .target{font-family:Fredoka;font-weight:700;font-size:26px;line-height:1.15;margin:2px 0 4px;display:flex;align-items:center;gap:8px}
  .kind{font:800 11px Nunito;padding:3px 8px;border-radius:999px;background:#f3ead6;color:var(--brown);letter-spacing:.5px;text-transform:uppercase}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .row button,.big{font:700 15px Nunito;padding:10px 14px;border-radius:12px;border:2px solid #e8dcc0;background:#fff;color:var(--ink)}
  .big{background:var(--ink);color:#fff;border-color:var(--ink);width:100%;font-size:17px;font-family:Fredoka;font-weight:600}
  .dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
  .dot{width:12px;height:12px;border-radius:50%;background:#e5e7eb}
  .dot.cur{background:var(--ink)} .dot.s3{background:var(--good)} .dot.s2{background:#7cc36f} .dot.s1{background:var(--gold)} .dot.s0{background:var(--bad)}
  .fact{font-size:14px;line-height:1.4;margin:4px 0 0;color:#374151}
  .stars{color:var(--gold);font-size:20px;letter-spacing:2px}
  .learnlist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .learnlist button{flex:0 0 auto;font:700 13px Nunito;padding:7px 11px;border-radius:999px;border:2px solid #e8dcc0;background:#fff;color:var(--ink)}
  .learnlist button.on{background:var(--brown);border-color:var(--brown);color:#fff}
  .hidden{display:none!important}
  /* svg */
  .land{fill:url(#landgrad);stroke:var(--land-edge);stroke-width:1.2;stroke-linejoin:round}
  .grat{fill:none;stroke:#ffffff;stroke-opacity:.35;stroke-width:.8}
  .ocean-label{font-family:Fredoka;font-weight:500;fill:#3b7ea1;fill-opacity:.7;font-style:italic;letter-spacing:2px;text-anchor:middle;pointer-events:none}
  .range-line{fill:none;stroke:var(--brown);stroke-linecap:round;stroke-linejoin:round;opacity:.55}
  .range-teeth{fill:none;stroke:#6b3a12;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .lbl{font-family:Fredoka;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}
  .pulse{fill:var(--gold);fill-opacity:.25;stroke:var(--gold);stroke-width:2;animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  .pop{animation:pop .45s cubic-bezier(.3,1.6,.6,1) both;transform-box:fill-box;transform-origin:center}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .fade{animation:fade 1.1s ease-out forwards}
  @keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
  #confetti{position:fixed;inset:0;pointer-events:none}
</style>
</head>

<div id="app">
  <header>
    <h1>Peak Finder<small>MOUNTAINS OF THE AMERICAS</small></h1>
    <span class="pill" id="score">⭐ 0</span>

  <div class="tabs">
    <button id="tabPlay" class="on">🎯 Play</button>
    <button id="tabLearn">📖 Study the map</button>
  </div>
  <div id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="toast"></div>
  </div>
  <div id="panel">
    <div class="card" id="playCard">

      <div class="target"><span id="targetName">—</span><span class="kind" id="targetKind"></span></div>

        <div class="dots" id="dots"></div>
        <button id="hintBtn">💡 Hint</button>

      <div class="row"><button class="big" id="againBtn">Play again</button></div>

  </div>
</div>

// ---------- Projection: Lambert azimuthal equal-area centered on the Americas ----------
const D = Math.PI/180, R = 1000;
const LON0 = -88*D, LAT0 = 12*D, sin0 = Math.sin(LAT0), cos0 = Math.cos(LAT0);
function proj([lon,lat]){
  const l = lon*D - LON0, p = lat*D;
  const cc = sin0*Math.sin(p) + cos0*Math.cos(p)*Math.cos(l);
  const k = Math.sqrt(2/(1+cc));
  return [R*k*Math.cos(p)*Math.sin(l), -R*k*(cos0*Math.sin(p) - sin0*Math.cos(p)*Math.cos(l))];
}
function unproj([x,y]){
  x/=R; y=-y/R;
  const rho = Math.hypot(x,y); if(rho<1e-9) return [LON0/D, LAT0/D];
  const c = 2*Math.asin(Math.min(1,rho/2));
  const lat = Math.asin(Math.cos(c)*sin0 + y*Math.sin(c)*cos0/rho);
  const lon = LON0 + Math.atan2(x*Math.sin(c), rho*cos0*Math.cos(c) - y*sin0*Math.sin(c));
  return [lon/D, lat/D];
}
function haversine([a,b],[c,d]){
  const p1=b*D,p2=d*D,dp=(d-b)*D,dl=(c-a)*D;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*6371*Math.asin(Math.sqrt(h));
}
function bearing([a,b],[c,d]){
  const p1=b*D,p2=d*D,dl=(c-a)*D;
  const y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);

}

    [[-101.2,28.4],[-100.5,26.5],[-100,25],[-99.4,23],[-98.4,20.8],[-97.4,19.3]],
    [[-104.5,19.4],[-101.5,18.1],[-98.5,17.2],[-96,16.6]]],
  fact:"Mexico's main mountains: the Sierra Madre Occidental (west), Oriental (east) and del Sur (south) wrap around the Mexican Plateau."},
];
PLACES.forEach(p=>{
  if(p.line) p.lines=[p.line];
  if(p.lines) p.plines=p.lines.map(l=>l.map(proj));
  if(p.pt) p.ppt=proj(p.pt);
  p.pdot=proj(p.dot||p.pt);
});

// ---------- SVG helpers ----------
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("map");
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
const f1=v=>v.toFixed(1);
function smoothPath(pts, closed=true){
  const n=pts.length; if(n<3) return "";
  const P=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  let d=`M${f1(P(0)[0])},${f1(P(0)[1])}`; const segs=closed?n:n-1, t=0.18;
  for(let i=0;i<segs;i++){
    const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    d+=`C${f1(p1[0]+(p2[0]-p0[0])*t)},${f1(p1[1]+(p2[1]-p0[1])*t)} ${f1(p2[0]-(p3[0]-p1[0])*t)},${f1(p2[1]-(p3[1]-p1[1])*t)} ${f1(p2[0])},${f1(p2[1])}`;
  }
  return closed?d+"Z":d;
}
const defs=el("defs",{},svg);
defs.innerHTML=`
 <radialGradient id="oceangrad" cx="45%" cy="40%" r="75%"><stop offset="0" stop-color="#cdeaf6"/><stop offset="1" stop-color="#86c3e0"/></radialGradient>
 <linearGradient id="landgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9efe2"/><stop offset=".22" stop-color="#a9cf93"/><stop offset=".6" stop-color="#93c47f"/><stop offset="1" stop-color="#b9cf8f"/></linearGradient>`;

let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
for(const ring of LAND.slice(0,2)) for(const q of ring){const [x,y]=proj(q);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
const pad=50, VB={x:minX-pad,y:minY-pad,w:(maxX-minX)+2*pad,h:(maxY-minY)+2*pad};
svg.setAttribute("viewBox",`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
svg.setAttribute("preserveAspectRatio","xMidYMid meet");

// static base map (drawn once)
el("rect",{x:-6000,y:-6000,width:12000,height:12000,fill:"url(#oceangrad)"},svg);
const gGrat=el("g",{},svg);
for(let lon=-180;lon<=0;lon+=15){const pts=[];for(let lat=-70;lat<=85;lat+=2.5)pts.push(proj([lon,lat]));el("path",{class:"grat",d:"M"+pts.map(p=>p.map(f1).join(",")).join("L")},gGrat)}
for(let lat=-60;lat<=80;lat+=15){const pts=[];for(let lon=-185;lon<=5;lon+=2.5)pts.push(proj([lon,lat]));el("path",{class:"grat",d:"M"+pts.map(p=>p.map(f1).join(",")).join("L")},gGrat)}
const gLand=el("g",{},svg);
// soft shadow drawn as an offset copy (cheaper and smoother than an SVG filter on phones)
LAND.forEach(r=>el("path",{d:smoothPath(r.map(p=>{const q=proj(p);return [q[0],q[1]+5]})),fill:"#2a5d7a","fill-opacity":.18},gLand));
LAND.forEach(r=>el("path",{class:"land",d:smoothPath(r.map(proj))},gLand));
const OCEANS=[["PACIFIC OCEAN",[-108,-12],34],["ATLANTIC OCEAN",[-45,8],30],["Gulf of",[-90.5,25.6],20],["Mexico",[-90.5,24.0],20],["Caribbean Sea",[-75,14.2],20],["Hudson",[-86.5,60],18],["Bay",[-86.5,58.6],18],["ARCTIC OCEAN",[-145,75],22]];
OCEANS.forEach(([t,ll,fs])=>{const [x,y]=proj(ll);el("text",{class:"ocean-label",x,y,"font-size":fs},svg).textContent=t});
const gRanges=el("g",{},svg), gMarks=el("g",{},svg);

// label placement per place: [dx, dy, anchor]
const LBL={mckinley:[16,6,"start"],mitchell:[12,24,"start"],aconcagua:[16,6,"start"],duarte:[16,6,"start"],
  rockies:[16,6,"start"],appalachian:[16,-6,"start"],andes:[-16,6,"end"],sierramadre:[-16,6,"end"]};

// ---------- Layered drawing ----------
let K=1; // svg units per screen pixel (fixed map, recomputed only on resize)
function computeK(){const r=svg.getBoundingClientRect(); if(r.width&&r.height) K=Math.max(VB.w/r.width,VB.h/r.height)}
const dots={}; // id -> {g, ring, center, label, glow, range}
function buildPlaces(){
  computeK(); gRanges.innerHTML=""; gMarks.innerHTML="";
  PLACES.forEach(p=>{
    const o={};
    if(p.kind==="range"){
      o.range=el("g",{style:"display:none"},gRanges);
      p.plines.forEach(l=>{
        el("path",{class:"range-line",d:smoothPath(l,false),"stroke-width":12*K},o.range);
        let d=""; const step=15*K;
        for(let i=0;i<l.length-1;i++){const [a,b]=[l[i],l[i+1]],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(L/step));
          for(let j=0;j<n;j++){const t=(j+.5)/n,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t,s=4*K;d+=`M${f1(x-s)},${f1(y+s*.6)}L${f1(x)},${f1(y-s*.8)}L${f1(x+s)},${f1(y+s*.6)}`}}
        el("path",{class:"range-teeth",d,"stroke-width":1.6*K},o.range);
      });
    }
    const [x,y]=p.pdot;
    o.g=el("g",{class:"dot-g","data-id":p.id},gMarks);
    o.glow=el("circle",{cx:x,cy:y,r:24*K,class:"pulse",style:"display:none"},o.g);
    el("circle",{cx:x,cy:y,r:26*K,fill:"transparent"},o.g); // big invisible tap area
    o.ring=el("circle",{class:"ring",cx:x,cy:y,r:10*K,fill:"#fff",stroke:"#1f2a37","stroke-width":3*K},o.g);
    o.center=el("circle",{cx:x,cy:y,r:3.2*K,fill:"#1f2a37"},o.g);
    const s=9*K;
    o.peak=el("g",{style:"display:none"},o.g);
    el("path",{d:`M${x},${y-s*1.4}L${x+s*1.1},${y+s*.7}L${x-s*1.1},${y+s*.7}Z`,fill:"#6b3a12",stroke:"#fff","stroke-width":2*K,"stroke-linejoin":"round"},o.peak);
    el("path",{d:`M${x-s*.42},${y-s*.6}L${x},${y-s*1.4}L${x+s*.42},${y-s*.6}L${x+s*.12},${y-s*.38}L${x-s*.1},${y-s*.65}Z`,fill:"#fff"},o.peak);
    const [dx,dy,anchor]=LBL[p.id];
    o.label=el("text",{class:"lbl",x:x+dx*K,y:y+dy*K,"font-size":13*K,"stroke-width":3.5*K,"text-anchor":anchor,style:"display:none"},o.g);
    o.label.textContent=p.name;
    dots[p.id]=o;
  });
  paint();
}
const show=(e,on)=>e&&(e.style.display=on?"":"none");
// update looks without rebuilding anything
function paint(){
  PLACES.forEach(p=>{
    const o=dots[p.id]; if(!o) return;
    const learn=mode==="learn", found=state.done[p.id]!=null, sel=learnSel===p.id;
    const reveal=learn||found;
    show(o.range,reveal); show(o.label,reveal);
    const isPeakShown=reveal&&p.kind==="peak";
    show(o.peak,isPeakShown); show(o.ring,!isPeakShown); show(o.center,!isPeakShown&&!found);
    o.ring.setAttribute("fill", found?"#2e9e5b": state.flash===p.id?"#d9483b": sel?"#f4b400":"#fff");
    o.ring.setAttribute("stroke", found?"#fff":"#1f2a37");
    show(o.glow,(mode==="play"&&state.hint&&!state.solved&&cur()&&cur().id===p.id)||(learn&&sel));
    o.label.setAttribute("font-size",(sel?16:13)*K);
  });
}
let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(buildPlaces,150)});

// ---------- Tapping ----------
// one handler on the whole map; picks the nearest dot within a generous finger-sized radius
let lastTap=0;
svg.addEventListener("pointerup",e=>{
  if(e.button>0) return;
  const now=performance.now(); if(now-lastTap<250) return; lastTap=now;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  let best=null,bd=Infinity;
  PLACES.forEach(p=>{const d=Math.hypot(p.pdot[0]-q.x,p.pdot[1]-q.y);if(d<bd){bd=d;best=p}});
  if(!best||bd/K>34){ if(mode==="play"&&!state.solved&&state.i<state.order.length) toast("Tap one of the dots!","bad"); return; }
  if(mode==="learn") selectLearn(best.id); else onDot(best);
});

// ---------- Game ----------
const PTS=[0,40,70,100];
let mode="play", learnSel=null, state={done:{},order:[],i:0};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const cur=()=>PLACES.find(p=>p.id===state.order[state.i]);
function newGame(){
  state={order:shuffle(PLACES.map(p=>p.id)),i:0,misses:0,score:0,done:{},hint:false,solved:false,flash:null};
  document.getElementById("endCard").classList.add("hidden");
  document.getElementById("playCard").classList.remove("hidden");
  showTarget(); updateScore();
}
function showTarget(){
  const p=cur(); Object.assign(state,{misses:0,hint:false,solved:false,flash:null});
  document.getElementById("findLabel").textContent=`Find ${state.i+1} of ${PLACES.length}`;
  document.getElementById("targetName").textContent=p.name;
  document.getElementById("targetKind").textContent=p.kind==="peak"?"▲ peak":"⛰ range";
  document.getElementById("feedback").innerHTML="Tap the dot where it is on the map.";
  document.getElementById("hintBtn").classList.remove("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
  renderDots(); paint();
}
function renderDots(){
  const d=document.getElementById("dots"); d.innerHTML="";
  state.order.forEach((id,i)=>{const s=document.createElement("span");s.className="dot"+(state.done[id]!=null?" s"+state.done[id]:i===state.i?" cur":"");d.appendChild(s)});
}
function updateScore(){document.getElementById("score").textContent="⭐ "+state.score}
let toastT;
function toast(msg,cls){const t=document.getElementById("toast");t.textContent=msg;t.className="show "+cls;clearTimeout(toastT);toastT=setTimeout(()=>t.className="",1400)}
let flashT;
function onDot(p){
  if(state.solved||state.i>=state.order.length) return;
  if(state.done[p.id]!=null){ toast("You already found that one!","bad"); return; }
  if(p.id===cur().id){ solve(Math.max(1,3-state.misses)); return; }
  state.misses++; state.flash=p.id; paint();
  clearTimeout(flashT); flashT=setTimeout(()=>{state.flash=null;paint()},600);
  const card=document.getElementById("playCard"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  if(state.misses>=4){ solve(0,true); return; }
  if(state.misses===2){ giveHint(true); return; }
  document.getElementById("feedback").innerHTML=state.misses===1?"Nope, that's a different place. Try another dot!":"Still not it. Keep looking!";
}
function giveHint(auto){
  if(state.solved) return;
  if(!state.misses) state.misses=1;
  state.hint=true; paint();
  document.getElementById("feedback").innerHTML=(auto?"Here's a hint! ":"")+"Look for the <b>glowing dot</b>.";
}
function solve(stars,revealed){
  const p=cur(); state.solved=true; state.hint=false; state.flash=null; state.done[p.id]=stars; state.score+=PTS[stars]; updateScore();
  paint();
  const o=dots[p.id]; [o.peak,o.ring,o.label].forEach(e=>e.classList.remove("pop")); requestAnimationFrame(()=>[o.peak,o.ring,o.label].forEach(e=>e.classList.add("pop")));
  const starStr="★".repeat(stars)+"☆".repeat(3-stars);
  document.getElementById("feedback").innerHTML=(revealed?`<b>Here it is!</b> `:`<span class="stars">${starStr}</span> <b style="color:var(--good)">Found it!</b> `)+p.fact;
  if(!revealed){toast(stars===3?"Perfect! +100":"Found it! +"+PTS[stars],"good"); if(stars===3) confetti();}
  document.getElementById("hintBtn").classList.add("hidden");
  const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden");
  nb.textContent=state.i===state.order.length-1?"Finish 🏁":"Next ➜";
  renderDots();
}
function next(){ if(!state.solved) return; state.i++; if(state.i>=state.order.length){finish();return} showTarget(); }
function finish(){
  const total=Object.values(state.done).reduce((a,b)=>a+b,0), max=PLACES.length*3;
  try{ if(total>(+localStorage.getItem('peakFinderBest')||0)) localStorage.setItem('peakFinderBest', total); }catch(e){}
  document.getElementById("playCard").classList.add("hidden");
  document.getElementById("endCard").classList.remove("hidden");
  const msg = total===max?"Perfect score — you're a true mountain master! 🏆":total>=max*.75?"Awesome work, explorer! Play again for a perfect score.":total>=max*.4?"Nice job! Try Study mode, then go for more stars.":"Good start! Study the map and try again.";
  document.getElementById("endText").innerHTML=`You scored <b>${state.score}</b> points and earned <b>${total} of ${max}</b> stars. ${msg}`;
  if(total>=max*.75) confetti();
}
document.getElementById("hintBtn").onclick=()=>giveHint(false);
document.getElementById("nextBtn").onclick=next;
document.getElementById("againBtn").onclick=newGame;

// ---------- Study mode ----------
const ll=document.getElementById("learnList");
PLACES.forEach(p=>{const b=document.createElement("button");b.dataset.id=p.id;b.textContent=(p.kind==="peak"?"▲ ":"⛰ ")+p.name;b.onclick=()=>selectLearn(p.id);ll.appendChild(b)});
function selectLearn(id){
  const p=PLACES.find(q=>q.id===id); learnSel=id;
  [...ll.children].forEach(c=>{const on=c.dataset.id===id;c.classList.toggle("on",on);if(on)c.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"})});
  document.getElementById("learnName").textContent=p.name+(p.alt?" "+p.alt:"");
  document.getElementById("learnFact").textContent=p.fact; paint();
}
function setMode(m){
  mode=m; clearTimeout(toastT); document.getElementById("toast").className=""; document.getElementById("tabPlay").classList.toggle("on",m==="play"); document.getElementById("tabLearn").classList.toggle("on",m==="learn");
  document.getElementById("learnCard").classList.toggle("hidden",m!=="learn");
  const finished=state.i>=state.order.length;
  document.getElementById("playCard").classList.toggle("hidden",m!=="play"||finished);
  document.getElementById("endCard").classList.toggle("hidden",m!=="play"||!finished);
  learnSel=null;[...ll.children].forEach(c=>c.classList.remove("on"));
  document.getElementById("learnName").textContent="Study the map";
  document.getElementById("learnFact").textContent="All 8 places are labeled. Tap a dot or a name to learn about it, then hit Play!";
  paint();
}
document.getElementById("tabPlay").onclick=()=>setMode("play");
document.getElementById("tabLearn").onclick=()=>setMode("learn");

// ---------- Confetti ----------
const cv=document.getElementById("confetti"),cx=cv.getContext("2d"); let confRun=0;
function confetti(){
  const id=++confRun; cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#f4b400","#2e9e5b","#d9483b","#3b7ea1","#9a5b2a"];
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let f=0;(function tick(){if(id!==confRun)return;cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});if(++f<80)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)})();
}

newGame();
requestAnimationFrame(buildPlaces);
})();
</script>
</body>
