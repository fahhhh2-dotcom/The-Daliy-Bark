<!DOCTYPE html>

<style>
:root{

}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--deep);color:var(--foam);font-family:var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:1.45rem;letter-spacing:.01em;line-height:1}
.brand span{color:var(--sun)}
.right{display:flex;align-items:center;gap:8px}
.mbtn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.mbtn svg{width:20px;height:20px;fill:var(--sun);stroke:var(--coral)}
.mbtn .wave{stroke:var(--sun)}
.mbtn[aria-pressed="false"] .wave{display:none}
.mbtn .off{display:none}
.mbtn[aria-pressed="false"] svg{fill:var(--mute)}
.mbtn[aria-pressed="false"] .off{display:block}
.money{font-family:var(--display);font-size:1.25rem;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--sun);font-variant-numeric:tabular-nums}
#stage{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#5fae3f}
#game{display:block;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:rgba(16,38,26,.9);border:2px solid var(--sun);color:var(--foam);padding:6px 14px;border-radius:16px;font-weight:800;font-size:.9rem;max-width:92%;width:max-content;text-align:center;line-height:1.3;pointer-events:none;transition:opacity .3s;z-index:4}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(16,38,26,.82);color:var(--foam);padding:8px 14px;border-radius:14px;font-weight:800;font-size:.9rem;text-align:center;width:max-content;max-width:90%;pointer-events:none;z-index:3;line-height:1.3}
#hint b{color:var(--sun)}
.mapbtn{position:absolute;left:10px;top:10px;z-index:3;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:rgba(16,38,26,.85);color:var(--foam);border-radius:999px;padding:6px 12px 6px 9px;font-weight:900;font-size:.85rem}
.mapbtn svg{width:16px;height:16px;fill:var(--sun)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:900;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.tabs small{font-weight:700;color:var(--mute);font-size:.75rem;font-variant-numeric:tabular-nums}
.tabs button.active{background:var(--panel2);border-color:var(--sun)}

.sheet{position:absolute;inset:0;background:rgba(14,34,22,.97);display:flex;flex-direction:column;z-index:5}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:2px solid var(--line);gap:10px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.sheet-head p{margin:0;color:var(--mute);font-size:.85rem;font-weight:700}
.x{background:var(--panel2);border:2px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:1.3rem;font-weight:900;flex:none}
.sheet-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.detail{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.detail canvas{width:100%;height:130px;display:block;border-radius:10px}
.detail h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem}
.detail p{margin:0;line-height:1.45;font-size:.95rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--mute);font-weight:800;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:2px solid currentColor;width:max-content}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.cell{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cell canvas{width:100%;height:56px;display:block}
.cell b{font-size:.78rem;font-weight:900;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.cell i{width:8px;height:8px;border-radius:50%}
.cell.sel{border-color:var(--sun)}
h4.sec{margin:6px 0 -4px;font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--sun);letter-spacing:.03em;text-transform:uppercase}
h4.sec small{font-family:var(--body);color:var(--mute);text-transform:none;letter-spacing:0;font-weight:800;font-size:.8rem;margin-left:6px}
.jarview{width:100%;height:250px;flex:none;display:block;border-radius:14px;border:2px solid var(--line);background:#16301f}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.row canvas{width:64px;height:40px;flex:none}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .txt b{font-weight:900}
.row .txt span{font-size:.8rem;color:var(--mute);font-weight:700}
.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:900;background:var(--sun);color:#3a2300;flex:none}
.btn.alt{background:var(--leaf);color:#0f3010}
.btn:disabled{background:#2f4a36;color:#8aa58f;cursor:not-allowed}
.shopcard{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.shopcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shopcard h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.25rem}
.shopcard p{margin:0;font-size:.9rem;color:var(--mute);line-height:1.4}
.shopcard .now{color:var(--foam);font-weight:800}
.shopcard.here{border-color:var(--sun)}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:8px;border-radius:4px;background:#2f5238}
.pips i.on{background:var(--sun)}
.empty{color:var(--mute);text-align:center;padding:16px;font-weight:700;line-height:1.5}
.how{color:var(--mute);font-size:.85rem;line-height:1.5;margin:0}
.savebox{width:100%;font:600 .75rem ui-monospace,Menlo,Consolas,monospace;color:var(--foam);background:var(--deep);border:2px solid var(--line);border-radius:10px;padding:8px;resize:vertical;word-break:break-all;-webkit-user-select:text;user-select:text}
.savebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#catch{position:absolute;inset:0;background:rgba(6,20,12,.8);display:flex;align-items:center;justify-content:center;padding:14px;z-index:6}
.card{max-height:100%;overflow-y:auto;background:var(--panel);border:3px solid var(--sun);border-radius:18px;width:100%;max-width:380px;padding:14px;display:flex;flex-direction:column;gap:8px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.card canvas{width:100%;height:140px;display:block;border-radius:12px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.05}
.card p{margin:0;line-height:1.45;font-size:.93rem}
.card .new{color:var(--sun);font-weight:900;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.card .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.card .btns .btn{padding:12px 8px}
.btn.rel{grid-column:1/-1;background:transparent;border:2px solid var(--line);color:var(--foam)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
@media (max-width:430px){.brand{font-size:1.15rem}}
@media (max-height:620px){.tabs button{padding:5px 4px}}
</style></head><body>
<div id="app">
  <header class="bar">
    <div class="brand">Wild <span>Woods</span> Bugs</div>
    <div class="right">
      <button class="mbtn" id="sfxBtn" aria-label="Sounds on" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/><path class="off" d="M3 3l18 18" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <div class="money" aria-label="Money">$<span id="money">0</span></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" aria-label="Forest bug catching game"></canvas>
    <button id="mapBtn" class="mapbtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="areaLbl">Sunny Meadow</span></button>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-head">
        <div><h2 id="sheetTitle">Bug Book</h2><p id="sheetSub"></p></div>
        <button class="x" id="closeSheet" aria-label="Close">×</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>

    <div id="catch" hidden>
      <div class="card">
        <span class="new" id="cNew">New in your Bug Book!</span>
        <canvas id="cCanvas"></canvas>
        <span class="badge" id="cRarity">Common</span>
        <h3 id="cName">Ladybug</h3>
        <div class="meta" id="cMeta"></div>
        <p id="cFact"></p>
        <div class="btns">
          <button class="btn alt" id="cKeep">Put in jar</button>
          <button class="btn" id="cSell">Sell</button>
          <button class="btn rel" id="cRelease">Let it go free</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <button data-p="book">Bug Book<small id="foundCount">0 / 0</small></button>
    <button data-p="jar">Bug Jar<small id="jarCount">0 bugs</small></button>
    <button data-p="map">Map<small id="mapSmall">1 / 5</small></button>
    <button data-p="shop">Shop<small>Upgrades</small></button>
  </nav>
</div>

function legs6(g,L,bw,t,col,w,moving){
 g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';
 const xs=[L*.16,L*.04,-L*.08],fw=[1,0,-1];
 for(let i=0;i<3;i++)for(const sg of[-1,1]){
  const wig=moving?Math.sin(t*16+i*2+(sg>0?Math.PI:0))*L*.04:0;
  const kx=xs[i]+fw[i]*L*.05+wig,ky=sg*(bw+L*.08);
  g.beginPath();g.moveTo(xs[i],sg*bw*.4);g.lineTo(kx,ky);g.lineTo(kx+fw[i]*L*.1+wig*.5,sg*(bw+L*.18));g.stroke();
 }
}
function wingPath(g,L,sg,fore,moth){

 else{g.moveTo(-L*.02,0);
  if(moth){g.bezierCurveTo(-L*.02,sg*L*.36,-L*.24,sg*L*.46,-L*.31,sg*L*.3);g.bezierCurveTo(-L*.35,sg*L*.14,-L*.16,sg*L*.04,-L*.08,0);}
  else{g.bezierCurveTo(-L*.04,sg*L*.3,-L*.22,sg*L*.4,-L*.28,sg*L*.28);g.bezierCurveTo(-L*.3,sg*L*.14,-L*.16,sg*L*.04,-L*.08,0);}}
 g.closePath();
}

  for(const [ex,ey] of ends)ln(g,o[0],o[1],L*ex,sg*L*ey);border(.1);

  break;}

  if(fore){for(const x of[.17,.08,-.01])ln(g,L*x,sg*L*.04,L*(x+.05),sg*L*.56);}else ln(g,-L*.05,sg*L*.05,-L*.12,sg*L*.42);
  border(.1);if(!fore){g.fillStyle='#4a7aff';E(g,-L*.22,sg*L*.3,L*.03,L*.02);g.fill();g.fillStyle='#ff7a2a';E(g,-L*.27,sg*L*.22,L*.025,L*.025);g.fill();}break;
 case 'edge': border(.12);break;

 case 'birdwing': g.fillStyle=c2;if(fore){E(g,L*.08,sg*L*.3,L*.09,L*.05,sg*.9);g.fill();E(g,L*.0,sg*L*.18,L*.06,L*.035,sg*.9);g.fill();}
  else{E(g,-L*.16,sg*L*.22,L*.1,L*.08);g.fill();g.fillStyle='#ffd23f';E(g,-L*.15,sg*L*.25,L*.025,L*.025);g.fill();}break;

 }

function pickSpecies(){

 const ws=pool.map(s=>{let w=RAR[s.r].w;if(s.r>=1)w*=Math.pow(nb,Math.min(s.r,4)*.6);tot+=w;return w;});
 let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i];}return pool[0];
}
function spawnBug(initial){

 if(sp.mv==='skate')x=rand(pondX0()+30,pondX1()-30);
 else if(sp.mv!=='fly'&&inPond(x))x=Math.random()<.5?rand(30,pondX0()-30):rand(pondX1()+30,WW-30);
 b.x=x;b.tx=x;b.y=sp.mv==='fly'?rand(H*.12,GY+(H-GY)*.3):gyOf(b.gf);b.ty=b.y;
 bugs.push(b);
 if(sp.r>=3){toast(`${/^[aeiou]/i.test(RAR[sp.r].n)?'An':'A'} ${RAR[sp.r].n.toLowerCase()} ${sp.name} appeared somewhere in the ${A().name}!`,RAR[sp.r].c,3200);sRare();}

function updateBug(b,dt){

 const base=[55,68,85,105,125,145,165][r]*(sp.mv==='crawl'?.45:sp.mv==='hop'?.55:sp.mv==='skate'?.8:1)*(sp.shape==='dragon'?1.35:1)*(isWingy(sp)?.85:1);
 const dx=b.x-NET.x,dy=b.y-NET.y,d=Math.hypot(dx,dy)||1,nr=uv('net');
 b.inNet=NET.hold&&d<nr;

  if(r>=3){b.leaving=true;b.vx=b.dir*40;b.vy=-40;if(!off)toast(`Oh no! The ${sp.name} got away!`,null,2200);return;}
  if(off){b.dead=true;return;}
 }
 const fr=95+r*16,scared=NET.hold&&d<fr&&!b.inNet,fk=scared?(1-d/fr)*(.5+r*.28)*base*1.7:0;
 if(b.inNet){
  b.jolt-=dt;if(b.jolt<=0){b.jolt=rand(.18,.4);const ang=Math.random()*Math.PI*2,m=(26+r*32)*rand(.6,1.25);b.jx=Math.cos(ang)*m;b.jy=Math.sin(ang)*m;}

  b.prog=Math.min(1,b.prog+dt*.6*uv('grip')/(1+r*.55));
  if(sp.mv==='hop'&&b.y<gyOf(b.gf)-4)b.air=1;
 }else{
  b.prog=Math.max(0,b.prog-dt*(NET.hold?.45:1.2));
  if(sp.mv==='fly'){
   if(b.t>b.nextT){b.nextT=b.t+rand(1.2,3.2);b.tx=clamp(b.x+rand(-240,240),30,WW-30);b.ty=rand(H*.08,GY+(H-GY)*.45);}
   const tx=b.tx-b.x,ty=b.ty-b.y,td=Math.hypot(tx,ty)||1;let wx=tx/td*base,wy=ty/td*base;if(td<24){wx*=td/24;wy*=td/24;}
   if(scared){wx+=dx/d*fk;wy+=dy/d*fk;}
   const k=Math.min(1,dt*2.4);b.vx+=(wx-b.vx)*k;b.vy+=(wy-b.vy)*k;
   b.vy+=Math.sin(b.t*(isWingy(sp)?5:9))*(isWingy(sp)?70:25)*dt;
  }else if(sp.mv==='crawl'){
   if(b.t>b.nextT){b.nextT=b.t+rand(1,3.2);b.mov=Math.random()<.75;b.tx=clamp(b.x+rand(-170,170),20,WW-20);if(inPond(b.tx))b.tx=b.x<pondX0()?pondX0()-40:pondX1()+40;}
   let wx=b.mov&&Math.abs(b.tx-b.x)>4?Math.sign(b.tx-b.x)*base:0;
   if(scared)wx+=Math.sign(dx)*fk;
   b.vx+=(wx-b.vx)*Math.min(1,dt*5);b.vy=(gyOf(b.gf)-b.y)*5;
  }else if(sp.mv==='hop'){
   const gy=gyOf(b.gf);
   if(b.air){b.vy+=900*dt;if(b.y>=gy&&b.vy>0){b.y=gy;b.vy=0;b.vx=0;b.air=0;}}
   else{b.vy=(gy-b.y)*5;b.vx*=.8;b.hopT-=dt;
    if(b.hopT<=0||(scared&&b.hopT<1.2)){const away=scared?Math.sign(dx)||1:(Math.random()<.5?-1:1);b.vy=-rand(240,360);b.vx=away*rand(90,170)*(base/55);if(inPond(b.x+b.vx*.7))b.vx=-b.vx;b.air=1;b.hopT=rand(.9,2.6);}}
  }else if(sp.mv==='skate'){
   if(b.t>b.nextT){b.nextT=b.t+rand(.5,1.5);b.vx+=rand(-1,1)*base*1.6;b.gf=clamp(b.gf+rand(-.25,.25),0,1);}
   if(scared)b.vx+=Math.sign(dx)*fk*dt*6;
   b.vx*=Math.pow(.25,dt);b.vy=(gyOf(b.gf)-b.y)*3;
  }

 $('cNew').hidden=!c.isNew;
 $('cName').textContent=sp.name;
 const rb=$('cRarity');rb.textContent=RAR[sp.r].n;rb.style.color=RAR[sp.r].c;
 $('cMeta').innerHTML='';
 [`Size ${fmtLen(c.len)}`,`Worth $${fmt(priceOf(sp,c.len))}`,`Found in ${AREAS[sp.a].name}`].forEach(s=>{const e=document.createElement('span');e.textContent=s;$('cMeta').appendChild(e);});
 $('cFact').textContent=sp.fact;
 const full=S.jarBugs.length>=uv('jar');$('cKeep').disabled=full;$('cKeep').textContent=full?'Jar is full':'Put in jar';
 $('cSell').textContent=`Sell $${fmt(priceOf(sp,c.len))}`;
 requestAnimationFrame(()=>paintBug($('cCanvas'),sp,true,true));
}
function closeCatch(){S.pending=null;save();$('catch').hidden=true;updateHud();if(panel)renderSheet();}
$('cKeep').onclick=()=>{const c=S.pending;if(!c)return;if(S.jarBugs.length>=uv('jar'))return;S.jarBugs.push({id:c.id,len:c.len});toast(`${SPI[c.id].name} went into your jar!`);closeCatch();};
$('cSell').onclick=()=>{const c=S.pending;if(!c)return;S.money+=priceOf(SPI[c.id],c.len);sCoin();closeCatch();};
$('cRelease').onclick=()=>{const c=S.pending;if(!c)return;const sp=SPI[c.id];burst(NET.x,NET.y-20,'#fff',10);toast(`Bye bye, ${sp.name}!`);closeCatch();};

/* ---------- HUD & sheets ---------- */
let panel=null,bookSel=null,jarSim=[];
function updateHud(){
 $('money').textContent=fmt(S.money);
 $('foundCount').textContent=`${Object.keys(S.book).filter(k=>SPI[k]).length} / ${SP.length}`;
 $('jarCount').textContent=`${S.jarBugs.length} / ${uv('jar')}`;
 $('mapSmall').textContent=`${S.unlocked.filter(Boolean).length} / ${AREAS.length} areas`;
 $('areaLbl').textContent=A().name;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.p===panel));
}
function openSheet(p){panel=p;$('sheet').hidden=false;NET.hold=false;ptr=null;renderSheet();$('sheetBody').scrollTop=0;}
function closeSheet(){panel=null;$('sheet').hidden=true;updateHud();}
$('closeSheet').onclick=closeSheet;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ac();if(panel===b.dataset.p)closeSheet();else openSheet(b.dataset.p);});
$('mapBtn').onclick=()=>{ac();openSheet('map');};
$('sfxBtn').onclick=()=>{S.sfx=!S.sfx;save();syncSfx();if(S.sfx)tone(660,.1,'triangle',.06);};
function syncSfx(){$('sfxBtn').setAttribute('aria-pressed',S.sfx?'true':'false');$('sfxBtn').setAttribute('aria-label',S.sfx?'Sounds on':'Sounds off');}

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderSheet(){
 const body=$('sheetBody');body.innerHTML='';updateHud();
 const paints=[];
 if(panel==='book'){
  $('sheetTitle').textContent='Bug Book';
  const n=Object.keys(S.book).filter(k=>SPI[k]).length;$('sheetSub').textContent=`${n} of ${SP.length} bugs found`;
  if(bookSel){const sp=SPI[bookSel],bk=S.book[bookSel],d=el('div','detail');const cvs=el('canvas');d.appendChild(cvs);
   const badge=el('span','badge',esc(RAR[sp.r].n));badge.style.color=RAR[sp.r].c;d.appendChild(badge);
   d.appendChild(el('h3',null,bk?esc(sp.name):'???'));
   const meta=el('div','meta');(bk?[`Caught ${bk.count}`,`Biggest ${fmtLen(bk.best)}`,`Lives in ${AREAS[sp.a].name}`]:[`Lives in ${AREAS[sp.a].name}`]).forEach(s=>meta.appendChild(el('span',null,esc(s))));d.appendChild(meta);
   d.appendChild(el('p',null,bk?esc(sp.fact):'You haven\'t caught this bug yet. Keep exploring to find it!'));
   body.appendChild(d);paints.push([cvs,sp,!!bk,true]);}
  AREAS.forEach((ar,ai)=>{const list=SP.filter(s=>s.a===ai).sort((a,b)=>a.r-b.r||a.price-b.price);const got=list.filter(s=>S.book[s.id]).length;
   body.appendChild(el('h4','sec',`${esc(ar.name)}<small>${got} / ${list.length}${S.unlocked[ai]?'':' · locked'}</small>`));
   const grid=el('div','grid');
   list.forEach(sp=>{const known=!!S.book[sp.id],c=el('button','cell'+(bookSel===sp.id?' sel':''));const cvs=el('canvas');c.appendChild(cvs);
    c.appendChild(el('b',null,known?esc(sp.name):'???'));const dot=el('i');dot.style.background=RAR[sp.r].c;c.appendChild(dot);
    c.setAttribute('aria-label',known?sp.name:'Unknown bug');
    c.onclick=()=>{bookSel=sp.id;renderSheet();$('sheetBody').scrollTop=0;};grid.appendChild(c);paints.push([cvs,sp,known,false]);});
   body.appendChild(grid);});
 }else if(panel==='jar'){
  $('sheetTitle').textContent='Bug Jar';$('sheetSub').textContent=`${S.jarBugs.length} of ${uv('jar')} spots used`;
  const jv=el('canvas','jarview');jv.id='jarCv';body.appendChild(jv);
  jarSim=S.jarBugs.map((b,i)=>({id:b.id,x:rand(.2,.8),y:SPI[b.id].mv==='fly'?rand(.2,.7):.86,vx:rand(-.05,.05),vy:0,t:Math.random()*9,dir:1,tx:rand(.2,.8),ty:rand(.2,.7),nt:0}));
  if(!S.jarBugs.length)body.appendChild(el('p','empty','Your jar is empty. Catch a bug and tap <b>Put in jar</b> to keep it here!'));
  else{const tot=S.jarBugs.reduce((s,b)=>s+priceOf(SPI[b.id],b.len),0);const sa=el('button','btn',`Sell all bugs for $${fmt(tot)}`);sa.onclick=()=>{S.money+=tot;S.jarBugs=[];sCoin();save();renderSheet();};body.appendChild(sa);}
  S.jarBugs.forEach((b,i)=>{const sp=SPI[b.id],row=el('div','row'),cvs=el('canvas');row.appendChild(cvs);
   const tx=el('div','txt');tx.appendChild(el('b',null,esc(sp.name)));const sub=el('span',null,`${esc(RAR[sp.r].n)} · ${fmtLen(b.len)}`);tx.appendChild(sub);row.appendChild(tx);
   const sb=el('button','btn small',`Sell $${fmt(priceOf(sp,b.len))}`);sb.onclick=()=>{S.money+=priceOf(sp,b.len);S.jarBugs.splice(i,1);sCoin();save();renderSheet();};row.appendChild(sb);
   body.appendChild(row);paints.push([cvs,sp,true,false]);});
 }else if(panel==='map'){
  $('sheetTitle').textContent='Forest Map';$('sheetSub').textContent='Unlock new places to find new bugs';
  AREAS.forEach((ar,i)=>{const card=el('div','shopcard'+(i===S.area?' here':''));const list=SP.filter(s=>s.a===i),got=list.filter(s=>S.book[s.id]).length;
   const top=el('div','top');top.appendChild(el('h3',null,esc(ar.name)));top.appendChild(el('span','meta',`${got} / ${list.length} bugs`));card.appendChild(top);
   card.appendChild(el('p',null,esc(ar.desc)));
   let btn;
   if(i===S.area)btn=el('button','btn','You are here'),btn.disabled=true;
   else if(S.unlocked[i]){btn=el('button','btn alt','Go here');btn.onclick=()=>travel(i);}
   else{btn=el('button','btn',`Unlock for $${fmt(ar.price)}`);btn.disabled=S.money<ar.price;btn.onclick=()=>{if(S.money<ar.price)return;S.money-=ar.price;S.unlocked[i]=true;sCoin();save();travel(i);};}
   card.appendChild(btn);body.appendChild(card);});
 }else if(panel==='shop'){
  $('sheetTitle').textContent='Shop';$('sheetSub').textContent='Spend your bug money on better gear';
  for(const k of Object.keys(UP)){const u=UP[k],lv=S[k],max=u.val.length-1,card=el('div','shopcard');
   const top=el('div','top');top.appendChild(el('h3',null,esc(u.name)));const pips=el('div','pips');for(let i=1;i<=max;i++)pips.appendChild(el('i',i<=lv?'on':''));top.appendChild(pips);card.appendChild(top);
   card.appendChild(el('p',null,esc(u.desc)));
   card.appendChild(el('p',null,`<span class="now">Now: ${esc(u.show(u.val[lv]))}</span>${lv<max?` → next: ${esc(u.show(u.val[lv+1]))}`:''}`));
   const b=el('button','btn',lv>=max?'Maxed out!':`Upgrade for $${fmt(u.prices[lv+1])}`);b.disabled=lv>=max||S.money<u.prices[lv+1];
   b.onclick=()=>{if(lv>=max||S.money<u.prices[lv+1])return;S.money-=u.prices[lv+1];S[k]++;sCoin();save();renderSheet();toast(`${u.name} upgraded!`);};
   card.appendChild(b);body.appendChild(card);}
  const sv=el('div','shopcard');sv.appendChild(el('h3',null,'Your save'));
  sv.appendChild(el('p',null,'Your game saves on this device. Copy your save code to keep it safe, or to move your bugs and money to another phone, tablet or computer.'));
  const ta=el('textarea','savebox');ta.rows=3;ta.value=saveCode();ta.setAttribute('aria-label','Save code');sv.appendChild(ta);
  const bs=el('div','savebtns'),cp=el('button','btn alt','Copy code'),ld=el('button','btn','Load a code');
  cp.onclick=()=>{ta.value=saveCode();ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(()=>toast('Save code copied!')).catch(()=>toast(ok?'Save code copied!':'Select the code and copy it'));else toast(ok?'Save code copied!':'Select the code and copy it');};
  ld.onclick=()=>{const d=readCode(ta.value);if(!d){toast('That code doesn\'t look right. Paste your whole WWB1 code in the box.','#ff6b4a',2600);return;}
   for(const k of Object.keys(S))delete S[k];Object.assign(S,DEF(),d);fix();save();buildLayers();fillBugs();updateHud();syncSfx();toast('Save loaded!');renderSheet();};
  bs.appendChild(cp);bs.appendChild(ld);sv.appendChild(bs);
  sv.appendChild(el('p','how','To load a save: paste the code into the box above, then tap Load a code.'));
  body.appendChild(sv);
 }
 requestAnimationFrame(()=>paints.forEach(p=>paintBug(...p)));
}
function travel(i){S.area=i;save();bugs=[];parts=[];amb=[];buildLayers();P.x=WW*.12;cam=0;NET.x=P.x;NET.y=FY()-72;fillBugs();closeSheet();toast(`Welcome to the ${AREAS[i].name}!`,null,2200);}

function drawJar(dt){
 const c=$('jarCv');if(!c)return;const r=c.getBoundingClientRect();if(!r.width)return;
 const dpr=Math.min(2,window.devicePixelRatio||1),w=r.width,h=r.height;
 if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
 const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
 const jx=w*.12,jw=w*.76,jy=h*.12,jh=h*.82;
 x.fillStyle='#8a5a2a';x.fillRect(jx+jw*.08,jy-14,jw*.84,14);x.fillStyle='#a8743a';x.fillRect(jx+jw*.08,jy-14,jw*.84,4);
 x.save();x.beginPath();x.roundRect?x.roundRect(jx,jy,jw,jh,22):x.rect(jx,jy,jw,jh);x.clip();
 const gg=x.createLinearGradient(0,jy,0,jy+jh);gg.addColorStop(0,'rgba(200,240,255,.12)');gg.addColorStop(1,'rgba(120,200,140,.2)');x.fillStyle=gg;x.fillRect(jx,jy,jw,jh);
 x.fillStyle='#6a4a2a';x.fillRect(jx,jy+jh*.9,jw,jh*.1);x.fillStyle='#4a9a3a';for(let i=0;i<14;i++){const lx=jx+jw*(i/13);E(x,lx,jy+jh*.9,10,4,i);x.fill();}
 x.strokeStyle='#7a5a32';x.lineWidth=5;x.beginPath();x.moveTo(jx+jw*.15,jy+jh*.92);x.quadraticCurveTo(jx+jw*.35,jy+jh*.55,jx+jw*.6,jy+jh*.45);x.stroke();
 x.fillStyle='#5ab84a';E(x,jx+jw*.62,jy+jh*.42,14,6,.4);x.fill();E(x,jx+jw*.4,jy+jh*.62,12,5,-.5);x.fill();
 for(const b of jarSim){const sp=SPI[b.id];b.t+=dt;
  if(sp.mv==='fly'){if(b.t>b.nt){b.nt=b.t+rand(1,3);b.tx=rand(.15,.85);b.ty=rand(.15,.7);}b.vx+=((b.tx-b.x)*.6-b.vx)*Math.min(1,dt*2);b.vy+=((b.ty-b.y)*.6-b.vy)*Math.min(1,dt*2);}
  else{if(b.t>b.nt){b.nt=b.t+rand(1,3);b.tx=rand(.15,.85);}b.vx+=((b.tx-b.x)*.4-b.vx)*Math.min(1,dt*3);b.vy=0;b.y=.86;}
  b.x=clamp(b.x+b.vx*dt,.1,.9);b.y=clamp(b.y+b.vy*dt,.1,.9);if(Math.abs(b.vx)>.005)b.dir=Math.sign(b.vx);
  const s=Math.min(46,Math.max(18,sp.s*.9));
  drawBug(x,sp,jx+jw*b.x,jy+jh*b.y,s,b.dir,b.t,sp.mv==='fly',Math.abs(b.vx)>.01);}
 x.restore();
 x.strokeStyle='rgba(220,250,255,.55)';x.lineWidth=3;x.beginPath();x.roundRect?x.roundRect(jx,jy,jw,jh,22):x.rect(jx,jy,jw,jh);x.stroke();
 x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=5;x.beginPath();x.moveTo(jx+14,jy+30);x.lineTo(jx+14,jy+jh*.6);x.stroke();
 if(!jarSim.length){x.fillStyle='rgba(255,255,255,.45)';x.font='800 14px Nunito,system-ui';x.textAlign='center';x.fillText('Empty jar',w/2,h/2);}
}

/* ---------- Loop ---------- */
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
 if(W>0){update(dt);draw();}
 if(panel==='jar')drawJar(dt);
 requestAnimationFrame(frame);
}
new ResizeObserver(()=>{resize();}).observe(stage);
resize();
NET.x=P.x;NET.y=FY()-72;
fillBugs();
syncSfx();updateHud();
if(S.seen)$('hint').hidden=true;
if(S.pending)openCatch();
requestAnimationFrame(frame);
})();
</script>
</body></html>
