<!DOCTYPE html>
<html lang="en">
<head>
<script>window.ARCADE_NO_BACK = true;</script>
<script src="../account.js"></script>
<script src="../avatar.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Melon Lab Sandbox</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a2233;font-family:Fredoka,system-ui,sans-serif;color:#fff;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  .top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
  .top>*{pointer-events:auto}
  .top h1{margin:0 6px 0 2px;font-size:20px;font-weight:700;color:#7dff7a;text-shadow:0 2px 0 #1a5a1a;white-space:nowrap}
  .sp{flex:1}
  .tb{border:0;border-radius:12px;background:#ffffff18;color:#fff;font:600 13px Fredoka,sans-serif;padding:8px 10px;cursor:pointer;white-space:nowrap}
  .tb.on{background:#7dff7a;color:#123}
  a.tb{text-decoration:none}
  .tools{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 52px);display:flex;flex-direction:column;gap:6px;z-index:5}
  .tools button{width:48px;height:48px;border-radius:14px;border:2px solid #ffffff22;background:#00000055;font-size:22px;cursor:pointer;position:relative}
  .tools button.on{border-color:#7dff7a;background:#1f4a2a}
  .tools button span{position:absolute;left:54px;top:50%;transform:translateY(-50%);font:600 12px Fredoka;background:#000a;padding:3px 7px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
  .tools button:hover span{opacity:1}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#0d1320ee;border-top:2px solid #ffffff14;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px)}
  .cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
  .cats::-webkit-scrollbar,.items::-webkit-scrollbar{display:none}
  .cats button{border:0;border-radius:20px;background:#ffffff14;color:#cfe;font:600 13px Fredoka;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .cats button.on{background:#fff;color:#123}
  .items{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .item{flex:0 0 auto;width:72px;border-radius:14px;border:2px solid #ffffff18;background:#ffffff0c;padding:6px 4px 5px;text-align:center;cursor:pointer;font:600 11px Fredoka;color:#dfe}
  .item i{display:block;font-style:normal;font-size:28px;line-height:1.15}
  .item.on{border-color:#7dff7a;background:#1f4a2a;color:#fff}
  @media (max-width:620px){ .tb span{display:none} .top h1{font-size:17px} #hint{top:auto!important;bottom:calc(env(safe-area-inset-bottom) + 120px);white-space:normal;max-width:80vw;text-align:center} }
  #pad{position:fixed;left:0;right:0;bottom:calc(var(--dock,110px) + 10px);z-index:6;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
  #pad[hidden]{display:none}
  #pad div{display:flex;gap:10px;pointer-events:auto}
  #pad button{width:62px;height:62px;border-radius:50%;border:2px solid #ffffff44;background:#000000aa;color:#fff;font-size:26px;touch-action:none;-webkit-user-select:none;user-select:none}
  #pad button.on{background:#7dff7a;color:#123}
  #netBox{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
  #netBox[hidden]{display:none}
  .nb{position:relative;width:100%;max-width:360px;background:#141c2c;border:2px solid #ffffff22;border-radius:18px;padding:20px;text-align:center}
  .nb h3{margin:0 0 6px;font-size:22px}
  .nb p{margin:0 0 12px;font-size:14px;opacity:.8;line-height:1.4}
  .nb input{width:100%;height:44px;border-radius:12px;border:2px solid #ffffff22;background:#0b111c;color:#fff;font:600 17px Fredoka,sans-serif;text-align:center;margin-bottom:10px}
  .nb .row{display:flex;gap:8px}.nb .row input{margin:0;text-transform:uppercase;letter-spacing:4px}
  .nbtn{border:0;border-radius:12px;height:44px;padding:0 18px;font:700 16px Fredoka,sans-serif;background:#7dff7a;color:#123;cursor:pointer;width:100%}
  .nbtn.blue{background:#5ab0ff;width:auto}.nbtn.red{background:#ff6b6b;color:#fff;margin-top:10px}
  .nb .or{margin:12px 0 8px;font-size:12px;opacity:.6;letter-spacing:.1em}
  .nb .x{position:absolute;right:12px;top:10px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
  #netCodeShow{font:700 38px Fredoka,sans-serif;letter-spacing:8px;background:#000;border-radius:12px;padding:6px;margin:6px 0}
  #netPlayers{font-size:14px;opacity:.85;line-height:1.6}
  #netMsg{min-height:18px;font-size:13px;color:#8fe3ff;margin-top:10px}
  .tb.live{background:#5ab0ff;color:#012}
  #hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%);background:#000a;padding:7px 14px;border-radius:20px;font-size:13px;z-index:4;pointer-events:none;transition:opacity .4s;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <h1>🍉 Melon Lab</h1>
  <div class="sp"></div>
  <button class="tb" id="playBtn">🎮<span> Play</span></button>
  <button class="tb" id="netBtn">👥<span> Online</span></button>
  <button class="tb" id="gravBtn">🌍<span> Gravity</span></button>
  <button class="tb on" id="juiceBtn">💧<span> Juice</span></button>
  <button class="tb" id="slowBtn">🐢<span> Slow-mo</span></button>
  <button class="tb" id="pauseBtn">⏸</button>
  <button class="tb" id="clearBtn">🧹<span> Clear</span></button>
  <a class="tb" href="../">‹<span> Arcade</span></a>
</div>
<div class="tools" id="tools">
  <button data-t="drag" class="on">✋<span>Grab &amp; throw</span></button>
  <button data-t="pin">📌<span>Pin / unpin</span></button>
  <button data-t="poke">👉<span>Poke (sets off TNT)</span></button>
  <button data-t="hammer">🔨<span>Hammer (bonk!)</span></button>
  <button data-t="cut">✂️<span>Cut off arms &amp; legs (swipe)</span></button>
  <button data-t="heal">❤️<span>Heal / revive</span></button>
  <button data-t="delete">🗑️<span>Delete</span></button>
</div>
<div id="pad" hidden>
  <div class="padL"><button data-k="l">◀</button><button data-k="r">▶</button></div>
  <div class="padR"><button data-k="j">⤒</button><button data-k="p">👊</button></div>
</div>
<div id="netBox" hidden>
  <div class="nb">
    <button class="x" id="netClose">✕</button>
    <h3>👥 Play online</h3>
    <p>Play in the same lab with friends. Everyone can spawn stuff, use tools and play as their own guy.</p>
    <input id="netName" maxlength="14" placeholder="Your name">
    <div id="netIdle">
      <button class="nbtn" id="hostBtn">🏠 Host a lab</button>
      <div class="or">or join a friend</div>
      <div class="row"><input id="netCode" maxlength="5" placeholder="CODE"><button class="nbtn blue" id="joinBtn">Join</button></div>
    </div>
    <div id="netOn" hidden>
      <div id="netCodeShow"></div>
      <div id="netPlayers"></div>
      <button class="nbtn red" id="leaveBtn">Leave</button>
    </div>
    <div id="netMsg"></div>
  </div>
</div>
<div id="hint">Pick something below, then tap the world to drop it in</div>
<div class="dock">
  <div class="cats" id="cats"></div>
  <div class="items" id="items"></div>
</div>

<script src="matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" async></script>
<script>
(() => {
const { Engine, Bodies, Body, Composite, Constraint, Query, Events, Vector } = Matter;
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let FW = 0, FH = 0, VS = 1, VX = 0, VY = 0, fixedWorld = null;   // world size (shared in online play) and how it fits the screen
const engine = Engine.create({ enableSleeping: false });
const world = engine.world;
engine.gravity.y = 1;
let bounds = [];

// ---------- save a few numbers for the arcade ----------
const SKEY = 'melonLabStats';
let stats = { spawned: 0, booms: 0, kos: 0, cuts: 0, shots: 0 }; try { stats = Object.assign(stats, JSON.parse(localStorage.getItem(SKEY)) || {}); } catch (e) {}
let saveT = 0; function bump(k, n = 1){ stats[k] += n; clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(SKEY, JSON.stringify(stats)); } catch (e) {} }, 800); }

function addWord(w){ words.push(w); netFx('wd', [w]); }
// ---------- sound ----------
let ac = null;
function snd(type){
  netFx('sn', [type]);
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    if (type === 'boom'){
      const len = .7, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
      const s = ac.createBufferSource(), gn = ac.createGain(); gn.gain.value = .35; s.buffer = buf; s.connect(gn).connect(ac.destination); s.start(); return;
    }
    const o = ac.createOscillator(), gn = ac.createGain();
    const f = { pop: [520, .07, 'triangle', .06], boing: [220, .25, 'sine', .08], bonk: [140, .08, 'square', .03], pin: [880, .06, 'square', .03], del: [300, .12, 'sawtooth', .03] }[type] || [440, .05, 'sine', .03];
    o.type = f[2]; o.frequency.setValueAtTime(f[0], t); if (type === 'boing') o.frequency.exponentialRampToValueAtTime(700, t + f[1]);
    gn.gain.setValueAtTime(f[3], t); gn.gain.exponentialRampToValueAtTime(.0001, t + f[1]);
    o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + f[1]);
  } catch (e) {}
}

// ---------- world edges ----------
function buildBounds(){
  bounds.forEach(b => Composite.remove(world, b));
  const t = 200, floorY = FH;
  bounds = [
    Bodies.rectangle(FW / 2, floorY + t / 2, FW * 3, t, { isStatic: true, kind: 'floor', friction: .9 }),
    Bodies.rectangle(-t / 2, FH / 2, t, FH * 4, { isStatic: true, kind: 'wall' }),
    Bodies.rectangle(FW + t / 2, FH / 2, t, FH * 4, { isStatic: true, kind: 'wall' }),
    Bodies.rectangle(FW / 2, -FH * 1.5, FW * 3, t, { isStatic: true, kind: 'wall' })
  ];
  Composite.add(world, bounds);
}
const dockH = () => document.querySelector('.dock').offsetHeight;
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  const avail = H - dockH(); document.documentElement.style.setProperty('--dock', dockH() + 'px');
  if (fixedWorld){ FW = fixedWorld.w; FH = fixedWorld.h; }
  else if (!(NET.mode === 'host' && FW)){ FW = W; FH = avail; }
  VS = Math.min(W / FW, avail / FH); VX = (W - FW * VS) / 2; VY = Math.max(0, avail - FH * VS);
  buildBounds(); gun.y = 0;
}
addEventListener('resize', resize);

// ---------- things you can spawn ----------
let groupN = 0;
const ragdolls = new Map();   // composite id -> ragdoll info
function makeRagdoll(x, y, look){
  const grp = Body.nextGroup(true), s = 1;
  const opt = (kind, extra) => Object.assign({ collisionFilter: { group: grp }, friction: .6, frictionAir: .01, restitution: .1, kind, look }, extra || {});
  const head = Bodies.circle(x, y - 62 * s, 17 * s, opt('head', { density: .0016 }));
  const torso = Bodies.rectangle(x, y - 22 * s, 26 * s, 44 * s, opt('torso', { chamfer: { radius: 9 } }));
  const ua1 = Bodies.rectangle(x - 20, y - 30, 9, 24, opt('arm', { chamfer: { radius: 4 } }));
  const la1 = Bodies.rectangle(x - 20, y - 6, 8, 22, opt('hand', { chamfer: { radius: 4 } }));
  const ua2 = Bodies.rectangle(x + 20, y - 30, 9, 24, opt('arm', { chamfer: { radius: 4 } }));
  const la2 = Bodies.rectangle(x + 20, y - 6, 8, 22, opt('hand', { chamfer: { radius: 4 } }));
  const ul1 = Bodies.rectangle(x - 7, y + 12, 11, 26, opt('leg', { chamfer: { radius: 5 } }));
  const ll1 = Bodies.rectangle(x - 7, y + 38, 10, 26, opt('foot', { chamfer: { radius: 5 } }));
  const ul2 = Bodies.rectangle(x + 7, y + 12, 11, 26, opt('leg', { chamfer: { radius: 5 } }));
  const ll2 = Bodies.rectangle(x + 7, y + 38, 10, 26, opt('foot', { chamfer: { radius: 5 } }));
  const J = (a, b, pa, pb) => Constraint.create({ bodyA: a, bodyB: b, pointA: pa, pointB: pb, stiffness: .9, length: 0, render: { visible: false } });
  const joints = [
    J(head, torso, { x: 0, y: 16 }, { x: 0, y: -24 }),
    J(torso, ua1, { x: -13, y: -18 }, { x: 0, y: -11 }), J(ua1, la1, { x: 0, y: 11 }, { x: 0, y: -10 }),
    J(torso, ua2, { x: 13, y: -18 }, { x: 0, y: -11 }), J(ua2, la2, { x: 0, y: 11 }, { x: 0, y: -10 }),
    J(torso, ul1, { x: -7, y: 21 }, { x: 0, y: -12 }), J(ul1, ll1, { x: 0, y: 12 }, { x: 0, y: -12 }),
    J(torso, ul2, { x: 7, y: 21 }, { x: 0, y: -12 }), J(ul2, ll2, { x: 0, y: 12 }, { x: 0, y: -12 })
  ];
  const parts = [ua1, la1, ul1, ll1, ul2, ll2, torso, ua2, la2, head];
  const comp = Composite.create({ label: 'ragdoll' });
  Composite.add(comp, parts); Composite.add(comp, joints);
  parts.forEach(p => p.rag = comp);
  head.face = { dizzy: 0, shock: 0, blink: Math.random() * 4 };
  ragdolls.set(comp.id, { fx: {}, cut: new Set(), comp, head, torso, legs: [ul1, ul2], feet: [ll1, ll2], arms: [ua1, ua2, la1, la2], look, hp: 100, ko: false, joints, hpShow: 0, stun: 0 });
  [ll1, ll2].forEach(f => f.isFoot = true);
  Composite.add(world, comp);
  return comp;
}

const LOOKS = {
  melon: { head: '#4caf50', stripe: '#2e7d32', body: '#7ccf4f', limb: '#6bbf42', leg: '#3e8e3e', juice: '#3fdc2a', inside: '#d8ffb0' },
  pumpkin: { head: '#ff9a2e', stripe: '#d06a10', body: '#7a4a2a', limb: '#8a5a32', leg: '#4a3020', stem: true, juice: '#ff8a1a', inside: '#ffd59a' },
  lemon: { head: '#ffe14a', stripe: '#e0b800', body: '#3d6bff', limb: '#ffe14a', leg: '#2a2a30', juice: '#ffe600', inside: '#fffbd0' }
};
function avatarLook(){
  try { const c = ArcadeAvatar.colors(); return { head: c.skin, stripe: null, body: c.shirt, limb: c.shirt, hand: c.skin, leg: c.pants, hair: c.hair, hairStyle: c.hairStyle, hat: c.hat, hatC: c.hatC, person: true }; }
  catch (e) { return LOOKS.melon; }
}

function spawn(id, x, y, opt){
  opt = opt || {};
  let made = null;
  const B = (b) => { Composite.add(world, b); made = b; return b; };
  switch (id){
    case 'melon': case 'pumpkin': case 'lemon': made = makeRagdoll(x, y, LOOKS[id]); break;
    case 'me': made = makeRagdoll(x, y, opt.look || avatarLook()); break;
    case 'cannonball': B(Bodies.circle(x, y, 16, { kind: 'cannonball', density: .02, frictionAir: .002, restitution: .2 })); made.life = 400; break;
    case 'box': B(Bodies.rectangle(x, y, 50, 50, { kind: 'box', friction: .6, chamfer: { radius: 4 } })); break;
    case 'crate': B(Bodies.rectangle(x, y, 80, 80, { kind: 'crate', density: .004, friction: .7, chamfer: { radius: 4 } })); break;
    case 'ball': B(Bodies.circle(x, y, 24, { kind: 'ball', restitution: .85, friction: .05, density: .0008 })); break;
    case 'bowling': B(Bodies.circle(x, y, 26, { kind: 'bowling', density: .02, restitution: .1 })); break;
    case 'plank': B(Bodies.rectangle(x, y, 180, 16, { kind: 'plank', friction: .7, density: .002 })); break;
    case 'barrel': B(Bodies.rectangle(x, y, 44, 62, { kind: 'barrel', chamfer: { radius: 12 }, density: .002 })); break;
    case 'watermelon': B(Bodies.circle(x, y, 30, { kind: 'watermelon', restitution: .3, density: .0015 })); break;
    case 'tnt': B(Bodies.rectangle(x, y, 44, 44, { kind: 'tnt', chamfer: { radius: 3 } })); break;
    case 'bigtnt': B(Bodies.rectangle(x, y, 70, 70, { kind: 'tnt', big: true, chamfer: { radius: 4 } })); break;
    case 'balloon': {
      const b = B(Bodies.circle(x, y, 22, { kind: 'balloon', density: .0002, frictionAir: .03, color: ['#ff4d6d', '#3d6bff', '#ffd23f', '#3fc679', '#b05cff'][Math.floor(Math.random() * 5)] }));
      // tie it to whatever is right under it
      const under = Query.point(Composite.allBodies(world).filter(o => !o.isStatic && o !== b), { x, y: y + 60 })[0];
      if (under){ Composite.add(world, Constraint.create({ bodyA: b, bodyB: under, pointB: { x: 0, y: 0 }, length: 70, stiffness: .05, kind: 'string' })); }
      break;
    }
    case 'spring': B(Bodies.rectangle(x, y, 80, 18, { kind: 'spring', isStatic: true })); break;
    case 'fanR': B(Bodies.rectangle(x, y, 40, 60, { kind: 'fan', dir: 1, isStatic: true })); break;
    case 'fanL': B(Bodies.rectangle(x, y, 40, 60, { kind: 'fan', dir: -1, isStatic: true })); break;
    case 'wall': B(Bodies.rectangle(x, y, 30, 160, { kind: 'block', isStatic: true })); break;
    case 'floor': B(Bodies.rectangle(x, y, 220, 26, { kind: 'block', isStatic: true })); break;
    case 'ramp': B(Bodies.fromVertices(x, y, [[{ x: 0, y: 0 }, { x: 160, y: 0 }, { x: 160, y: -80 }]], { kind: 'ramp', isStatic: true })); break;
    case 'wheel': {
      const w = B(Bodies.circle(x, y, 34, { kind: 'wheel', friction: 1, density: .003 }));
      w.motor = .35; break;
    }
  }
  if (made){
    netTag(made, id, x, y, opt);
    if (id !== 'cannonball' && opt.nid == null){ bump('spawned'); snd('pop'); }
  }
  return made;
}

const CATS = [
  { n: '🍉 People', items: [['melon', '🍉', 'Melon'], ['pumpkin', '🎃', 'Pumpkin'], ['lemon', '🍋', 'Lemon'], ['me', '😎', 'My Avatar']] },
  { n: '📦 Props', items: [['box', '📦', 'Box'], ['crate', '🧰', 'Big crate'], ['ball', '⚽', 'Bouncy ball'], ['bowling', '🎳', 'Heavy ball'], ['plank', '🪵', 'Plank'], ['barrel', '🛢️', 'Barrel'], ['watermelon', '🍉', 'Watermelon']] },
  { n: '⚙️ Machines', items: [['spring', '🟩', 'Spring pad'], ['fanR', '💨', 'Fan →'], ['fanL', '💨', 'Fan ←'], ['balloon', '🎈', 'Balloon'], ['wheel', '🛞', 'Motor wheel']] },
  { n: '💉 Syringes', items: [['s_acid', '🧪', 'Acid'], ['s_immortal', '✨', 'Immortal'], ['s_joint', '🦴', 'Strong joints'], ['s_scream', '😱', 'Scream'], ['s_adren', '⚡', 'Adrenaline'], ['s_sleep', '💤', 'Sleep'], ['s_float', '🎈', 'Floaty'], ['s_giant', '👹', 'Giant Rage'], ['s_cure', '💧', 'Cure']] },
  { n: '🔫 Guns', items: [['g_pistol', '🔫', 'Pistol'], ['g_shotgun', '💥', 'Shotgun'], ['g_laser', '⚡', 'Laser'], ['g_cannon', '💣', 'Cannon']] },
  { n: '💥 Boom', items: [['tnt', '🧨', 'TNT'], ['bigtnt', '💣', 'Mega TNT']] },
  { n: '🧱 Build', items: [['floor', '▬', 'Platform'], ['wall', '▮', 'Wall'], ['ramp', '◢', 'Ramp']] }
];
let cat = 0, pick = null, tool = 'drag';
function paintDock(){
  document.getElementById('cats').innerHTML = CATS.map((c, i) => `<button data-c="${i}" class="${i === cat ? 'on' : ''}">${c.n}</button>`).join('');
  document.getElementById('items').innerHTML = CATS[cat].items.map(([id, e, n]) => `<div class="item ${pick === id ? 'on' : ''}" data-id="${id}"><i>${e}</i>${n}</div>`).join('');
}
document.getElementById('cats').onclick = e => { const b = e.target.closest('[data-c]'); if (b){ cat = +b.dataset.c; paintDock(); } };
document.getElementById('items').onclick = e => {
  const it = e.target.closest('[data-id]'); if (!it) return;
  pick = pick === it.dataset.id ? null : it.dataset.id; paintDock();
  if (pick && pick.startsWith('g_')) hint('Tap where you want to shoot! Drag the gun to move it.');
  else if (pick && pick.startsWith('s_')) hint('Tap a person to inject the syringe 💉');
  else hint(pick ? 'Tap the world to drop it in. Drag things to throw them!' : 'Grab things to throw them');
};
document.getElementById('tools').onclick = e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  tool = b.dataset.t; pick = null; paintDock();
  document.querySelectorAll('#tools button').forEach(x => x.classList.toggle('on', x === b));
  hint({ cut: 'Swipe across an arm or leg to cut it off. Heal ❤️ puts it back!', hammer: 'Tap a fruit person to bonk them with the hammer', heal: 'Tap a fruit person to heal them and put their arms and legs back', drag: 'Grab things and throw them', pin: 'Tap something to pin it in the air (tap again to unpin)', poke: 'Tap things to give them a push. Poke TNT to blow it up!', delete: 'Tap something to delete it' }[tool]);
};

const GUNS = {
  g_pistol:  { dmg: 28, push: .035, spread: 0,   shots: 1, col: '#ffe36e', name: 'Pistol', cool: 160 },

const gun = { x: 70, y: 0, ang: 0, flash: 0, last: 0, held: false };
const tracers = [];
function placeGun(){ gun.y = FH - 34; if (gun.x > FW - 40) gun.x = FW * .12; }
function shoot(tx, ty){
  const G = GUNS[pick]; const now = performance.now(); if (now - gun.last < G.cool) return; gun.last = now;
  gun.ang = Math.atan2(ty - gun.y, tx - gun.x); gun.flash = 1;
  const mx = gun.x + Math.cos(gun.ang) * 34, my = gun.y + Math.sin(gun.ang) * 34;
  if (G.cannon){
    const ball = spawn('cannonball', mx, my); Body.setVelocity(ball, { x: Math.cos(gun.ang) * 28, y: Math.sin(gun.ang) * 28 });

  }

// ---------- cutting off arms and legs (fruit people only) ----------
const jointAt = j => Vector.add(j.bodyA.position, Vector.rotate(j.pointA, j.bodyA.angle));
function cutJoint(R, j){
  if (!R.look.juice || j.bodyB === R.head || R.cut.has(j) || R.fx.immortal || R.fx.strong) return false;   // heads stay on; your avatar can't be cut
  Composite.remove(R.comp, j); R.cut.add(j);
  const p = jointAt(j);
  if (juiceOn) squirt(p.x, p.y, R.look.juice, 22, 5);
  burst(p.x, p.y, R.look.inside, 6, 3);
  Body.applyForce(j.bodyB, j.bodyB.position, { x: (Math.random() - .5) * .004 * j.bodyB.mass * 10, y: -.003 * j.bodyB.mass * 10 });
  hurt(j.bodyA, 18, p); snd('del'); bump('cuts');
  return true;
}
function reattach(R){
  R.cut.forEach(j => {
    const p = jointAt(j);
    // put the part back where it belongs, then join it again
    const off = Vector.rotate(j.pointB, j.bodyB.angle);
    Body.setPosition(j.bodyB, Vector.sub(p, off)); Body.setVelocity(j.bodyB, { x: 0, y: 0 });
    Composite.add(R.comp, j);
  });
  // children of a re-attached part may need moving too: do a second pass
  R.cut.forEach(j => { const p = jointAt(j); Body.setPosition(j.bodyB, Vector.sub(p, Vector.rotate(j.pointB, j.bodyB.angle))); });
  R.cut.clear();
}

function slashTo(x, y){

  const a = slash.last, b = { x, y };
  ragdolls.forEach(R => R.joints.forEach(j => { if (!R.cut.has(j) && segDist(jointAt(j), a, b) < 13) cutJoint(R, j); }));
  // also cut a part if the swipe goes right through its middle
  Composite.allBodies(world).forEach(body => {
    if (!body.rag || body.kind === 'torso' || body.kind === 'head') return;
    if (segDist(body.position, a, b) < 7){ const R = ragdolls.get(body.rag.id); const j = R && R.joints.find(q => q.bodyB === body); if (j) cutJoint(R, j); }
  });

}

const FX_NAMES = { s_acid: 'ACID!', s_immortal: 'IMMORTAL!', s_joint: 'STRONG JOINTS!', s_scream: 'AAAAH!', s_adren: 'ADRENALINE!', s_sleep: 'Zzz…', s_float: 'FLOATY!', s_giant: 'RAAAAH!', s_cure: 'CURED!' };

function resizeRag(R, k){

function punch(R, dir){

    if (c.kind === 'grab'){ const b = Vector.add(c.bodyB.position, Vector.rotate(c.pointB, c.bodyB.angle)); g.strokeStyle = '#7dff7a'; g.lineWidth = 2; g.setLineDash([5, 5]); g.beginPath(); g.moveTo(c.pointA.x, c.pointA.y); g.lineTo(b.x, b.y); g.stroke(); g.setLineDash([]); g.fillStyle = '#7dff7a'; g.beginPath(); g.arc(c.pointA.x, c.pointA.y, 6, 0, 7); g.fill(); }
  });
  Composite.allBodies(world).forEach(b => { if (!bounds.includes(b)) drawBody(b); });
  ragdolls.forEach(R => {
    const h = R.head.position, t = R.torso.position, fx = R.fx, now = performance.now();
    if (fx.immortal){ const gl = g.createRadialGradient(t.x, t.y - 20, 5, t.x, t.y - 20, 70); gl.addColorStop(0, 'rgba(255,215,0,.35)'); gl.addColorStop(1, 'rgba(255,215,0,0)'); g.fillStyle = gl; g.beginPath(); g.arc(t.x, t.y - 20, 70, 0, 7); g.fill();
      g.strokeStyle = '#ffd700'; g.lineWidth = 2; g.beginPath(); g.ellipse(h.x, h.y - 24, 12, 4, 0, 0, 7); g.stroke(); }
    if (fx.strong){ g.font = '14px sans-serif'; g.fillText('🦴', t.x + 14, t.y - 10); }
    const nm = R.ctrl ? R.ctrl.name : R.ctrlName;
    if (nm){ g.font = '700 13px Fredoka,sans-serif'; g.textAlign = 'center'; g.lineWidth = 4; g.strokeStyle = '#000'; const yy = h.y - 26 * (R.scale || 1) - 22; g.strokeText('🎮 ' + nm, h.x, yy); g.fillStyle = '#7dff7a'; g.fillText('🎮 ' + nm, h.x, yy); g.textAlign = 'left'; }
    if (fx.adren > 0){ g.strokeStyle = `rgba(255,230,60,${.5 + .5 * Math.sin(now / 60)})`; g.lineWidth = 2; for (let i = 0; i < 3; i++){ const a = now / 200 + i * 2.1; g.beginPath(); g.moveTo(t.x + Math.cos(a) * 26, t.y + Math.sin(a) * 30); g.lineTo(t.x + Math.cos(a) * 34, t.y + Math.sin(a) * 38); g.stroke(); } }
    if (fx.sleep > 0){ g.fillStyle = '#cfe3ff'; g.font = '700 14px Fredoka,sans-serif'; for (let i = 0; i < 3; i++){ const k = ((now / 900) + i / 3) % 1; g.globalAlpha = 1 - k; g.fillText('Z', h.x + 10 + k * 18, h.y - 18 - k * 30); } g.globalAlpha = 1; }
    if (R.head.face.scream){ g.font = '700 15px Fredoka,sans-serif'; g.textAlign = 'center'; g.lineWidth = 4; g.strokeStyle = '#000'; const wob = Math.sin(now / 40) * 2; g.strokeText('AAAAH!', h.x + wob, h.y - 30); g.fillStyle = '#fff'; g.fillText('AAAAH!', h.x + wob, h.y - 30); }
    if (fx.float > 0){ g.fillStyle = '#ff4d6d'; g.beginPath(); g.ellipse(h.x, h.y - 60, 14, 17, 0, 0, 7); g.fill(); g.strokeStyle = '#ddd'; g.lineWidth = 1; g.beginPath(); g.moveTo(h.x, h.y - 43); g.lineTo(h.x, h.y - 16); g.stroke(); }
  });
  for (let i = needles.length - 1; i >= 0; i--){ const n = needles[i]; n.life -= .016; if (n.life <= 0){ needles.splice(i, 1); continue; }
    const p = Vector.add(n.b.position, n.off); g.save(); g.translate(p.x, p.y); g.rotate(n.ang); g.globalAlpha = Math.min(1, n.life * 2);
    g.fillStyle = '#e8f4ff'; g.fillRect(4, -4, 26, 8); g.fillStyle = '#7cf3ff'; g.fillRect(6, -3, 14, 6); g.fillStyle = '#999'; g.fillRect(30, -1, 6, 2); g.fillRect(-8, -.7, 12, 1.4); g.fillStyle = '#555'; g.fillRect(36, -5, 3, 10); g.restore(); }
  g.textAlign = 'left';
  ragdolls.forEach(R => R.cut.forEach(j => {
    const p = jointAt(j), q = Vector.add(j.bodyB.position, Vector.rotate(j.pointB, j.bodyB.angle));
    g.fillStyle = R.look.inside; g.strokeStyle = R.look.juice; g.lineWidth = 1.5;
    for (const c of [p, q]){ g.beginPath(); g.ellipse(c.x, c.y, 5.5, 4, 0, 0, 7); g.fill(); g.stroke(); }
  }));
  const drawSl = sl => {
    if (!sl) return null;
    g.strokeStyle = '#ffffff'; g.lineCap = 'round'; g.lineJoin = 'round';
    g.globalAlpha = sl.life; g.lineWidth = 4; g.shadowColor = '#bff'; g.shadowBlur = 10;
    g.beginPath(); sl.pts.forEach((pt, i) => i ? g.lineTo(pt.x, pt.y) : g.moveTo(pt.x, pt.y)); g.stroke(); g.shadowBlur = 0; g.globalAlpha = 1;
    if (sl.done){ sl.life -= .12; if (sl.life <= 0) return null; }
    return sl;
  };
  slash = drawSl(slash); players.forEach(pl => { if (pl !== LOCAL) pl.slash = drawSl(pl.slash); });
  ragdolls.forEach(R => {
    if (R.hpShow <= 0 && !R.ko) return; R.hpShow -= .016;
    const h = R.head.position, w = 40;
    g.globalAlpha = R.ko ? .9 : Math.min(1, R.hpShow); g.fillStyle = '#000a'; g.fillRect(h.x - w / 2, h.y - 34, w, 6);
    g.fillStyle = R.ko ? '#888' : R.hp > 50 ? '#4ade80' : R.hp > 25 ? '#ffd23f' : '#ff4d4d'; g.fillRect(h.x - w / 2 + 1, h.y - 33, (w - 2) * R.hp / 100, 4);
    if (R.ko){ g.fillStyle = '#fff'; g.font = '700 10px Fredoka,sans-serif'; g.textAlign = 'center'; g.fillText('K.O.', h.x, h.y - 38); }
    g.globalAlpha = 1;
  });
  // shots
  for (let i = tracers.length - 1; i >= 0; i--){ const t = tracers[i]; t.life -= t.laser ? .06 : .18; if (t.life <= 0){ tracers.splice(i, 1); continue; }
    g.globalAlpha = t.life; g.strokeStyle = t.col; g.lineWidth = t.laser ? 6 * t.life + 1 : 2.5; if (t.laser){ g.shadowColor = t.col; g.shadowBlur = 16; }
    g.beginPath(); g.moveTo(t.x1, t.y1); g.lineTo(t.x2, t.y2); g.stroke(); g.shadowBlur = 0; }
  g.globalAlpha = 1;
  // the gun (only while a gun is picked)
  if (pick && pick.startsWith('g_')){
    if (!gun.y) placeGun();
    const G = GUNS[pick];
    g.save(); g.translate(gun.x, gun.y);
    g.fillStyle = '#0006'; g.beginPath(); g.ellipse(0, 26, 26, 6, 0, 0, 7); g.fill();
    g.fillStyle = '#4a5568'; g.fillRect(-8, 6, 16, 20);               // stand
    g.rotate(gun.ang); const flip = Math.cos(gun.ang) < 0; if (flip) g.scale(1, -1);
    if (G.cannon){ g.fillStyle = '#333'; g.beginPath(); g.arc(-6, 0, 16, 0, 7); g.fill(); g.fillRect(-6, -11, 44, 22); g.fillStyle = '#555'; g.fillRect(30, -13, 8, 26); }
    else if (G.laser){ g.fillStyle = '#6a3fb8'; g.fillRect(-16, -8, 50, 16); g.fillStyle = '#ff3cac'; g.fillRect(28, -5, 10, 10); g.fillStyle = '#7cf3ff'; g.fillRect(-6, -4, 22, 3); g.fillStyle = '#3a2a6a'; g.fillRect(-12, 4, 10, 16); }
    else if (pick === 'g_shotgun'){ g.fillStyle = '#7a4a2a'; g.fillRect(-26, -5, 20, 12); g.fillStyle = '#444'; g.fillRect(-8, -7, 46, 8); g.fillRect(-8, 1, 40, 6); g.fillStyle = '#7a4a2a'; g.fillRect(4, 6, 12, 5); }
    else { g.fillStyle = '#3d6bff'; g.fillRect(-10, -7, 40, 13); g.fillStyle = '#ffd23f'; g.fillRect(26, -5, 8, 9); g.fillStyle = '#2a4ab8'; g.fillRect(-8, 4, 11, 18); }
    if (gun.flash > 0){ g.fillStyle = `rgba(255,220,80,${gun.flash})`; g.beginPath(); g.arc(42, 0, 10 * gun.flash + 4, 0, 7); g.fill(); gun.flash -= .15; }
    g.restore();
  }
  // particles + boom words
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += .25; p.life -= .025;
    if (p.juice && p.y >= fy - 2){ if (Math.random() < .5){ splats.push({ x: p.x, y: fy - 1, r: 3 + Math.random() * 6, c: p.c, a: .9 }); if (splats.length > 220) splats.shift(); } parts.splice(i, 1); continue; }
    if (p.life <= 0){ parts.splice(i, 1); continue; } g.globalAlpha = p.life; g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  for (let i = words.length - 1; i >= 0; i--){ const w = words[i]; w.t -= .02; if (w.t <= 0){ words.splice(i, 1); continue; }
    g.save(); g.translate(w.x, w.y - (1 - w.t) * 60); g.rotate(-.1); g.scale(w.s * (1.4 - w.t * .4), w.s * (1.4 - w.t * .4)); g.globalAlpha = Math.min(1, w.t * 2);
    g.font = '700 34px Fredoka,sans-serif'; g.textAlign = 'center'; g.lineWidth = 6; g.strokeStyle = '#7a1010'; g.strokeText(w.w, 0, 0); g.fillStyle = '#ffd23f'; g.fillText(w.w, 0, 0); g.restore(); }
  if (flash > 0){ g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = `rgba(255,240,200,${flash})`; g.fillRect(0, 0, W, H); flash = Math.max(0, flash - .05); }
}

// ---------- loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(33, now - last); last = now;
  if (NET.mode === 'client') followSnap();
  else if (!paused){ const step = (slow ? dt / 4 : dt) / 2; Engine.update(engine, step); Engine.update(engine, step); }
  if (NET.mode === 'host') hostTick(now);
  draw(); requestAnimationFrame(loop);
}

// ================= players, playing as a guy, and online play =================
const mkPlayer = (pid, name, look) => ({ pid, name, look, grab: null, slash: null, vel: { x: 0, y: 0 }, lastPtr: { x: 0, y: 0, t: 0 }, gunHeld: false, tool: 'drag', pick: null, keys: {}, guy: null, gun: { x: 70, y: 0, ang: 0, flash: 0, last: 0 } });
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const myName = () => (document.getElementById('netName').value.trim() || LS.get('melonName') || LS.get('lastEmberName') || 'Player').slice(0, 14);
const LOCAL = mkPlayer('local', myName(), null);
const players = new Map([['local', LOCAL]]);
let CUR = LOCAL;
// run a friend's action with their own tool, pick, grab and gun
function withPl(pl, fn){
  if (pl === LOCAL) return fn();
  const sv = { grab, slash, vel, lastPtr, tool, pick, gun: Object.assign({}, gun) };
  grab = pl.grab; slash = pl.slash; vel = pl.vel; lastPtr = pl.lastPtr; tool = pl.tool; pick = pl.pick; Object.assign(gun, pl.gun, { held: pl.gunHeld }); CUR = pl;
  try { fn(); }
  finally {
    pl.grab = grab; pl.slash = slash; pl.vel = vel; pl.lastPtr = lastPtr; pl.gunHeld = gun.held; pl.gun = { x: gun.x, y: gun.y, ang: gun.ang, flash: gun.flash, last: gun.last };
    grab = sv.grab; slash = sv.slash; vel = sv.vel; lastPtr = sv.lastPtr; tool = sv.tool; pick = sv.pick; Object.assign(gun, sv.gun); CUR = LOCAL;
  }
}
function clearAll(){
  Composite.allComposites(world).forEach(c => Composite.remove(world, c, true));
  Composite.allConstraints(world).forEach(c => Composite.remove(world, c));
  Composite.allBodies(world).filter(b => !bounds.includes(b)).forEach(b => Composite.remove(world, b));
  ragdolls.clear(); parts.length = 0; splats.length = 0; ents.clear(); byNid.clear();
  players.forEach(pl => { pl.guy = null; pl.grab = null; }); grab = null; paintPad();
}

// ---------- 🎮 play as a guy ----------
function doPlay(pl){
  const R = pl.guy != null && ragdolls.get(pl.guy);
  if (R){ R.ctrl = null; pl.guy = null; paintPad(); return; }
  const look = pl === LOCAL ? avatarLook() : pl.look;
  const comp = spawn('me', FW * (.3 + Math.random() * .4), FH - 90, { look: look || avatarLook() });
  const R2 = ragdolls.get(comp.id); R2.ctrl = pl; pl.guy = comp.id; R2.hp = 100;
  paintPad();
}
function iPlay(){ // am I playing right now?
  if (NET.mode === 'client') return !!myGuyOnline;
  return LOCAL.guy != null && ragdolls.has(LOCAL.guy);
}
function paintPad(){
  const on = iPlay();
  document.getElementById('pad').hidden = !(on && (('ontouchstart' in window) || navigator.maxTouchPoints > 0));
  document.getElementById('playBtn').classList.toggle('on', on);
}
document.getElementById('playBtn').onclick = () => {
  if (NET.mode === 'client'){ sendHost({ k: 'play' }); return; }
  doPlay(LOCAL);
  if (iPlay()) hint(('ontouchstart' in window) ? 'Use ◀ ▶ to walk, ⤒ to jump and 👊 to punch!' : 'A / D or ← → to walk, W / ↑ / Space to jump, F to punch!');
};
function setKey(k, v){
  if (!!LOCAL.keys[k] === v) return;
  LOCAL.keys[k] = v; if (v && (k === 'j' || k === 'p')) LOCAL.keys[k + 't'] = true;
  if (NET.mode === 'client') sendHost({ k: 'keys', v: LOCAL.keys });
}
const KEYMAP = { a: 'l', arrowleft: 'l', d: 'r', arrowright: 'r', w: 'j', arrowup: 'j', ' ': 'j', f: 'p', j: 'p', e: 'p' };
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const k = KEYMAP[e.key.toLowerCase()]; if (k && iPlay()){ setKey(k, true); e.preventDefault(); } });
addEventListener('keyup', e => { const k = KEYMAP[e.key.toLowerCase()]; if (k) setKey(k, false); });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); setKey(k, true); b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} });
  const up = e => { setKey(k, false); b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
});

// ---------- screen -> world, and the pointer ----------
const toWorld = e => ({ x: (e.clientX - VX) / VS, y: (e.clientY - VY) / VS });
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const { x, y } = toWorld(e);
  if (NET.mode === 'client'){
    if (pick && pick.startsWith('g_') && Math.hypot(x - gun.x, y - gun.y) < 40) gun.held = true;
    lastPtr = { x, y, t: performance.now() };
    sendHost({ k: 'pd', x, y, tool, pick }); return;
  }
  pDown(x, y);
});
cv.addEventListener('pointermove', e => {
  const { x, y } = toWorld(e);
  if (NET.mode === 'client'){
    if (gun.held){ gun.x = Math.max(30, Math.min(FW - 30, x)); gun.y = Math.max(60, Math.min(FH - 20, y)); }
    if (e.buttons || e.pressure) sendHost({ k: 'pm', x, y }); return;
  }
  pMove(x, y);
});
const upH = () => { if (NET.mode === 'client'){ gun.held = false; sendHost({ k: 'pu' }); return; } release(); };
cv.addEventListener('pointerup', upH); cv.addEventListener('pointercancel', upH);

// ---------- network ids for everything in the lab ----------
let NIDc = 1;
const ents = new Map(), byNid = new Map();
function netTag(made, id, x, y, opt){
  const bodies = made.type === 'composite' ? Composite.allBodies(made) : [made];
  const n = opt.nid != null ? opt.nid : NIDc;
  if (opt.nid == null) NIDc += bodies.length; else NIDc = Math.max(NIDc, n + bodies.length);
  const rec = { n, id, x: Math.round(x), y: Math.round(y) };
  if (made.label === 'ragdoll'){ const R = ragdolls.get(made.id); if (id === 'me') rec.look = R.look; }
  if (made.color) rec.c = made.color;
  bodies.forEach((b, i) => { b.nid = n + i; byNid.set(b.nid, b); });
  made.rec = rec; ents.set(n, rec);
  if (NET.mode === 'host' && opt.nid == null) netSend({ k: 'add', r: rec });
}
function netDel(thing){
  const rec = thing && thing.rec; if (!rec) return;
  ents.delete(rec.n);
  (thing.type === 'composite' ? Composite.allBodies(thing) : [thing]).forEach(b => byNid.delete(b.nid));
  if (NET.mode === 'host') netSend({ k: 'del', n: rec.n });
}
function makeFromRec(r){
  if (byNid.has(r.n)) return;
  const m = spawn(r.id, r.x, r.y, { nid: r.n, look: r.look });
  if (m && r.c) m.color = r.c;
}

// ---------- online play ----------
const NET = { mode: 'solo', peer: null, conns: new Map(), host: null, code: '', myPid: null, ch: null, snapT: 0 };
let myGuyOnline = false, lastSnap = null, netFxBusy = false;
const PREFIX = 'melonlab-room-';
const USE_BC = /[#&]bc\b/.test(location.hash);   // test mode: two tabs on the same computer
const newCode = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };
function netSend(msg, except){ if (NET.mode !== 'host') return; NET.conns.forEach((c, id) => { if (id !== except) try { c.send(msg); } catch (e) {} }); }
function sendHost(msg){ if (NET.host) try { NET.host.send(msg); } catch (e) {} }
function netFx(t, a){ if (NET.mode === 'host' && !netFxBusy && NET.conns.size) netSend({ k: 'fx', t, a }); }
const netMsg = t => document.getElementById('netMsg').textContent = t || '';
function paintNet(){
  const on = NET.mode !== 'solo';
  document.getElementById('netIdle').hidden = on; document.getElementById('netOn').hidden = !on;
  document.getElementById('netBtn').classList.toggle('live', on);
  document.getElementById('netBtn').innerHTML = on ? '👥<span> ' + NET.code + '</span>' : '👥<span> Online</span>';
  document.getElementById('netCodeShow').textContent = NET.code;
  const names = NET.mode === 'host' ? [...players.values()].map(p => p === LOCAL ? p.name + ' (you, host)' : p.name) : (lastSnap && lastSnap.pl) || [];
  document.getElementById('netPlayers').innerHTML = (NET.mode === 'host' ? 'Give friends this code. ' : 'In the lab: ') + '<br>' + names.map(n => '🍉 ' + String(n).replace(/</g, '&lt;')).join('<br>');
}
document.getElementById('netBtn').onclick = () => { document.getElementById('netBox').hidden = false; paintNet(); };
document.getElementById('netClose').onclick = () => document.getElementById('netBox').hidden = true;
document.getElementById('netName').value = LS.get('melonName') || LS.get('lastEmberName') || '';
document.getElementById('netName').oninput = e => { LS.set('melonName', e.target.value.trim()); LOCAL.name = myName(); };
document.getElementById('leaveBtn').onclick = () => { try { NET.peer && NET.peer.destroy(); } catch (e) {} location.reload(); };

// a tiny "connection" made from a BroadcastChannel (only used for testing in two tabs)
function bcPeer(myId){
  const ch = new BroadcastChannel('melonlab-test'), handlers = {};
  ch.onmessage = e => { const m = e.data; if (m.to === myId && handlers.msg) handlers.msg(m.from, m.d); };
  return { ch, send: (to, d) => ch.postMessage({ to, from: myId, d }), on: (n, f) => handlers[n] = f };
}

function hostLab(){
  LOCAL.name = myName();
  const code = newCode();
  const ready = () => { NET.mode = 'host'; NET.code = code; NET.myPid = 'local'; netMsg('Your lab is open!'); paintNet(); hint('👥 Friends can join with code ' + code); };
  if (USE_BC){
    const bp = bcPeer('host-' + code); NET.ch = bp;
    bp.on('msg', (from, d) => {
      let c = NET.conns.get(from); if (!c){ c = { id: from, send: m => bp.send(from, m) }; NET.conns.set(from, c); }
      onHostData(c, d);
    });
    return ready();
  }
  if (!window.Peer){ netMsg('Online play is still loading. Try again in a second.'); return; }
  netMsg('Opening your lab…');
  const peer = new Peer(PREFIX + code, { debug: 0 }); NET.peer = peer;
  peer.on('open', ready);
  peer.on('error', e => netMsg('Online problem: ' + (e.type || 'unknown') + '. Try again.'));
  peer.on('connection', conn => {
    conn.on('open', () => NET.conns.set(conn.peer, conn));
    conn.on('data', d => onHostData(conn, d));
    conn.on('close', () => dropPlayer(conn.peer));
  });
}
function dropPlayer(id){
  const pl = players.get(id); NET.conns.delete(id);
  if (pl){ const R = pl.guy != null && ragdolls.get(pl.guy); if (R) R.ctrl = null; if (pl.grab) Composite.remove(world, pl.grab); players.delete(id); addWord({ x: FW / 2, y: 80, t: 1, s: .6, w: pl.name + ' left' }); }
  paintNet();
}
function onHostData(conn, d){
  const id = conn.peer || conn.id;
  let pl = players.get(id);
  if (d.k === 'hello'){
    pl = mkPlayer(id, String(d.name || 'Friend').slice(0, 14), d.look); players.set(id, pl);
    conn.send({ k: 'welcome', w: FW, h: FH, you: id, ents: [...ents.values()], gi });
    addWord({ x: FW / 2, y: 80, t: 1, s: .6, w: pl.name + ' joined!' }); snd('boing'); paintNet();
    return;
  }
  if (!pl) return;
  if (d.k === 'pd'){ pl.tool = d.tool || 'drag'; pl.pick = d.pick || null; withPl(pl, () => { lastPtr = { x: d.x, y: d.y, t: performance.now() }; pDown(d.x, d.y); }); }
  else if (d.k === 'pm') withPl(pl, () => pMove(d.x, d.y));
  else if (d.k === 'pu') withPl(pl, () => release());
  else if (d.k === 'keys') pl.keys = d.v || {};
  else if (d.k === 'play') doPlay(pl);
  else if (d.k === 'cmd'){
    if (d.c === 'clear'){ clearAll(); netSend({ k: 'clear' }); snd('del'); }
    if (d.c === 'grav') document.getElementById('gravBtn').onclick();
  }
}
// host: send everyone where everything is, ~14 times a second
function hostTick(now){
  if (!NET.conns.size || now - NET.snapT < 70) return; NET.snapT = now;
  const b = [];
  Composite.allBodies(world).forEach(o => { if (o.nid != null) b.push([o.nid, Math.round(o.position.x * 10) / 10, Math.round(o.position.y * 10) / 10, Math.round(o.angle * 100) / 100, o.isStatic ? 1 : 0]); });
  const r = [];
  ragdolls.forEach(R => {
    const fx = R.fx, f = R.head.face;
    const fb = (fx.immortal ? 1 : 0) | (fx.strong ? 2 : 0) | (fx.adren > 0 ? 4 : 0) | (fx.sleep > 0 ? 8 : 0) | (fx.float > 0 ? 16 : 0) | (fx.giant ? 32 : 0) | (fx.acid > 0 ? 64 : 0) | (fx.scream > 0 ? 128 : 0);
    const face = (f.dizzy > .3 ? 1 : 0) | (f.shock > .2 ? 2 : 0) | (f.angry ? 4 : 0);
    let cut = 0; R.joints.forEach((j, i) => { if (R.cut.has(j)) cut |= 1 << i; });
    r.push([R.head.nid - 9, Math.round(R.hp), R.ko ? 1 : 0, fb, face, cut, Math.round((R.scale || 1) * 100) / 100, R.ctrl ? R.ctrl.pid : '', R.ctrl ? R.ctrl.name : '', Math.round(R.hpShow * 10) / 10]);
  });
  const pl = [...players.values()].map(p => p.name);
  NET.conns.forEach((c, id) => { try { c.send({ k: 's', b, r, gi, pl, g: (players.get(id) || {}).gun }); } catch (e) {} });
}

function joinLab(code){
  code = code.trim().toUpperCase();
  if (code.length < 5){ netMsg('Type the 5-letter code your friend sees.'); return; }
  LOCAL.name = myName();
  const hello = () => sendHost({ k: 'hello', name: LOCAL.name, look: avatarLook() });
  if (USE_BC){
    const me = 'c-' + Math.random().toString(36).slice(2, 8), bp = bcPeer(me);
    NET.ch = bp; NET.host = { send: m => bp.send('host-' + code, m) };
    bp.on('msg', (from, d) => onClientData(d));
    NET.mode = 'client'; NET.code = code; hello(); netMsg('Joining…'); return;
  }
  if (!window.Peer){ netMsg('Online play is still loading. Try again in a second.'); return; }
  netMsg('Joining ' + code + '…');
  const peer = new Peer({ debug: 0 }); NET.peer = peer;
  const t = setTimeout(() => { netMsg("Couldn't find that lab. Check the code and that your friend is hosting."); try { peer.destroy(); } catch (e) {} NET.mode = 'solo'; paintNet(); }, 12000);
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    conn.on('open', () => { clearTimeout(t); NET.host = conn; NET.mode = 'client'; NET.code = code; hello(); });
    conn.on('data', onClientData);
    conn.on('close', () => { alertBox('The host left the lab.'); });
  });
  peer.on('error', e => { clearTimeout(t); netMsg(e.type === 'peer-unavailable' ? "Couldn't find that lab. Check the code." : 'Online problem: ' + (e.type || 'unknown')); NET.mode = 'solo'; paintNet(); });
}
function alertBox(t){ document.getElementById('netBox').hidden = false; netMsg(t + ' Tap Leave to go back to your own lab.'); }
function onClientData(d){
  if (d.k === 'welcome'){
    NET.myPid = d.you; fixedWorld = { w: d.w, h: d.h }; clearAll(); resize();
    d.ents.forEach(makeFromRec);
    netMsg('You joined the lab!'); paintNet(); document.getElementById('netBox').hidden = true;
    hint('👥 You joined! Tap 🎮 Play to be a guy.');
    return;
  }
  if (d.k === 'add') return makeFromRec(d.r);
  if (d.k === 'del'){ const b = byNid.get(d.n); if (b){ const thing = b.rag || b; NET.mode = 'solo'; removeThing(b); NET.mode = 'client'; } return; }
  if (d.k === 'clear'){ clearAll(); return; }
  if (d.k === 'fx'){
    netFxBusy = true;
    try {
      const a = d.a;
      if (d.t === 'sq') squirt(...a); else if (d.t === 'bu') burst(...a); else if (d.t === 'wd') words.push(a[0]);
      else if (d.t === 'sn') snd(a[0]); else if (d.t === 'tr') tracers.push(a[0]); else if (d.t === 'sh'){ shake = a[0]; flash = a[1]; }
    } finally { netFxBusy = false; }
    return;
  }
  if (d.k === 's'){ lastSnap = d; applySnap(d); }
}
function applySnap(d){
  d.b.forEach(([n, x, y, a, st]) => { const b = byNid.get(n); if (!b) return; b.tx = x; b.ty = y; b.ta = a; b.pinned = !!st && !['spring', 'fan', 'block', 'ramp', 'floor', 'wall'].includes(b.kind); if (b.tx0 == null){ b.tx0 = 1; Body.setPosition(b, { x, y }); Body.setAngle(b, a); } });
  let mine = false;
  d.r.forEach(([n, hp, ko, fb, face, cut, scale, cpid, cname, hpShow]) => {
    const tb = byNid.get(n); if (!tb || !tb.rag) return;
    const R = ragdolls.get(tb.rag.id); if (!R) return;
    R.hp = hp; R.ko = !!ko; R.head.face.ko = !!ko; R.hpShow = hpShow;
    R.fx = { immortal: !!(fb & 1), strong: !!(fb & 2), adren: fb & 4 ? 1 : 0, sleep: fb & 8 ? 1 : 0, float: fb & 16 ? 1 : 0, giant: !!(fb & 32), acid: fb & 64 ? 1 : 0, scream: fb & 128 ? 1 : 0 };
    R.head.face.dizzy = face & 1 ? 2 : 0; if (face & 2) R.head.face.shock = 1; R.head.face.angry = !!(face & 4);
    R.head.face.sleep = !!(fb & 8); R.head.face.scream = !!(fb & 128) && !ko;
    R.joints.forEach((j, i) => { const c = !!(cut & (1 << i)); if (c && !R.cut.has(j)){ Composite.remove(R.comp, j); R.cut.add(j); } else if (!c && R.cut.has(j)){ Composite.add(R.comp, j); R.cut.delete(j); } });
    if (Math.abs((R.scale || 1) - scale) > .01) resizeRag(R, scale / (R.scale || 1));
    R.ctrlName = cname || null; if (cpid && cpid === NET.myPid) mine = true;
  });
  if (mine !== myGuyOnline){ myGuyOnline = mine; paintPad(); }
  if (d.gi !== gi){ gi = d.gi; engine.gravity.y = GRAV[gi][1]; document.getElementById('gravBtn').innerHTML = GRAV[gi][0].replace(' ', '<span> ') + '</span>'; }
  if (d.g){ gun.ang = d.g.ang; if (!gun.held){ gun.x = d.g.x; gun.y = d.g.y || gun.y; } if (d.g.flash > gun.flash) gun.flash = d.g.flash; }
  if (!document.getElementById('netBox').hidden) paintNet();
}
// clients: glide everything toward where the host says it is
function followSnap(){
  byNid.forEach(b => {
    if (b.tx == null) return;
    const k = .45;
    Body.setPosition(b, { x: b.position.x + (b.tx - b.position.x) * k, y: b.position.y + (b.ty - b.position.y) * k });
    Body.setAngle(b, b.angle + Math.atan2(Math.sin(b.ta - b.angle), Math.cos(b.ta - b.angle)) * k);
  });
}
document.getElementById('hostBtn').onclick = hostLab;
document.getElementById('joinBtn').onclick = () => joinLab(document.getElementById('netCode').value);
document.getElementById('netCode').addEventListener('keydown', e => { if (e.key === 'Enter') joinLab(e.target.value); });

window.__lab = { world, Composite, NET, players, ragdolls };
paintDock(); resize();
// a starting scene so there's something to play with
setTimeout(() => {
  if (NET.mode === 'client') return;
  const fy = FH;
  spawn('melon', FW * .3, fy - 70); spawn('me', FW * .5, fy - 70); spawn('box', FW * .7, fy - 30); spawn('box', FW * .7, fy - 80); spawn('spring', FW * .85, fy - 10);
  stats.spawned = Math.max(0, stats.spawned - 5);
  hint('Grab a melon and throw it! Pick more things from the bottom bar.');
}, 50);
requestAnimationFrame(loop);
})();
</script>
