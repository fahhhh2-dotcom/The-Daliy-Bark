<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#3a7a3a;color:#fff;font-family:Fredoka,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #cv,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .scr{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;
    background:linear-gradient(180deg,#4fa8ff 0%,#8fd0ff 55%,#7ccf6a 55%,#3f9a3f 100%)}
  .scr[hidden]{display:none}
  h1{margin:0;font-family:'Luckiest Guy',Fredoka,sans-serif;font-weight:400;font-size:clamp(40px,9vw,76px);color:#ffd23f;text-shadow:0 5px 0 #b06a00,0 10px 20px #0005;line-height:.95;letter-spacing:1px}
  .sub{max-width:460px;line-height:1.4;margin:0;color:#0b2a4a;font-weight:600}
  .card{background:#ffffffd9;color:#123;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:min(360px,90vw);box-shadow:0 10px 30px #0003}
  input.t{height:46px;border-radius:14px;border:3px solid #2a6ad0;background:#fff;color:#123;font:600 18px Fredoka;text-align:center;width:min(280px,78vw)}
  .b{border:0;border-radius:14px;height:52px;padding:0 26px;font:700 19px Fredoka;cursor:pointer;background:#ffd23f;color:#5a3000;min-width:240px;box-shadow:0 5px 0 #b08a00}
  .b:active{transform:translateY(3px);box-shadow:0 2px 0 #b08a00}
  .b.blue{background:#3d8bff;color:#fff;box-shadow:0 5px 0 #1f4fa8}.b.purple{background:#9b5cff;color:#fff;box-shadow:0 5px 0 #5a2aa8}.b.gray{background:#e2e6ee;color:#123;box-shadow:0 5px 0 #a0a8b8}
  .b:disabled{opacity:.5}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .msg{min-height:20px;font-size:14px;color:#0b4a8a;font-weight:600}
  .code{font:700 40px Fredoka;letter-spacing:10px;background:#123;color:#ffd23f;border-radius:14px;padding:2px 16px}
  .party{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .party div{background:#eef3ff;border-radius:14px;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:6px}
  .party i{width:18px;height:18px;border-radius:50%;display:inline-block}
  .home{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;color:#fff;text-decoration:none;background:#0004;border-radius:20px;padding:8px 14px;font-weight:600}
  /* HUD */
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none}

  .tl{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;display:flex;gap:6px;align-items:center;pointer-events:auto}
  .pill{background:#000a;border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
  #mini{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:8px;width:140px;height:140px;border-radius:12px;border:3px solid #fff8;background:#0006}
  #feed{position:absolute;top:calc(env(safe-area-inset-top) + 156px);right:8px;font-size:12px;text-align:right;line-height:1.5;max-width:240px}
  #feed div{background:#0008;border-radius:8px;padding:1px 8px;margin-bottom:2px;display:inline-block}
  #stormMsg{position:absolute;top:calc(env(safe-area-inset-top) + 50px);left:50%;transform:translateX(-50%);background:#6a2aa8cc;border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}

  .bar{height:12px;border-radius:6px;background:#0008;margin-top:4px;overflow:hidden;position:relative}
  .bar i{position:absolute;inset:0;width:0}
  .bar b{position:absolute;inset:0;font-size:10px;text-align:center;line-height:12px}
  .slots{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
  .slot{width:64px;height:64px;border-radius:12px;border:3px solid #fff5;background:#000a;color:#fff;font:700 11px Fredoka;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .slot span{font-size:24px}
  .slot.on{border-color:#fff;transform:translateY(-4px)}

  .joy{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 90px);width:130px;height:130px;border-radius:50%;background:#ffffff1a;border:2px solid #ffffff44;pointer-events:auto;touch-action:none}
  .joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#ffffff66}
  #joyL{left:18px}#joyR{right:80px}
  .ab.fire{position:absolute;right:100px;bottom:calc(env(safe-area-inset-bottom) + 240px);width:78px;height:78px;background:#e8412ccc;pointer-events:auto}
  #gl{z-index:0}#cv{z-index:1}
  @media (max-height:520px){
    .acts{bottom:calc(env(safe-area-inset-bottom) + 10px);right:8px;flex-direction:row;flex-wrap:wrap-reverse;width:112px;gap:6px}
    .ab{width:52px;height:52px}.ab span{font-size:18px}
    .joy{bottom:calc(env(safe-area-inset-bottom) + 14px);width:120px;height:120px}.joy i{left:35px;top:35px}
    #joyR{right:136px}
    .ab.fire{right:148px;bottom:calc(env(safe-area-inset-bottom) + 146px);width:70px;height:70px}
    .bars{bottom:calc(env(safe-area-inset-bottom) + 82px)}
    #pickTip{bottom:calc(env(safe-area-inset-bottom) + 118px)}
    #mini{width:104px;height:104px}#feed{top:calc(env(safe-area-inset-top) + 118px)}
  }
  #jumpBtn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 120px);transform:translateX(-50%);pointer-events:auto}
  #pickTip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:#000b;border-radius:12px;padding:6px 12px;font-weight:700;font-size:14px;pointer-events:auto}
  #res{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000a;text-align:center;padding:20px}
  #res[hidden]{display:none}
  #res h2{font-family:'Luckiest Guy',Fredoka;font-weight:400;font-size:clamp(40px,10vw,80px);margin:0;color:#ffd23f;text-shadow:0 5px 0 #b06a00}
  #res p{margin:0;font-size:18px}
</style>

<body>
<canvas id="cv"></canvas>

<div class="scr" id="menu">
  <a class="home" href="../">‹ Arcade</a>
  <h1>SKY DROP<br>ROYALE</h1>
  <p class="sub">Jump out of the Party Bus, loot up, build walls and be the last one standing out of 100 players!</p>
  <div class="card">
    <input class="t" id="nameIn" maxlength="12" placeholder="Your name">

    <div class="row"><input class="t" id="codeIn" maxlength="5" placeholder="PARTY CODE" style="width:160px;text-transform:uppercase;letter-spacing:3px;font-size:16px"><button class="b purple" id="joinBtn" style="min-width:0">Join</button></div>

</div>

<div class="scr" id="lobby" hidden>
  <h1 style="font-size:44px">YOUR PARTY</h1>
  <div class="card">
    <div id="lobbyTip" style="font-weight:700">Friends join with this code:</div>

    <div class="party" id="partyList"></div>

</div>

<div id="hud" hidden>
  <div class="tl"><a class="pill" href="../" style="color:#fff;text-decoration:none">‹ 🏠</a><span class="pill" id="aliveP">👥 100</span><span class="pill" id="killsP">💥 0</span><span class="pill" id="woodP">🪵 0</span></div>
  <canvas id="mini" width="280" height="280"></canvas>
  <div id="feed"></div>
  <div id="stormMsg"></div>
  <button class="b" id="jumpBtn" hidden>🪂 JUMP!</button>
  <div id="pickTip" hidden></div>
  <div class="bars"><div class="bar"><i id="shBar" style="background:#3d9bff"></i><b id="shTxt"></b></div><div class="bar"><i id="hpBar" style="background:#4ade80"></i><b id="hpTxt"></b></div></div>
  <div class="slots" id="slots"></div>
  <div class="acts">
    <button class="ab" id="pickBtn"><span>✋</span>GRAB</button>
    <button class="ab" id="buildBtn"><span>🧱</span>BUILD</button>
    <button class="ab" id="healBtn"><span>❤️</span><b id="healN">0</b></button>
    <button class="ab" id="shieldBtn"><span>🛡️</span><b id="shieldN">0</b></button>
    <button class="ab" id="reloadBtn"><span>🔄</span>RELOAD</button>

  <div class="joy" id="joyL"><i></i></div>

</div>
<div id="res" hidden><h2 id="resT"></h2><p id="resP"></p><div class="row"><button class="b" id="againBtn">🪂 Play again</button><button class="b gray" id="specBtn">👀 Spectate</button></div></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){ DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener('resize', resize); resize();
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function seeded(s){ return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------- weapons & items ----------------
const RAR = [{ n: 'Common', c: '#b8bcc6' }, { n: 'Uncommon', c: '#4ade80' }, { n: 'Rare', c: '#3d9bff' }, { n: 'Epic', c: '#b05cff' }, { n: 'Legendary', c: '#ffb020' }];
const GUNS = {
  pickaxe: { n: 'Pickaxe', e: '⛏️', melee: true, dmg: 20, rate: .45, range: 52, r: 0 },
  pistol:  { n: 'Pistol', e: '🔫', dmg: 23, rate: .28, spread: .06, spd: 1500, range: 750, mag: 12, rl: 1.2, r: 0 },
  smg:     { n: 'SMG', e: '🔫', dmg: 15, rate: .09, spread: .13, spd: 1500, range: 650, mag: 30, rl: 1.8, r: 1 },
  shotgun: { n: 'Shotgun', e: '💥', dmg: 11, pel: 8, rate: .85, spread: .32, spd: 1300, range: 380, mag: 5, rl: 2.2, r: 2 },
  rifle:   { n: 'Assault Rifle', e: '🔫', dmg: 30, rate: .17, spread: .05, spd: 1900, range: 950, mag: 25, rl: 2, r: 3 },
  sniper:  { n: 'Sniper', e: '🎯', dmg: 95, rate: 1.4, spread: .008, spd: 2900, range: 1700, mag: 1, rl: 2.4, r: 4 }
};
const ITEMS = { bandage: { n: 'Bandage', e: '🩹', heal: 20, max: 75 }, medkit: { n: 'Med Kit', e: '❤️', heal: 100, max: 100 }, mini: { n: 'Mini Shield', e: '🧪', sh: 25, max: 50 }, big: { n: 'Big Shield', e: '🛡️', sh: 50, max: 100 } };
const LOOT_TABLE = [['pistol', 26], ['smg', 18], ['shotgun', 15], ['rifle', 11], ['sniper', 4], ['bandage', 12], ['medkit', 4], ['mini', 7], ['big', 3]];
function rollLoot(R, chest){
  const tbl = chest ? LOOT_TABLE.filter(([k]) => k !== 'pistol') : LOOT_TABLE;
  let tot = tbl.reduce((s, [, w]) => s + w, 0), x = R() * tot;
  for (const [k, w] of tbl){ x -= w; if (x <= 0) return k; }
  return 'pistol';
}
const gunRar = k => GUNS[k] ? GUNS[k].r : 0;

// ---------------- the island ----------------
const SIZE = 4200;
let MAP = null;
const PLACES = [
  { n: 'Pine Park', x: 900, y: 900 }, { n: 'Rusty Docks', x: 3300, y: 900 }, { n: 'Crater Town', x: 2100, y: 2100 },
  { n: 'Sunny Shores', x: 800, y: 3300 }, { n: 'Mushroom Meadow', x: 3200, y: 3200 }, { n: 'Windmill Farm', x: 2100, y: 600 },
  { n: 'Frosty Flats', x: 600, y: 2000 }, { n: 'Neon Mall', x: 3500, y: 2100 }, { n: 'Hilltop Houses', x: 2100, y: 3500 }
];
function makeMap(seed){
  const R = seeded(seed);
  const M = { seed, trees: [], rocks: [], walls: [], houses: [], loot: [], lakes: [], snow: { x: 600, y: 2000, r: 520 } };
  M.lakes.push({ x: 1450, y: 1450, r: 300 }, { x: 2900, y: 2700, r: 240 });
  let lootId = 0;
  const addLoot = (x, y, chest) => { if (chest) M.loot.push({ id: lootId++, x, y, k: 'chest', open: false }); else M.loot.push({ id: lootId++, x, y, k: rollLoot(R, false), n: 1 }); };
  // houses in each named place
  PLACES.forEach(pl => {
    const nh = 4 + Math.floor(R() * 4);
    for (let i = 0; i < nh; i++){
      const a = i / nh * Math.PI * 2 + R(), d = 120 + R() * 230;
      const w = 170 + R() * 90, h = 130 + R() * 70, x = pl.x + Math.cos(a) * d - w / 2, y = pl.y + Math.sin(a) * d - h / 2;
      if (M.houses.some(o => x < o.x + o.w + 40 && o.x < x + w + 40 && y < o.y + o.h + 40 && o.y < y + h + 40)) continue;
      const roof = ['#c0563a', '#3d6bff', '#4a9a4a', '#9b5cff', '#d0a040'][Math.floor(R() * 5)];
      const hs = { x, y, w, h, roof }; M.houses.push(hs);
      const T = 12, door = 56, side = Math.floor(R() * 4);
      const wall = (x, y, w, h) => M.walls.push({ x, y, w, h, house: true });
      // four walls with a door gap on one side
      [[x, y, w, T, 0], [x, y + h - T, w, T, 2], [x, y, T, h, 3], [x + w - T, y, T, h, 1]].forEach(([wx, wy, ww, wh, s]) => {
        if (s !== side){ wall(wx, wy, ww, wh); return; }
        if (s === 0 || s === 2){ const m = wx + ww / 2; wall(wx, wy, m - door / 2 - wx, wh); wall(m + door / 2, wy, wx + ww - m - door / 2, wh); }
        else { const m = wy + wh / 2; wall(wx, wy, ww, m - door / 2 - wy); wall(wx, m + door / 2, ww, wy + wh - m - door / 2); }
      });
      addLoot(x + w * .3, y + h * .5, false); addLoot(x + w * .7, y + h * .5, R() < .5);
    }
  });
  const free = (x, y, r) => !M.houses.some(o => x > o.x - r - 30 && x < o.x + o.w + r + 30 && y > o.y - r - 30 && y < o.y + o.h + r + 30) && !M.lakes.some(l => Math.hypot(l.x - x, l.y - y) < l.r + r);
  for (let i = 0; i < 520; i++){ const x = 80 + R() * (SIZE - 160), y = 80 + R() * (SIZE - 160), r = 22 + R() * 14; if (free(x, y, r)) M.trees.push({ x, y, r, snow: Math.hypot(x - M.snow.x, y - M.snow.y) < M.snow.r }); }
  for (let i = 0; i < 150; i++){ const x = 80 + R() * (SIZE - 160), y = 80 + R() * (SIZE - 160), r = 24 + R() * 18; if (free(x, y, r)) M.rocks.push({ x, y, r }); }
  for (let i = 0; i < 160; i++){ const x = 100 + R() * (SIZE - 200), y = 100 + R() * (SIZE - 200); if (free(x, y, 20)) addLoot(x, y, R() < .12); }
  // obstacle grid for fast collision checks
  M.grid = new Map();
  const put = (o, x0, y0, x1, y1) => { for (let gx = Math.floor(x0 / 200); gx <= Math.floor(x1 / 200); gx++) for (let gy = Math.floor(y0 / 200); gy <= Math.floor(y1 / 200); gy++){ const k = gx + ',' + gy; if (!M.grid.has(k)) M.grid.set(k, []); M.grid.get(k).push(o); } };
  M.trees.forEach(t => { t.t = 'c'; t.tree = true; put(t, t.x - t.r, t.y - t.r, t.x + t.r, t.y + t.r); });
  M.rocks.forEach(t => { t.t = 'c'; t.rock = true; put(t, t.x - t.r, t.y - t.r, t.x + t.r, t.y + t.r); });
  M.walls.forEach(w => { w.t = 'r'; put(w, w.x, w.y, w.x + w.w, w.y + w.h); });
  M.put = put;
  return M;
}
function nearObs(x, y){ const out = new Set(); const gx = Math.floor(x / 200), gy = Math.floor(y / 200); for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++){ const c = MAP.grid.get((gx + i) + ',' + (gy + j)); if (c) c.forEach(o => out.add(o)); } return out; }
function hitObs(o, x, y, r){
  if (o.dead) return false;
  if (o.t === 'c') return Math.hypot(o.x - x, o.y - y) < o.r + r;
  const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h); return Math.hypot(cx - x, cy - y) < r;
}
function pushOut(p, r){
  for (const o of nearObs(p.x, p.y)){
    if (o.dead) continue;
    if (o.t === 'c'){ const d = Math.hypot(p.x - o.x, p.y - o.y); if (d < o.r + r && d > 0){ const k = (o.r + r - d) / d; p.x += (p.x - o.x) * k; p.y += (p.y - o.y) * k; } }
    else { const cx = clamp(p.x, o.x, o.x + o.w), cy = clamp(p.y, o.y, o.y + o.h), dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy);
      if (d < r){ if (d > 0){ p.x += dx / d * (r - d); p.y += dy / d * (r - d); } else { p.y = o.y - r; } } }
  }
  p.x = clamp(p.x, r, SIZE - r); p.y = clamp(p.y, r, SIZE - r);
}
const inWater = (x, y) => MAP.lakes.some(l => Math.hypot(l.x - x, l.y - y) < l.r);

// ---------------- match state (the host owns it) ----------------
let M = null;      // match
let me = 'local';
const NET = { mode: 'solo', peer: null, conns: new Map(), host: null, code: '' };
const party = new Map();   // id -> { name, color, hat, hatC }
const inputs = {};
const STATS = Object.assign({ games: 0, wins: 0, kills: 0, best: 100 }, (() => { try { return JSON.parse(LS.get('skyDropStats')) || {}; } catch (e) { return {}; } })());
const saveStats = () => LS.set('skyDropStats', JSON.stringify(STATS));
const BOT_NAMES = ['PixelNinja', 'SkyHawk', 'CoolBean', 'TurboTaco', 'MegaMango', 'DinoDash', 'ZapZap', 'LlamaLord', 'NoobMaster', 'FrostByte', 'BlazeKid', 'Shadow', 'Moonpie', 'RocketRex', 'Sniper Sam', 'Banana Bob', 'Captain K', 'Wobbles', 'Glitch', 'Sprinkles', 'Nugget', 'Bubbles', 'Ace', 'Tank'];
const COLORS = ['#e8412c', '#3d6bff', '#3fc679', '#ffd23f', '#ff7ab6', '#ff8a3d', '#9b5cff', '#1fc8db', '#f2f3f5', '#8a5a32', '#7cff4f', '#2a2a30'];
const myLook = () => { try { const c = ArcadeAvatar.colors(); return { color: c.shirt, hat: c.hat, hatC: c.hatC, skin: c.skin }; } catch (e) { return { color: '#3d6bff', hat: 'none', hatC: '#e8412c', skin: '#f1c27d' }; } };
$('nameIn').value = LS.get('royaleName') || LS.get('susName') || LS.get('melonName') || '';
const myName = () => { const n = ($('nameIn').value.trim() || 'Player').slice(0, 12); LS.set('royaleName', n); return n; };

function newMatch(){
  const seed = Math.floor(Math.random() * 1e9);
  MAP = makeMap(seed);
  const players = [];
  party.forEach((v, id) => players.push(mkP(id, v.name, v.color, v.hat, v.hatC, v.skin, false, 'party')));

  R.loot.forEach((o, id) => { if (!lseen.has(id)){ R.scene.remove(o.m); if (o.m.isSprite) o.m.material.dispose(); R.loot.delete(id); } });
  // ---- built walls
  const bseen = new Set();
  V.built.forEach(([id, x, y, w, h, hp]) => {
    bseen.add(id); let o = R.built.get(id);
    if (!o){ const mm = new T3.Mesh(R.G.box, new T3.MeshLambertMaterial({ color: '#c8925a', transparent: true, opacity: .92 })); mm.scale.set(w, 100, h); mm.position.set(x + w / 2, 50, y + h / 2); R.scene.add(mm); o = { m: mm }; R.built.set(id, o); }
    o.m.material.color.set(hp < 60 ? '#a8703a' : '#c8925a');
  });
  R.built.forEach((o, id) => { if (!bseen.has(id)){ R.scene.remove(o.m); o.m.material.dispose(); R.built.delete(id); } });
  // ---- roofs vanish when you're inside
  const fx = meP ? meP[6] : -1, fy = meP ? meP[7] : -1;
  R.roofs.forEach(r => { r.m.visible = !(fx > r.h.x && fx < r.h.x + r.h.w && fy > r.h.y && fy < r.h.y + r.h.h && meP[10] === 2); });
  // ---- bullets
  let n = 0;
  V.b.forEach(([x, y, vx, vy]) => { if (n >= 600) return; const s = Math.hypot(vx, vy) || 1, i = n * 6; R.bPos[i] = x; R.bPos[i + 1] = 38; R.bPos[i + 2] = y; R.bPos[i + 3] = x - vx / s * 40; R.bPos[i + 4] = 38; R.bPos[i + 5] = y - vy / s * 40; n++; });
  R.bullets.geometry.setDrawRange(0, n * 2); R.bullets.geometry.attributes.position.needsUpdate = true;
  // ---- bus
  R.bus.visible = V.bus.t < 1;
  R.bus.position.set(V.bus.x, 1500 + Math.sin(t) * 10, V.bus.y); R.bus.rotation.y = -V.bus.a;
  // ---- storm
  const S = V.storm;
  R.storm.scale.set(Math.max(1, S.r), 5000, Math.max(1, S.r)); R.storm.position.set(S.x, 2400, S.y);
  R.ring.scale.set(Math.max(1, S.nr), 1, Math.max(1, S.nr)); R.ring.position.set(S.nx, 4, S.ny);
  // ---- camera
  let focus = null, yaw = R.yaw;
  if (m.state === 'bus'){ focus = { x: V.bus.x, y: V.bus.y, h: 1500 }; yaw = ctl.aim; }
  else if (m.alive && meP){ focus = { x: R.players.get(me) ? R.players.get(me).x : meP[6], y: R.players.get(me) ? R.players.get(me).y : meP[7], h: meP[10] === 1 ? meP[9] * 1400 : 0 }; yaw = ctl.aim; }
  else { const s = V.ps.find(p => p[0] === m.spec) || V.ps.find(p => p[11] && p[10] === 2); if (s){ const o = R.players.get(s[0]); focus = { x: o ? o.x : s[6], y: o ? o.y : s[7], h: s[10] === 1 ? s[9] * 1400 : 0 }; let d = s[8] - R.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); yaw = R.yaw + d * Math.min(1, dt * 4); } }
  R.yaw = yaw;
  if (focus){
    const st = m.state === 'bus' ? 'bus' : (meP && meP[10] === 1 && m.alive) ? 'fall' : 'ground';
    const D = st === 'bus' ? 820 : st === 'fall' ? 300 : 205, Hh = st === 'bus' ? 380 : st === 'fall' ? 170 : 92, side = st === 'ground' ? 34 : 0;
    const cx = Math.cos(yaw), cy = Math.sin(yaw);
    let kk = 1;
    if (st === 'ground'){ // don't let the camera go inside walls
      for (let k = .15; k <= 1.001; k += .05){
        const px = focus.x + (-cx * D - cy * side) * k, py = focus.y + (-cy * D + cx * side) * k;
        let hit = false; for (const o of nearObs(px, py)) if (o.t === 'r' && hitObs(o, px, py, 8)){ hit = true; break; }
        if (!hit) for (const w of V.built) if (px > w[1] - 8 && px < w[1] + w[3] + 8 && py > w[2] - 8 && py < w[2] + w[4] + 8){ hit = true; break; }
        if (hit){ kk = Math.max(.15, k - .07); break; }
      }
    }
    const want = new T3.Vector3(focus.x + (-cx * D - cy * side) * kk, focus.h + 30 + (Hh - 30) * kk, focus.y + (-cy * D + cx * side) * kk);
    if (!R.camInit){ R.cam.position.copy(want); R.camInit = true; } else R.cam.position.lerp(want, Math.min(1, dt * (st === 'ground' ? 20 : 6)));
    const look = st === 'ground' ? new T3.Vector3(focus.x + cx * 700 - cy * side, focus.h + 40 + (R.pitch || 0) * 400, focus.y + cy * 700 + cx * side) : new T3.Vector3(focus.x, focus.h + (st === 'bus' ? 0 : 40), focus.y);
    R.cam.lookAt(look);
    const far = st === 'ground' ? 3400 : 7000; R.scene.fog.far += (far - R.scene.fog.far) * Math.min(1, dt * 2); R.scene.fog.near = R.scene.fog.far * .3;
  }
  R.ren.render(R.scene, R.cam);
  // ---- 2D overlay: names, health bars, effects, crosshair
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  const P3 = new T3.Vector3();
  const proj = (x, h, y) => { P3.set(x, h, y).project(R.cam); if (P3.z > 1 || P3.z < -1) return null; return [(P3.x + 1) / 2 * W, (1 - P3.y) / 2 * H, P3.z]; };
  V.ps.forEach(p => {
    const [id, name, , , , , , , , alt, st, alive, , hp, sh, team, , healing] = p;
    if (!alive || st === 0 || id === me) return;
    const o = R.players.get(id); if (!o) return;
    const d = Math.hypot(o.x - R.cam.position.x, o.y - R.cam.position.z);
    const mate = team === 'party' && V.me && V.ps.find(q => q[0] === me) && V.ps.find(q => q[0] === me)[15] === 'party';
    if (d > (mate ? 9000 : 700)) return;
    const s = proj(o.x, (st === 1 ? alt * 1400 : 0) + 84, o.y); if (!s) return;
    g.font = '600 13px Fredoka,sans-serif'; g.textAlign = 'center'; g.lineWidth = 3; g.strokeStyle = '#000a'; g.strokeText(name, s[0], s[1]); g.fillStyle = mate ? '#7cf3ff' : '#fff'; g.fillText(name, s[0], s[1]);
    if (st === 2 && d < 700){ g.fillStyle = '#000a'; g.fillRect(s[0] - 20, s[1] + 4, 40, 5); g.fillStyle = '#4ade80'; g.fillRect(s[0] - 20, s[1] + 4, 40 * hp / 100, 5); if (sh){ g.fillStyle = '#3d9bff'; g.fillRect(s[0] - 20, s[1] + 9, 40 * sh / 100, 3); } }
    if (healing){ g.fillText('➕', s[0], s[1] - 16); }
  });
  for (let i = VFX.length - 1; i >= 0; i--){
    const f = VFX[i]; f.t += dt; if (f.t > .8){ VFX.splice(i, 1); continue; }
    const s = proj(f.x, f.type === 'chest' ? 25 : 40, f.y); if (!s) continue;
    const k = Math.max(.25, Math.min(2, 160 / Math.max(40, Math.hypot(f.x - R.cam.position.x, f.y - R.cam.position.z))));
    g.globalAlpha = 1 - f.t / .8;
    if (f.type === 'elim'){ g.strokeStyle = '#ffd23f'; g.lineWidth = 4; g.beginPath(); g.arc(s[0], s[1], (10 + f.t * 80) * k, 0, 7); g.stroke(); g.font = `700 ${Math.round(26 * k)}px Fredoka`; g.textAlign = 'center'; g.fillText('💥', s[0], s[1] - f.t * 50); }
    if (f.type === 'chop' || f.type === 'build'){ g.fillStyle = '#c8925a'; for (let q = 0; q < 7; q++) g.fillRect(s[0] + Math.cos(q) * f.t * 70 * k, s[1] + Math.sin(q) * f.t * 70 * k - f.t * 30 * k, 6 * k, 6 * k); }
    if (f.type === 'chest'){ g.fillStyle = '#ffd23f'; for (let q = 0; q < 12; q++){ g.beginPath(); g.arc(s[0] + Math.cos(q * .52) * f.t * 90 * k, s[1] + Math.sin(q * .52) * f.t * 90 * k, 5 * k, 0, 7); g.fill(); } }
    g.globalAlpha = 1;
  }
  if (meP && m.alive && meP[10] === 2){
    if (Math.hypot(meP[6] - S.x, meP[7] - S.y) > S.r){ g.fillStyle = 'rgba(120,40,200,.28)'; g.fillRect(0, 0, W, H); }
    // crosshair sits where your bullets go
    const o = R.players.get(me), cx = Math.cos(ctl.aim), cy = Math.sin(ctl.aim);
    const s = o && proj(o.x + cx * 500, 38, o.y + cy * 500);
    if (s){ g.strokeStyle = '#fff'; g.lineWidth = 2; g.shadowColor = '#000'; g.shadowBlur = 3; const r = 9; g.beginPath(); g.moveTo(s[0] - r - 6, s[1]); g.lineTo(s[0] - r + 2, s[1]); g.moveTo(s[0] + r - 2, s[1]); g.lineTo(s[0] + r + 6, s[1]); g.moveTo(s[0], s[1] - r - 6); g.lineTo(s[0], s[1] - r + 2); g.moveTo(s[0], s[1] + r - 2); g.lineTo(s[0], s[1] + r + 6); g.stroke(); g.shadowBlur = 0; }
  }
  if (!isTouch && !document.pointerLockElement && m.alive && m.state !== 'bus' && !$('hud').hidden && $('res').hidden){ g.fillStyle = '#000a'; g.font = '700 15px Fredoka'; g.textAlign = 'center'; g.fillText('🖱️ Click to aim with your mouse', W / 2, H / 2 + 60); }
}

function draw(t, dt){
  if (R3) return draw3(t, dt || .016);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!V || !MAP){ g.fillStyle = '#3f8f3f'; g.fillRect(0, 0, W, H); return; }
  const m = V.me || {}, meP = V.ps.find(p => p[0] === me);
  let fx = meP ? meP[6] : V.bus.x, fy = meP ? meP[7] : V.bus.y;
  if (m.state === 'bus'){ fx = V.bus.x; fy = V.bus.y; }
  if (!m.alive && V.ps.length){ const s = V.ps.find(p => p[0] === m.spec) || V.ps.find(p => p[11]); if (s){ fx = s[6]; fy = s[7]; } }
  camX += (fx - camX) * .2; camY += (fy - camY) * .2;
  const baseZ = Math.min(W, H) / 720, wantZ = m.state === 'bus' ? baseZ * .45 : m.state === 'fall' ? baseZ * .65 : baseZ * (isTouch ? .9 : 1);
  Z += (wantZ - Z) * .05;
  g.setTransform(DPR * Z, 0, 0, DPR * Z, DPR * (W / 2 - camX * Z), DPR * (H / 2 - camY * Z));
  const vx0 = camX - W / 2 / Z - 60, vx1 = camX + W / 2 / Z + 60, vy0 = camY - H / 2 / Z - 60, vy1 = camY + H / 2 / Z + 60;
  const vis = (x, y, r) => x + r > vx0 && x - r < vx1 && y + r > vy0 && y - r < vy1;
  // ocean + grass
  g.fillStyle = '#2a7ac0'; g.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
  g.fillStyle = '#e8d8a0'; g.fillRect(-40, -40, SIZE + 80, SIZE + 80);
  g.fillStyle = '#5aa84a'; g.fillRect(0, 0, SIZE, SIZE);
  g.fillStyle = '#4f9a42'; for (let x = Math.floor(vx0 / 120) * 120; x < vx1; x += 120) for (let y = Math.floor(vy0 / 120) * 120; y < vy1; y += 120) if ((x / 120 + y / 120) % 2 === 0 && x >= 0 && y >= 0 && x < SIZE && y < SIZE) g.fillRect(x, y, 120, 120);
  g.fillStyle = '#eef6ff'; g.beginPath(); g.arc(MAP.snow.x, MAP.snow.y, MAP.snow.r, 0, 7); g.fill();
  MAP.lakes.forEach(l => { if (!vis(l.x, l.y, l.r + 30)) return; g.fillStyle = '#e8d8a0'; g.beginPath(); g.arc(l.x, l.y, l.r + 22, 0, 7); g.fill(); g.fillStyle = '#3a8ad0'; g.beginPath(); g.arc(l.x, l.y, l.r, 0, 7); g.fill(); });
  // place names
  g.font = '700 46px Fredoka,sans-serif'; g.textAlign = 'center'; g.fillStyle = '#ffffff30'; PLACES.forEach(p => { if (vis(p.x, p.y, 300)) g.fillText(p.n.toUpperCase(), p.x, p.y - 380); });
  // houses: floor, walls
  MAP.houses.forEach(h => { if (!vis(h.x + h.w / 2, h.y + h.h / 2, h.w)) return; g.fillStyle = '#c8b090'; g.fillRect(h.x, h.y, h.w, h.h); g.strokeStyle = '#b09878'; g.lineWidth = 1; for (let x = h.x; x < h.x + h.w; x += 24){ g.beginPath(); g.moveTo(x, h.y); g.lineTo(x, h.y + h.h); g.stroke(); } });
  g.fillStyle = '#7a5a3a'; MAP.walls.forEach(w => { if (vis(w.x + w.w / 2, w.y + w.h / 2, Math.max(w.w, w.h))) g.fillRect(w.x, w.y, w.w, w.h); });
  // built walls
  V.built.forEach(([id, x, y, w, h, hp]) => { g.fillStyle = '#c8925a'; g.fillRect(x, y, w, h); g.strokeStyle = '#7a4a20'; g.lineWidth = 2; g.strokeRect(x, y, w, h); g.fillStyle = '#7a4a2066'; for (let i = 1; i < 4; i++){ if (w > h) g.fillRect(x + w * i / 4 - 1, y, 2, h); else g.fillRect(x, y + h * i / 4 - 1, w, 2); } if (hp < 150){ g.fillStyle = '#0006'; g.fillRect(x, y + h + 2, w, 3); g.fillStyle = '#ffd23f'; g.fillRect(x, y + h + 2, w * hp / 150, 3); } });
  // loot
  V.loot.forEach(l => { if (vis(l[1], l[2], 20)) drawLoot(l, t); });
  // rocks
  MAP.rocks.forEach(r => { if (!vis(r.x, r.y, r.r)) return; const s = r.shake > 0 ? (r.shake -= .016, Math.sin(t * 60) * 3) : 0; g.fillStyle = '#8a8f98'; g.beginPath(); g.arc(r.x + s, r.y, r.r, 0, 7); g.fill(); g.fillStyle = '#a8adb6'; g.beginPath(); g.arc(r.x - r.r * .3 + s, r.y - r.r * .3, r.r * .45, 0, 7); g.fill(); });
  // bullets
  V.b.forEach(([x, y, vx, vy, k]) => { const s = Math.hypot(vx, vy) || 1; g.strokeStyle = k === 'sniper' ? '#fff' : '#ffe36e'; g.lineWidth = k === 'sniper' ? 3 : 2.5; g.beginPath(); g.moveTo(x, y); g.lineTo(x - vx / s * 18, y - vy / s * 18); g.stroke(); });
  // players on the ground
  V.ps.filter(p => p[10] === 2).forEach(p => { if (vis(p[6], p[7], 40)) drawPlayer(p, t); });
  // tree tops cover people a little (but you can still be seen if it's you)
  MAP.trees.forEach(tr => { if (!vis(tr.x, tr.y, tr.r + 20)) return; const s = tr.shake > 0 ? (tr.shake -= .016, Math.sin(t * 60) * 3) : 0; g.fillStyle = tr.snow ? '#3f7a5a' : '#2f7a32'; g.beginPath(); g.arc(tr.x + s, tr.y, tr.r + 8, 0, 7); g.fill(); g.fillStyle = tr.snow ? '#f2f8ff' : '#3f9a3f'; g.beginPath(); g.arc(tr.x - 5 + s, tr.y - 5, tr.r * .75, 0, 7); g.fill(); });
  // roofs fade when you're inside
  MAP.houses.forEach(h => { if (!vis(h.x + h.w / 2, h.y + h.h / 2, h.w)) return; const inside = meP && meP[6] > h.x && meP[6] < h.x + h.w && meP[7] > h.y && meP[7] < h.y + h.h; g.globalAlpha = inside ? .12 : .95; g.fillStyle = h.roof; g.fillRect(h.x - 6, h.y - 6, h.w + 12, h.h + 12); g.fillStyle = shade(h.roof, -30); g.fillRect(h.x - 6, h.y + h.h / 2 - 3, h.w + 12, 6); g.globalAlpha = 1; });
  // skydivers above everything
  V.ps.filter(p => p[10] === 1).forEach(p => { if (vis(p[6], p[7], 80)) drawPlayer(p, t); });
  // the party bus (a big flying blimp)
  if (V.bus.t < 1 || m.state === 'bus'){
    g.save(); g.translate(V.bus.x, V.bus.y); g.rotate(V.bus.a);
    g.fillStyle = '#0002'; g.beginPath(); g.ellipse(40, 60, 120, 40, 0, 0, 7); g.fill();
    g.fillStyle = '#ff5fa2'; g.beginPath(); g.ellipse(0, 0, 130, 48, 0, 0, 7); g.fill();
    g.fillStyle = '#ffd23f'; g.fillRect(-60, -48, 18, 96); g.fillRect(10, -48, 18, 96);
    g.fillStyle = '#3d6bff'; g.beginPath(); g.moveTo(-120, 0); g.lineTo(-165, -40); g.lineTo(-165, 40); g.fill();
    g.fillStyle = '#fff'; g.font = '700 22px Fredoka,sans-serif'; g.textAlign = 'center'; g.fillText('PARTY BUS', 0, 8);
    g.restore();
  }
  // storm wall
  const S = V.storm;
  g.save(); g.fillStyle = 'rgba(120,40,200,.35)'; g.beginPath(); g.rect(vx0, vy0, vx1 - vx0, vy1 - vy0); g.arc(S.x, S.y, Math.max(1, S.r), 0, 7, true); g.fill('evenodd');
  g.strokeStyle = '#c084fc'; g.lineWidth = 6; g.beginPath(); g.arc(S.x, S.y, Math.max(1, S.r), 0, 7); g.stroke();
  g.strokeStyle = '#ffffff99'; g.lineWidth = 3; g.setLineDash([20, 16]); g.beginPath(); g.arc(S.nx, S.ny, Math.max(1, S.nr), 0, 7); g.stroke(); g.setLineDash([]); g.restore();
  // effects
  for (let i = VFX.length - 1; i >= 0; i--){
    const f = VFX[i]; f.t += .016; if (f.t > .8){ VFX.splice(i, 1); continue; }
    g.globalAlpha = 1 - f.t / .8;
    if (f.type === 'elim'){ g.strokeStyle = '#ffd23f'; g.lineWidth = 4; g.beginPath(); g.arc(f.x, f.y, 10 + f.t * 80, 0, 7); g.stroke(); g.fillStyle = '#fff'; g.font = '700 18px Fredoka'; g.textAlign = 'center'; g.fillText('💥', f.x, f.y - f.t * 40); }
    if (f.type === 'chop' || f.type === 'build'){ g.fillStyle = '#c8925a'; for (let k = 0; k < 6; k++){ g.fillRect(f.x + Math.cos(k) * f.t * 50, f.y + Math.sin(k) * f.t * 50, 5, 5); } }
    if (f.type === 'chest'){ g.fillStyle = '#ffd23f'; for (let k = 0; k < 10; k++){ g.beginPath(); g.arc(f.x + Math.cos(k * .63) * f.t * 70, f.y + Math.sin(k * .63) * f.t * 70, 4, 0, 7); g.fill(); } }
    g.globalAlpha = 1;
  }
  // storm tint on the screen when you're outside
  if (meP && m.alive && m.state === 'ground' && Math.hypot(meP[6] - S.x, meP[7] - S.y) > S.r){ g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = 'rgba(120,40,200,.25)'; g.fillRect(0, 0, W, H); }
}

// ---------------- main loop ----------------
let last = performance.now(), sendT = 0, lastIn = '';
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const inMatch = !$('hud').hidden;
  if (inMatch){
    const c = readControls(dt);
    if (NET.mode === 'client'){
      const s = JSON.stringify([+c.mx.toFixed(2), +c.my.toFixed(2), +c.aim.toFixed(2), c.fire, c.jump, c.slot]);
      if (s !== lastIn && now - sendT > 45){ lastIn = s; sendT = now; sendHost({ k: 'in', v: c }); }
    } else if (M){
      inputs[me] = c;
      stepMatch(dt);
      M.players.forEach(p => { if (p.hitT > 0) p.hitT -= dt; });
      V = viewFor(me);
      if (NET.mode === 'host' && now - sendT > 66){ sendT = now; NET.conns.forEach((cn, id) => { try { cn.send({ k: 'v', v: viewFor(id) }); } catch (e) {} }); }
    }
    ctl.slot = null;
    if (R3 && R3.swing) for (const k in R3.swing) R3.swing[k] -= dt;
    if (V){ paintHud(); showResult(); }
  }
  draw(now / 1000, dt);
  requestAnimationFrame(loop);
}
try { R3 = init3d(); } catch (e) { console.warn('3D off', e); R3 = null; const gl = document.getElementById('gl'); if (gl) gl.remove(); }
if (R3) addEventListener('resize', () => { R3.ren.setSize(innerWidth, innerHeight); R3.cam.aspect = innerWidth / innerHeight; R3.cam.updateProjectionMatrix(); });
requestAnimationFrame(loop);
window.__royale = { get M(){ return M; }, get V(){ return V; }, get R3(){ return R3; }, ctl, NET };
})();
