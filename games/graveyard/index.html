<!DOCTYPE html>
<html lang="en">
<head>
<script src="../account.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Graveyard Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#110c17;--panel:#1d1626;--panel2:#2a1f36;--line:#3e2f4f;--text:#efe8f2;--muted:#a99bb5;--accent:#ff8a1f;--green:#8fd14f;--red:#e0483f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.h{font-family:Oswald,Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.spooky{font-family:Creepster,Oswald,cursive;letter-spacing:.04em}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}
#lobby{flex-direction:column;align-items:center;overflow-y:auto;background:
 radial-gradient(circle at 85% 6%,rgba(255,240,200,.18) 0 40px,rgba(255,240,200,.05) 41px 110px,transparent 111px),
 radial-gradient(ellipse at top,#2a1a3a 0%,transparent 65%),#110c17}
.wrap{width:100%;max-width:620px;padding:16px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:38px;line-height:.95;color:var(--accent);text-shadow:0 0 18px rgba(255,138,31,.45),0 2px 0 #000}
.logo small{display:block;font-family:Oswald,sans-serif;font-size:12px;color:var(--muted);letter-spacing:.25em;margin-top:6px;text-shadow:none;text-transform:uppercase}
.medals{background:#0b0810;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:20px;font-weight:600;white-space:nowrap}
.resume{display:none;margin-top:14px;background:linear-gradient(120deg,#4a1d12,#2a1620);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;align-items:center;gap:12px}
.resume.on{display:flex}.resume .rt{flex:1;min-width:0}.resume .rt b{font-family:Oswald,sans-serif;font-size:18px;display:block}.resume .rt span{font-size:12.5px;color:#e6c9b8}
.resume button{flex:none;padding:12px 16px;border-radius:10px;background:var(--accent);color:#2a1200;font-family:Oswald,sans-serif;font-weight:700;font-size:16px;box-shadow:0 3px 0 #a04f0a}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px}
.stats-row div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
.stats-row b{display:block;font-family:Oswald,sans-serif;font-size:18px;color:var(--text)}
.savest{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
.maps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mcard{flex:0 0 128px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:left}
.mcard.on{border-color:var(--accent);background:var(--panel2)}
.mcard canvas{display:block;width:100%;border-radius:8px}
.mcard .mn{font-family:Oswald,sans-serif;font-size:14px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .md{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mcard .mw{font-size:11px;color:var(--muted)}
.mission{margin-top:12px;background:linear-gradient(160deg,#35224a,#1c1426);border:1px solid #5a3f74;border-radius:14px;padding:16px;position:relative;overflow:hidden}
.mission:after{content:"🎃";position:absolute;right:10px;top:4px;font-size:70px;opacity:.15;transform:rotate(12deg)}
.mission .lbl{color:var(--muted);font-size:13px;letter-spacing:.2em}
.mission .wv{font-size:46px;line-height:1.05;color:#d6ff9a;text-shadow:0 0 14px rgba(143,209,79,.35)}
.modes{display:flex;gap:6px;margin:4px 0 12px}.mode{flex:1;padding:9px 4px;border-radius:9px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--muted);font-size:14px}.mode.on{background:#4a2a5a;border-color:#b07ae0;color:#fff}
.intel{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px}
.chip.air{border-color:#6a7fa8}.chip.boss{border-color:var(--red);color:#ffb3b0}
.deploy{width:100%;padding:15px;border-radius:10px;background:var(--accent);color:#2a1200;font-size:22px;font-weight:700;box-shadow:0 4px 0 #a04f0a}
.deploy:active{transform:translateY(3px);box-shadow:0 1px 0 #a04f0a}
.best{margin-top:8px;font-size:12px;color:var(--muted);text-align:center}
.tabs{display:flex;gap:8px;margin:20px 0 10px}
.tab{flex:1;padding:10px 4px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--panel2);color:var(--text);border-color:var(--accent)}
.grid{display:grid;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.card.best1{border-color:#a85a1a;background:linear-gradient(120deg,#2e1a14,var(--panel) 60%)}
.card canvas{flex:none;background:#1e2a1c;border-radius:10px;border:1px solid #2c3a28}
.card .info{flex:1;min-width:0}
.card .nm{font-size:18px;font-weight:600}
.card .ds{font-size:12.5px;color:var(--muted);margin:2px 0 5px}
.stats{display:flex;gap:10px;font-size:12px;color:#d8cfe0;flex-wrap:wrap}
.stats b{color:var(--accent);font-weight:600}
.buy{flex:none;min-width:92px;padding:10px 8px;border-radius:8px;background:var(--green);color:#142005;font-weight:700;font-size:15px}
.buy[disabled]{background:#342a3e;color:#7d7088;cursor:default}
.buy.owned{background:transparent;border:1px solid var(--line);color:var(--muted)}
.locked canvas{filter:grayscale(1) brightness(.55)}
.reset{margin:26px auto 0;display:block;background:none;color:#6e6378;font-size:12px;text-decoration:underline}
#battle{flex-direction:column;background:#0b0810}
.hud{display:flex;align-items:center;gap:3px;padding:7px 5px;background:#0b0810;border-bottom:1px solid #2a2033;font-family:Oswald,sans-serif;font-size:clamp(11px,3.4vw,16px)}
.hud .st{background:#1a1322;border:1px solid #33273f;border-radius:7px;padding:5px 4px;white-space:nowrap}
.hud .sp{flex:1}
#autoBtn.on{background:var(--accent);color:#2a1200;border-color:var(--accent)}
.hbtn{background:#281e33;border:1px solid #48385a;border-radius:7px;padding:5px 6px;font-family:Oswald,sans-serif;font-size:inherit;flex:none}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
#cv{touch-action:none;display:block;border-radius:6px}
.bar{display:flex;gap:6px;padding:8px;background:#0b0810;border-top:1px solid #2a2033;overflow-x:auto}
.ucard{flex:1 0 70px;max-width:96px;background:#1a1322;border:2px solid #33273f;border-radius:10px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;font-size:11px}
.ucard .cn{font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ucard .cc{color:var(--accent);font-family:Oswald,sans-serif;font-size:14px}
.ucard.sel{border-color:var(--accent);background:#3a2214}
.ucard.poor{opacity:.45}
.ovl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,4,9,.75);z-index:5}
.ovl.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;width:min(86%,360px)}
.box h2{margin:0 0 6px;font-size:40px;font-weight:400;color:var(--accent)}
.box p{color:var(--muted);margin:6px 0 16px}
.box .deploy{font-size:18px;padding:12px;margin-top:8px}
.ghostbtn{width:100%;padding:12px;border-radius:10px;background:#342a3e;font-size:16px;margin-top:8px}
#startBtn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;padding:13px 26px;border-radius:30px;background:var(--accent);color:#2a1200;font-family:Oswald,sans-serif;font-size:19px;font-weight:700;box-shadow:0 0 22px rgba(255,138,31,.5);letter-spacing:.05em;white-space:nowrap}
#spells{position:absolute;right:10px;bottom:70px;z-index:3;display:flex;flex-direction:column;gap:8px}
.spell{position:relative;width:50px;height:50px;border-radius:50%;background:#281e33;border:2px solid #48385a;font-size:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:.7}
.spell.ready{opacity:1;border-color:var(--accent);box-shadow:0 0 12px rgba(255,138,31,.55)}.spell.aim{background:#5a2a10}
.spell:before{content:"";position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.7) var(--p,0%),transparent 0)}
.spell .si{position:relative}.spell .cdv{position:absolute;font-family:Oswald,sans-serif;font-size:15px;color:#fff;text-shadow:0 1px 2px #000}
.tab .bdg{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
.card.claim{border-color:#e8b830;background:linear-gradient(120deg,#3a2a10,var(--panel) 60%)}.card.done{opacity:.55}
.prog{height:5px;background:#2a2033;border-radius:3px;margin-top:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.65);padding:6px 12px;border-radius:20px;font-size:12.5px;white-space:nowrap;pointer-events:none}
#panel{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;background:rgba(26,19,34,.97);border:1px solid var(--line);border-radius:12px;padding:10px;display:none;flex-wrap:wrap;align-items:center;gap:8px 10px}
#panel .acts{flex-basis:100%;display:flex;gap:8px}
#panel .acts .pb{flex:1;margin:0}
#panel.on{display:flex}
#panel .info{flex:1;min-width:0}
#panel .nm{font-family:Oswald,sans-serif;font-size:18px}
#panel .stats{margin-top:3px}
.pb{padding:10px 10px;border-radius:8px;font-weight:700;font-size:13px;line-height:1.15}
.pb.up{background:var(--green);color:#142005}.pb.up[disabled]{background:#342a3e;color:#80748a}
.pb.tg{background:#3a2a55;color:#efe2ff;padding:6px 10px;margin-top:6px;font-size:12px;border:1px solid #5a4380}
.pb.sell{background:#5a2b28;color:#ffd2cf}
.pb.x{background:transparent;color:var(--muted);font-size:20px;padding:6px}
#toast{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:6;background:#5a2b28;color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
</style>
</head>
<body>

<div id="lobby" class="screen on">
 <div class="wrap">
  <div class="top">
   <div class="logo spooky">Graveyard Defense<small>Survive the night</small></div>
   <div class="medals">🍬 <span id="lMedals">0</span></div>
  </div>
  <div class="resume" id="resumeCard"></div>
  <div class="lbl h" style="margin:18px 0 8px;color:var(--muted);font-size:13px;letter-spacing:.2em">Choose your map</div>
  <div class="maps" id="maps"></div>
  <div class="mission">
   <div class="lbl h" id="lMap">Next night</div>
   <div class="wv spooky" id="lWave">Wave 1</div>
   <div class="intel" id="lIntel"></div>
   <div class="modes"><button class="mode h" data-mode="campaign">🌙 Campaign</button><button class="mode h" data-mode="endless">♾️ Endless</button></div>
   <button class="deploy h" id="deployBtn">Defend the manor ▶</button>
   <div class="best" id="lBest"></div>
  </div>
  <div class="tabs">
   <button class="tab on h" data-tab="units">Monsters</button>
   <button class="tab h" data-tab="upg">Upgrades</button>
   <button class="tab h" data-tab="spells">Spells</button>
   <button class="tab h" data-tab="troph" id="trophTab">Trophies</button>
  </div>
  <div class="grid" id="shop"></div>
  <div class="stats-row" id="lStats"></div>
  <div class="savest" id="saveStatus">💾 Progress saved on this device</div>
  <button class="reset" id="resetBtn">Reset all progress</button>
 </div>
</div>

<div id="battle" class="screen">
 <div class="hud">
  <div class="st" id="hWave">W1</div>
  <div class="st">🏚️ <span id="hLives">20</span></div>
  <div class="st">🎃 <span id="hSup">0</span></div>
  <div class="st" id="hLeft">🧟 0</div>
  <div class="sp"></div>
  <button class="hbtn" id="autoBtn">AUTO</button>
  <button class="hbtn" id="speedBtn">1x</button>
  <button class="hbtn" id="pauseBtn">❚❚</button>
 </div>
 <div id="stage">
  <canvas id="cv"></canvas>
  <div id="spells"></div>
  <div id="hint">Pick a monster below, then tap the graveyard</div>
  <button id="startBtn">🧟 START WAVE</button>
  <div id="toast"></div>
  <div id="panel">
   <canvas id="pIcon" width="96" height="96" style="width:48px;height:48px;background:#1e2a1c;border-radius:8px;flex:none"></canvas>
   <div class="info"><div class="nm" id="pName"></div><div class="stats" id="pStats"></div></div>
   <button class="pb x" id="pClose">✕</button>
   <div class="acts"><button class="pb tg" id="pMode"></button><button class="pb up" id="pUp"></button><button class="pb sell" id="pSell"></button></div>
  </div>
  <div class="ovl" id="pauseOvl"><div class="box">
   <h2 class="spooky">Paused</h2><p id="pauseText">Fleeing forfeits this wave.</p>
   <button class="deploy h" id="resumeBtn">Resume</button>
   <button class="ghostbtn h" id="quitBtn">Flee to lobby</button>
  </div></div>
  <div class="ovl" id="endOvl"><div class="box">
   <h2 class="spooky" id="eTitle"></h2><p id="eText"></p>
   <button class="deploy h" id="eBtn">Back to lobby</button>
  </div></div>
 </div>
 <div class="bar" id="bar"></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const W=600,H=900,TAU=Math.PI*2;
const MAPS={
 hollow:{name:'Pumpkin Hollow',diff:'Easy',dc:'#8fd14f',hp:.8,spd:.9,reward:1,pk:34,
  path:[[-40,90],[520,90],[520,250],[80,250],[80,410],[520,410],[520,570],[80,570],[80,730],[300,730],[300,850]],
  t:{ground:'#1e2316',patch:['#262c1a','#1a1f13','#2e2a1a','#22281a','#33301c'],speck:['#3a4428','#0e120c'],path:['#120d08','#33261a','#3f2f20'],tint:'255,170,90',ta:.1}},
 cemetery:{name:'Old Cemetery',diff:'Medium',dc:'#e8c440',hp:1,spd:1,reward:1.3,pk:14,
  path:[[-40,110],[490,110],[490,320],[110,320],[110,540],[490,540],[490,740],[300,740],[300,850]],
  t:{ground:'#1b2219',patch:['#222b1f','#151b13','#272033','#1e2519','#2b2a1c'],speck:['#34422a','#0e120c'],path:['#0f0b09','#2c221a','#382c21'],tint:'170,180,255',ta:.12}},
 swamp:{name:"Witch's Swamp",diff:'Hard',dc:'#ff8a1f',hp:1.2,spd:1.05,reward:1.7,pk:8,pools:true,
  path:[[640,120],[380,120],[380,420],[150,420],[150,700],[420,700],[420,850]],
  t:{ground:'#15201b',patch:['#1a2a24','#0f1714','#1c2a1e','#203024','#13201a'],speck:['#2f4a3a','#0a100c'],path:['#0b0d08','#28281a','#333220'],tint:'120,255,170',ta:.1}},
 bloodmoon:{name:'Blood Moon Crossing',diff:'Nightmare',dc:'#e0483f',hp:1.45,spd:1.15,reward:2.2,pk:6,
  path:[[520,-40],[520,380],[120,380],[120,680],[300,680],[300,850]],
  t:{ground:'#1f1416',patch:['#2a181a','#160d0f','#2a1a22','#241416','#301a1a'],speck:['#4a2226','#0e0809'],path:['#0e0606','#2e1c18','#3a241e'],tint:'255,60,40',ta:.18}},
};
const MAPORDER=Object.keys(MAPS);
let MAP,PATH,HQ,segs=[],pathLen=0,props=[],pumpkins=[];
function setMap(id){MAP=MAPS[id]||MAPS.hollow;PATH=MAP.path;segs=[];pathLen=0;
 for(let i=0;i<PATH.length-1;i++){const[x1,y1]=PATH[i],[x2,y2]=PATH[i+1];const L=Math.hypot(x2-x1,y2-y1);segs.push({x1,y1,x2,y2,L,s:pathLen,a:Math.atan2(y2-y1,x2-x1)});pathLen+=L}
 const e=PATH[PATH.length-1];HQ={x:e[0],y:e[1]};
 props=[];seed=42+MAPORDER.indexOf(id)*7;let tries=0;while(props.length<0&&tries<800){tries++;const x=24+rnd()*552,y=30+rnd()*764;
  if(distToPath(x,y)>50&&Math.hypot(x-HQ.x,y-HQ.y)>110&&props.every(t=>Math.hypot(t.x-x,t.y-y)>58)){const kind=props.length%5===4?'tree':'grave';props.push({x,y,kind,r:kind==='tree'?16:13,v:Math.floor(rnd()*3),a:(rnd()-.5)*.3})}}
 pumpkins=[];seed=99;tries=0;while(pumpkins.length<MAP.pk&&tries<800){tries++;const x=15+rnd()*570,y=15+rnd()*870;if(distToPath(x,y)>40&&props.every(t=>Math.hypot(t.x-x,t.y-y)>30)&&Math.hypot(x-HQ.x,y-HQ.y)>75)pumpkins.push({x,y,r:4+rnd()*3})}
}
function posAt(d){for(const s of segs){if(d<=s.s+s.L){const t=(d-s.s)/s.L;return{x:s.x1+(s.x2-s.x1)*t,y:s.y1+(s.y2-s.y1)*t,a:s.a}}}const s=segs[segs.length-1];return{x:s.x2,y:s.y2,a:s.a}}
function distToPath(x,y){let m=1e9;for(const s of segs){const dx=s.x2-s.x1,dy=s.y2-s.y1;let t=((x-s.x1)*dx+(y-s.y1)*dy)/(s.L*s.L);t=Math.max(0,Math.min(1,t));m=Math.min(m,Math.hypot(x-s.x1-dx*t,y-s.y1-dy*t))}return m}

/* ---------- DATA ---------- */
const UNITS={
 skeleton:{name:'Skeleton',desc:'Hurls bones. Hits zombies & crows.',cost:100,unlock:0,range:125,dmg:11,rate:.6,air:true,kind:'hit',col:'240,235,215',w:1.8,r:18,muz:16},
 scarecrow:{name:'Scarecrow',desc:'Sends crows to peck. Triple damage vs flyers.',cost:150,unlock:120,range:150,dmg:9,rate:.55,air:true,kind:'hit',airx:3,col:'60,40,60',w:2,r:18,muz:10},
 ghost:{name:'Ghost',desc:'Rapid ecto-blasts. Weak vs armor.',cost:250,unlock:200,range:110,dmg:5,rate:.11,air:true,kind:'hit',col:'140,255,170',w:2.6,r:18,muz:13},
 vampire:{name:'Vampire',desc:'Drains blood from afar. Pierces armor.',cost:300,unlock:350,range:270,dmg:70,rate:2.2,air:true,kind:'hit',pierce:true,col:'255,40,60',w:2.6,r:18,muz:12},
 mummy:{name:'Mummy',desc:'Bandage lash slows zombies down. Ground only.',cost:300,unlock:450,range:120,dmg:14,rate:.9,air:false,kind:'hit',slow:1.8,col:'225,215,180',w:3,r:18,muz:14},
 witch:{name:'Witch',desc:'Green hellfire burns crowds. Ground only.',cost:350,unlock:550,range:80,dmg:5,rate:.08,air:false,kind:'flame',splash:30,r:18,muz:21},
 patch:{name:'Pumpkin Patch',desc:'Grows extra pumpkins during every wave.',cost:400,unlock:700,range:0,dmg:60,rate:5,kind:'farm',r:20,muz:0},
 cauldron:{name:'Poison Cauldron',desc:'Lobs poison that melts through armor over time. Ground only.',cost:500,unlock:900,range:135,dmg:20,rate:1.6,air:false,kind:'poison',splash:46,r:20,muz:0},
 zombie:{name:'Zombie Brute',desc:'A zombie on your side! Throws exploding gravestones.',cost:450,unlock:850,range:155,dmg:55,rate:1.7,air:true,kind:'grave',splash:50,r:18,muz:10},
 frank:{name:'Frankenstein',desc:'Lightning chains through 4 zombies. Hits air.',cost:550,unlock:1000,range:140,dmg:32,rate:1.2,air:true,kind:'chain',chains:4,r:19,muz:12},
 werewolf:{name:'Werewolf',desc:'Savage claws. Massive damage up close.',cost:600,unlock:1150,range:74,dmg:48,rate:.45,air:false,kind:'claw',splash:24,r:20,muz:16},

function waveComp(n){const c={};c.walker=Math.min(6+n*2,34);if(n>=3)c.runner=Math.min(n,18);if(n>=4)c.bloat=Math.floor(n/2);if(n>=5)c.armored=Math.floor((n-3)/2);if(n>=7)c.crow=Math.floor((n-5)/2);if(n>=8)c.giant=Math.floor((n-6)/2);if(n>=6)c.crawler=Math.min(n,20);if(n>=6)c.bats=Math.floor((n-4)/2);if(n>=8)c.bomber=Math.floor((n-5)/3);if(n>=9)c.healer=Math.floor((n-7)/3)+1;if(n>=11)c.phantom=Math.floor((n-9)/2);if(n>=12)c.brood=Math.floor((n-10)/2);if(n%10===0)c.king=n/10;if(n>=15&&n%10===5)c.dragon=(n-5)/10;return c}
function buildWave(n,cc){const c=cc||waveComp(n),ev=[];const gaps={walker:.9,runner:.6,crawler:.5,bloat:1.4,bats:1,armored:2.2,bomber:2.5,healer:3,crow:2.6,phantom:2,brood:3.5,giant:3.5};let start=0;const f=Math.max(.45,1-n*.02);
 for(const k of Object.keys(gaps))if(c[k]){for(let i=0;i<c[k];i++)ev.push({t:start+i*gaps[k]*f,type:k});start+=k==='walker'?4:3}
 ev.sort((a,b)=>a.t-b.t);for(const bk of ['king','dragon'])if(c[bk]){let t=ev.length?ev[ev.length-1].t:0;for(let i=0;i<c[bk];i++)ev.push({t:t+3+i*6,type:bk})}return ev}
const hpMul=n=>1+.14*(n-1)+.012*(n-1)*(n-1);
const hpMulEndless=n=>.6*(1+.13*(n-1)+.014*(n-1)*(n-1))*Math.pow(1.035,Math.max(0,n-25));
function endlessComp(n){const c=waveComp(n);delete c.king;delete c.dragon;const m=Math.min(3,1+Math.max(0,n-20)*.04);for(const k in c)c[k]=Math.max(1,Math.round(c[k]*m));
 if(n%10===0){const L=n/10;if(L%2===1)c.king=Math.ceil(L/2);else c.dragon=L/2;if(n>=40){c.king=c.king||Math.floor(L/4);c.dragon=c.dragon||Math.floor(L/4)}}return c}
function setupWave(n){G.wave=n;const en=G.mode==='endless';G.spawn=buildWave(n,en?endlessComp(n):null);G.mul=(en?hpMulEndless(n):hpMul(n))*MAP.hp;G.rmul=1+.05*(n-1);

/* ---------- SIMULATION ---------- */
function burst(x,y,n,cols,sp,life,size){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=sp*(.3+Math.random()*.7);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life*(.6+Math.random()*.6),max:life,col:cols[i%cols.length],size:size*(.6+Math.random()*.8),drag:3})}}
function explode(x,y,rad,dmg,hitAir,style){
 for(const e of G.enemies)if(!e.dead&&(hitAir||!e.air)&&Math.hypot(e.x-x,e.y-y)<rad+e.r*.5)damage(e,dmg,false);
 if(style==='grave'){burst(x,y,16,['#6a5a45','#4a3a2a','#9a9aa0'],rad*2.6,.55,5);burst(x,y,8,['#9fff7a'],rad*2,.4,2.5)}
 else{burst(x,y,18,['#ffd25a','#ff8a2a','#ff5a1f'],rad*3,.45,5);burst(x,y,6,['#ffb040'],rad*2,.6,3)}
 burst(x,y,8,['rgba(60,55,65,.8)','rgba(90,85,100,.7)'],rad*1.4,.9,8);
 G.parts.push({x,y,vx:0,vy:0,life:.15,max:.15,col:style==='grave'?'#d0ffc0':'#fff2c0',size:rad*.9,ring:true,drag:0});
 G.scorch.push({x,y,r:rad*.45,life:8});if(G.scorch.length>40)G.scorch.shift()
}
function poisonAt(x,y,rad,dps){for(const e of G.enemies)if(!e.dead&&!e.air&&Math.hypot(e.x-x,e.y-y)<rad+e.r*.5){e.poison=4;e.pdps=Math.max(e.pdps||0,dps)}
 burst(x,y,16,['#7fff4a','#3a9a20','#c0ff90'],rad*2.2,.6,4);G.rings.push({x,y,r1:rad,life:.4,max:.4,col:'120,255,80'});G.scorch.push({x,y,r:rad*.5,life:5,green:true})}
function damage(e,amt,pierce,quiet){if(e.dead||e.phased)return;const a=pierce?amt:Math.max(amt*.25,amt-e.armor);e.hp-=a;if(!quiet)e.hit=.08;
 if(e.hp<=0){e.dead=true;const rw=Math.round(e.reward*G.rmul*(1+.1*lv('bounty')));G.sup+=rw;G.kills++;save.stats.kills++;if(G.texts.length<25||e.big)G.texts.push({x:e.x,y:e.y-e.r-6,t:'+'+rw,life:e.big?2:.9});
  if(e.type==='king')save.stats.kings++;if(e.type==='dragon')save.stats.dragons++;
  if(e.split)for(let i=0;i<e.splitN;i++)G.pending.push(makeEnemy(e.split,e.d-4-i*7,(Math.random()-.5)*22));
  if(e.bomb){G.rings.push({x:e.x,y:e.y,r1:75,life:.4,max:.4,col:'255,150,40'});burst(e.x,e.y,18,['#ffd25a','#ff8a2a'],160,.45,4);for(const u of G.units)if(Math.hypot(u.x-e.x,u.y-e.y)<75)u.stun=2.2}
  if(e.type==='bats')burst(e.x,e.y,10,['#1d1424','#4a2a3a'],60,.5,3);
  if(e.type==='crow')burst(e.x,e.y,14,['#120e14','#2a2430','#9f6'],70,.6,3);
  else if(e.big){burst(e.x,e.y,26,['#4a7a2a','#2a4a1a','#7a1a1a','#9fff7a'],e.r*4,.7,6);G.scorch.push({x:e.x,y:e.y,r:e.r*.9,life:10})}
  else burst(e.x,e.y,9,['#5a8a30','#2a4a1a','#7a1a1a'],60,.5,3)}}
function makeEnemy(type,dd,off){const d=ENEMIES[type];const hp=d.hp*G.mul;const p=posAt(Math.max(0,dd));return Object.assign({type},d,{speed:d.speed*MAP.spd*(G.spdMul||1),hp,max:hp,d:dd,off,x:p.x,y:p.y,a:p.a,hit:0,ph:Math.random()*6,dead:false,slow:0,poison:0})}
function spawnEnemy(type){const d=ENEMIES[type];G.enemies.push(makeEnemy(type,-20-Math.random()*10,(Math.random()-.5)*(d.big?4:22)))}
function update(dt){
 G.time+=dt;for(const f of G.fog){f.x+=f.v*dt;if(f.x-f.r>W)f.x=-f.r}
 if(G.started){G.t+=dt;while(G.spawn.length&&G.spawn[0].t<=G.t)spawnEnemy(G.spawn.shift().type)}
 if(G.started&&lv('regen')&&!G.over)G.lives=Math.min(G.maxLives,G.lives+lv('regen')*dt);
 for(const k in G.scd)G.scd[k]=Math.max(0,G.scd[k]-dt);if(G.fogT>0)G.fogT-=dt;
 for(const e of G.enemies){if(e.dead)continue;
  if(e.phase)e.phased=((G.time+e.ph)%4)<1.3;
  if(e.poison>0){e.poison-=dt;const ph=e.phased;e.phased=false;damage(e,e.pdps*dt,true,true);e.phased=ph;if(e.dead)continue}
  if(e.heal){e.ht=(e.ht===undefined?2:e.ht)-dt;if(e.ht<=0){e.ht=3.5;G.rings.push({x:e.x,y:e.y,r1:85,life:.5,max:.5,col:'120,255,120'});for(const o of G.enemies)if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<85)o.hp=Math.min(o.max,o.hp+o.max*.12)}}
  if(e.slow>0)e.slow-=dt;e.d+=e.speed*(e.slow>0?(e.big?.7:.5):1)*dt;const p=posAt(Math.max(0,e.d));
  let da=p.a-e.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;e.a+=da*Math.min(1,dt*8);
  e.x=p.x-Math.sin(p.a)*e.off;e.y=p.y+Math.cos(p.a)*e.off;if(e.hit>0)e.hit-=dt;
  if(e.d>=pathLen-34){e.dead=true;if(G.over)continue;G.lives-=e.dmg;G.leaked+=e.dmg;burst(HQ.x,HQ.y-20,12,['#5a8a30','#7a1a1a','#3d3449'],90,.5,4)}}
 for(const u of G.units){const d=UNITS[u.type],s=stat(u);if(u.stun>0){u.stun-=dt;continue}u.cd-=dt;
  if(u.swing>0)u.swing-=dt;
  if(d.kind==='farm'){if(G.started){if(u.cd<=0){u.cd+=s.rate;const g=farmAmt(u);G.sup+=g;G.texts.push({x:u.x,y:u.y-22,t:'+'+g,life:1.1});burst(u.x,u.y,8,['#ff8a1f','#ffd25a','#3f7a25'],60,.5,3)}}else u.cd=s.rate;continue}
  let tgt=null,bd=-1e9;for(const e of G.enemies){if(e.dead||e.phased||(e.air&&!d.air))continue;const dist=Math.hypot(e.x-u.x,e.y-u.y);if(dist>s.range+e.r)continue;
   const sc=u.mode==='last'?-e.d:u.mode==='strong'?e.hp:u.mode==='close'?-dist:e.d;if(sc>bd){bd=sc;tgt=e}}
  if(!tgt){if(u.cd<0)u.cd=0;continue}
  if(d.all){let guard=0;while(u.cd<=0&&guard++<4){u.cd+=s.rate;fire(u,d,s,tgt)}continue}
  const ta=Math.atan2(tgt.y-u.y,tgt.x-u.x);let da=ta-u.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;u.a+=da*Math.min(1,dt*(u.type==='horseman'?6:14));
  if(Math.abs(da)>.5)continue;
  let guard=0;while(u.cd<=0&&guard++<6){u.cd+=s.rate;fire(u,d,s,tgt);if(tgt.dead)break}}
 for(const p of G.proj){
  if(p.tgt&&!p.tgt.dead){p.tx=p.tgt.x;p.ty=p.tgt.y}
  const dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.hypot(dx,dy),step=p.sp*dt;p.a=Math.atan2(dy,dx);p.spin+=dt*12;
  if(dist<=step+4){p.done=true;if(p.kind==='poison')poisonAt(p.tx,p.ty,p.splash,p.dmg);else explode(p.tx,p.ty,p.splash,p.dmg,p.kind!=='meteor'||true,p.kind)}else{p.x+=dx/dist*step;p.y+=dy/dist*step;
   if(p.kind==='pumpkin'){for(let i=0;i<2;i++)G.parts.push({x:p.x+(Math.random()-.5)*6,y:p.y+(Math.random()-.5)*6,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:.35,max:.35,col:'flame',size:4,drag:1})}
   else if(Math.random()<.5)G.parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.3,max:.3,col:'rgba(150,140,130,.5)',size:3,drag:1})}}
 G.proj=G.proj.filter(p=>!p.done);
 if(G.pending.length){G.enemies.push(...G.pending);G.pending=[]}
 for(const p of G.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.max(0,1-p.drag*dt);p.vx*=f;p.vy*=f}
 G.parts=G.parts.filter(p=>p.life>0);if(G.parts.length>700)G.parts.splice(0,G.parts.length-700);
 for(const t of G.tracers)t.life-=dt;G.tracers=G.tracers.filter(t=>t.life>0);
 for(const t of G.slashes)t.life-=dt;G.slashes=G.slashes.filter(t=>t.life>0);
 for(const t of G.rings)t.life-=dt;G.rings=G.rings.filter(t=>t.life>0);for(const t of G.bolts)t.life-=dt;G.bolts=G.bolts.filter(t=>t.life>0);for(const t of G.texts){t.life-=dt;t.y-=24*dt}G.texts=G.texts.filter(t=>t.life>0);
 for(const s of G.scorch)s.life-=dt;G.scorch=G.scorch.filter(s=>s.life>0);
 G.enemies=G.enemies.filter(e=>!e.dead);
 if(!G.over){if(G.lives<=0){G.lives=0;endBattle(false)}else if(G.started&&!G.spawn.length&&!G.enemies.length)waveCleared()}
 if(!G.started&&G.betweenT>0&&!G.over){G.betweenT-=dt;if(G.betweenT<=0)startWave()}
 if(G.banner){G.banner.life-=dt;if(G.banner.life<=0)G.banner=null}
}
function fire(u,d,s,tgt){
 const mz=d.muz*BS(u.type),mx=u.x+Math.cos(u.a)*mz,my=u.y+Math.sin(u.a)*mz;
 if(d.kind==='hit'){if(d.slow)tgt.slow=d.slow;damage(tgt,s.dmg*(tgt.air&&d.airx?d.airx:1),d.pierce);const sp=u.type==='ghost'?8:2;const life=u.type==='vampire'?.2:.07;
  G.tracers.push({x1:mx,y1:my,x2:tgt.x+(Math.random()-.5)*sp,y2:tgt.y+(Math.random()-.5)*sp,life,max:life,w:d.w,col:d.col});
  if(u.type==='vampire')burst(tgt.x,tgt.y,6,['#c01020','#ff3040'],50,.4,2.5);
  else if(u.type==='skeleton')burst(tgt.x,tgt.y,2,['#eee8d5'],40,.25,2);else if(u.type==='scarecrow')burst(tgt.x,tgt.y,3,['#120e14','#3a2a3a'],50,.3,2.5)}
 else if(d.kind==='flame'){for(const e of G.enemies)if(!e.dead&&!e.air&&(e===tgt||Math.hypot(e.x-tgt.x,e.y-tgt.y)<d.splash))damage(e,s.dmg,false);
  for(let i=0;i<3;i++){const a=u.a+(Math.random()-.5)*.35,v=180+Math.random()*90;G.parts.push({x:mx,y:my,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.38,max:.38,col:'gflame',size:4,drag:2.2})}}
 else if(d.kind==='claw'){for(const e of G.enemies)if(!e.dead&&!e.air&&(e===tgt||Math.hypot(e.x-tgt.x,e.y-tgt.y)<d.splash))damage(e,s.dmg,false);
  G.slashes.push({x:tgt.x,y:tgt.y,a:u.a,life:.18});burst(tgt.x,tgt.y,5,['#7a1a1a','#5a8a30'],60,.35,2.5)}
 else if(d.kind==='chain'){const hit=[tgt],pts=[[mx,my],[tgt.x,tgt.y]];let cur=tgt,dm=s.dmg;damage(tgt,dm,false);
  for(let i=1;i<d.chains;i++){let nb=null,nd=100;for(const e of G.enemies){if(e.dead||hit.includes(e))continue;const q=Math.hypot(e.x-cur.x,e.y-cur.y);if(q<nd){nd=q;nb=e}}if(!nb)break;hit.push(nb);dm*=.8;damage(nb,dm,false);pts.push([nb.x,nb.y]);cur=nb}
  const jp=[pts[0]];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];for(let j=1;j<=4;j++){const f=j/4;jp.push(j===4?b:[a[0]+(b[0]-a[0])*f+(Math.random()-.5)*12,a[1]+(b[1]-a[1])*f+(Math.random()-.5)*12])}}
  G.bolts.push({pts:jp,life:.16,max:.16});for(const e of hit)burst(e.x,e.y,3,['#cfefff'],50,.25,2)}
 else if(d.kind==='pulse'||d.kind==='sweep'){for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-u.x,e.y-u.y)<=s.range+e.r)damage(e,s.dmg,false);
  G.rings.push({x:u.x,y:u.y,r1:s.range,life:.45,max:.45,col:d.kind==='pulse'?'180,210,255':'170,80,230'});if(d.kind==='sweep')u.swing=.35}
 else{G.proj.push({kind:d.kind,x:mx,y:my,tgt,tx:tgt.x,ty:tgt.y,sp:d.kind==='pumpkin'?480:d.kind==='poison'?300:340,dmg:s.dmg,splash:d.splash,a:u.a,spin:0})}
}
function endBattle(win){G.over=true;selCard=null;ghost=null;$('panel').classList.remove('on');
 if(G.mode==='endless'){const reached=G.wave-1,best=save.endless[save.map]||0;save.medals+=G.endCandy;save.stats.lost++;
  $('eTitle').textContent=win==='leave'?'You left the night':'The night is over';
  $('eText').innerHTML=`You survived <b style="color:#efe8f2">${reached}</b> endless wave${reached===1?'':'s'} on ${MAP.name}.<br>Best on this map: <b style="color:#ff8a1f">${best}</b> · ${G.kills} zombies destroyed<br><br><span style="font-size:22px;color:#efe8f2">+${G.endCandy} 🍬 candy</span>`;
  battleSnap=null;storeBattle();persist();setTimeout(()=>$('endOvl').classList.add('on'),win==='leave'?0:600);return}
 if(win==='leave'){battleSnap=null;storeBattle();persist();G=null;showLobby();return}
 let m;const sw=1+.1*lv('sweet');if(win){m=Math.round((40+20*G.wave+(G.leaked===0?25:0))*MAP.reward*sw);if(G.leaked===0)save.stats.flawless++;save.medals+=m;mp().best=Math.max(mp().best,G.wave);mp().wave++;
  $('eTitle').textContent='You survived!';$('eText').innerHTML=`${G.kills} zombies destroyed${G.leaked===0?' · <b style="color:#ff8a1f">Flawless +25</b>':''}<br><br><span style="font-size:22px;color:#efe8f2">+${m} 🍬 candy</span>`}
 else{m=Math.round((40+20*G.wave)*.3*MAP.reward*sw);save.medals+=m;$('eTitle').textContent='The manor has fallen';$('eText').innerHTML=`${G.kills} zombies destroyed. Recruit more monsters and try again.<br><br><span style="font-size:20px;color:#efe8f2">+${m} 🍬 candy</span>`}
 if(win){save.stats.won++;save.stats.best=Math.max(save.stats.best,G.wave)}else save.stats.lost++;
 battleSnap=null;storeBattle();persist();const tc=TROPHIES.filter(t=>!save.trophies[t.id]&&t.get(save.stats)>=t.goal).length;if(tc)$('eText').insertAdjacentHTML('beforeend',`<br><br><b style="color:#ffd25a">🏆 ${tc} trophy reward${tc>1?'s':''} ready in the lobby!</b>`);setTimeout(()=>$('endOvl').classList.add('on'),600)}

/* ---------- RENDER ---------- */
function render(){
 const k=scale*dpr;ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);ctx.setTransform(k,0,0,k,0,0);
 for(const s of G.scorch){ctx.fillStyle=s.green?`rgba(60,200,40,${Math.min(1,s.life/5)*.3})`:`rgba(10,6,4,${Math.min(1,s.life/8)*.45})`;ell(ctx,s.x,s.y,s.r,s.r*.8)}
 const rangeC=(x,y,r,ok)=>{ctx.fillStyle=ok?'rgba(190,140,255,.09)':'rgba(220,50,40,.15)';circ(ctx,x,y,r);ctx.strokeStyle=ok?'rgba(210,170,255,.6)':'rgba(230,70,60,.8)';ctx.lineWidth=1.5;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();ctx.setLineDash([])};
 if(selUnit&&UNITS[selUnit.type].kind!=='farm')rangeC(selUnit.x,selUnit.y,stat(selUnit).range,true);
 for(const e of G.enemies)if(!e.air){drawEnemy(ctx,e,G.time);if(e.slow>0){ctx.strokeStyle='rgba(225,215,180,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(e.x,e.y,e.r*.9,e.r*.5,G.time*2,0,TAU);ctx.stroke()}}
 for(const u of G.units){
  if(u===selUnit){ctx.strokeStyle='#ff8a1f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y,UNITS[u.type].r+2,0,TAU);ctx.stroke()}
  drawUnitType(ctx,u.type,u.x,u.y,u.a+(u.swing>0?(1-u.swing/.35)*TAU:0),u.lvl,BS(u.type),G.time);
  if(u.stun>0){ctx.fillStyle='#ffe066';for(let i=0;i<3;i++){const an=G.time*5+i*2.1;circ(ctx,u.x+Math.cos(an)*10,u.y-22+Math.sin(an)*3,2)}}}
 for(const t of G.tracers){const f=t.life/t.max;ctx.strokeStyle=`rgba(${t.col},${f*.35})`;ctx.lineWidth=t.w*3;ctx.beginPath();ctx.moveTo(t.x1,t.y1);ctx.lineTo(t.x2,t.y2);ctx.stroke();ctx.strokeStyle=`rgba(${t.col},${f})`;ctx.lineWidth=t.w;ctx.stroke()}
 for(const r of G.rings){const f=r.life/r.max;ctx.strokeStyle=`rgba(${r.col},${f})`;ctx.lineWidth=2+5*f;ctx.beginPath();ctx.arc(r.x,r.y,8+(r.r1-8)*(1-f*f),0,TAU);ctx.stroke()}
 for(const b of G.bolts){const f=b.life/b.max;ctx.beginPath();b.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.strokeStyle=`rgba(120,190,255,${f*.5})`;ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle=`rgba(240,250,255,${f})`;ctx.lineWidth=1.8;ctx.stroke()}
 for(const s of G.slashes){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a+Math.PI/2);ctx.strokeStyle=`rgba(255,250,235,${s.life/.18})`;ctx.lineWidth=2;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*6,0,14,-.7,.7);ctx.stroke()}ctx.restore()}
 for(const p of G.proj){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);
  if(p.kind==='meteor'){ctx.scale(2.6,2.6);for(let i=0;i<3;i++)G.parts.push({x:p.x+(Math.random()-.5)*14,y:p.y+(Math.random()-.5)*14,vx:(Math.random()-.5)*40,vy:-30,life:.5,max:.5,col:'flame',size:6,drag:1})}
  if(p.kind==='poison'){glow(ctx,0,0,12,'110,255,80');ctx.fillStyle='#5ad030';circ(ctx,0,0,5);ctx.fillStyle='#c0ff90';circ(ctx,-1.5,-1.5,1.6)}
  else if(p.kind==='pumpkin'||p.kind==='meteor'){glow(ctx,0,0,14,'255,140,30');ctx.fillStyle='#ff8a1f';ell(ctx,0,0,6,5.2);ctx.fillStyle='#ffe066';tri(ctx,[-3,-1.5],[-1,-1.5],[-2,-3.5]);tri(ctx,[1,-1.5],[3,-1.5],[2,-3.5]);ctx.fillRect(-2.5,1,5,1.5)}
  else{ctx.fillStyle='#8f9299';rr(ctx,-4,-6,8,12,3);ctx.fillStyle='#5a5d63';ctx.fillRect(-.8,-4,1.6,7);ctx.fillRect(-2.6,-1.5,5.2,1.4)}
  ctx.restore()}
 ctx.globalCompositeOperation='lighter';
 for(const p of G.parts){const f=p.life/p.max;
  if(p.col==='flame'){ctx.fillStyle=f>.6?`rgba(255,230,120,${f})`:f>.3?`rgba(255,130,30,${f})`:`rgba(120,40,10,${f})`;circ(ctx,p.x,p.y,p.size*(1.8-f))}
  else if(p.col==='gflame'){ctx.fillStyle=f>.6?`rgba(210,255,150,${f})`:f>.3?`rgba(90,230,60,${f})`:`rgba(30,90,20,${f})`;circ(ctx,p.x,p.y,p.size*(1.8-f))}}
 ctx.globalCompositeOperation='source-over';
 for(const p of G.parts){if(p.col==='flame'||p.col==='gflame')continue;const f=p.life/p.max;ctx.globalAlpha=Math.max(0,f);ctx.fillStyle=p.col;
  if(p.ring)circ(ctx,p.x,p.y,p.size*(1.3-f*.5));else circ(ctx,p.x,p.y,p.size*(p.col.startsWith('rgba')?(1.6-f*.6):f))}
 ctx.globalAlpha=1;
 for(const e of G.enemies)if(e.air)drawEnemy(ctx,e,G.time);
 for(const f of G.fog)ctx.drawImage(fogSprite,f.x-f.r,f.y-f.r*.5,f.r*2,f.r);
 if(G.fogT>0){ctx.fillStyle=`rgba(190,210,240,${Math.min(.22,G.fogT*.08)})`;ctx.fillRect(0,0,W,H)}
 if(G.flash>0){ctx.fillStyle=`rgba(220,235,255,${G.flash})`;ctx.fillRect(0,0,W,H);G.flash-=.02}
 if(G.aim==='meteor'){ctx.strokeStyle='rgba(255,140,40,.8)';ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.strokeRect(4,4,W-8,H-8);ctx.setLineDash([])}
 ctx.font='bold 15px Oswald,sans-serif';ctx.textAlign='center';if(G.banner){const B=G.banner;ctx.globalAlpha=Math.min(1,B.life*1.5);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H*.42-44,W,80);ctx.font='44px Creepster,Oswald,sans-serif';ctx.fillStyle='#ff8a1f';ctx.fillText(B.t,W/2,H*.42);ctx.font='bold 17px Oswald,sans-serif';ctx.fillStyle='#efe8f2';ctx.fillText(B.s,W/2,H*.42+26);ctx.globalAlpha=1;ctx.font='bold 15px Oswald,sans-serif'}
 for(const t of G.texts){ctx.globalAlpha=Math.min(1,t.life*1.5);ctx.fillStyle='#000';const tt=t.t[0]==='+'?'+'+fmt(+t.t.slice(1)):t.t;ctx.fillText(tt+' 🎃',t.x+1,t.y+1);ctx.fillStyle='#ffb040';ctx.fillText(tt+' 🎃',t.x,t.y)}ctx.globalAlpha=1;
 {const w=96,f=Math.max(0,G.lives/G.maxLives),yy=HQ.y-64;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(HQ.x-w/2-2,yy-2,w+4,9);ctx.fillStyle=f>.5?'#8fd14f':f>.25?'#e8c440':'#e0483f';ctx.fillRect(HQ.x-w/2,yy,w*f,5)}
 if(selCard&&ghost){const ok=canPlace(ghost.x,ghost.y,selCard)&&G.sup>=uc(selCard);rangeC(ghost.x,ghost.y,Math.max(UNITS[selCard].range,26),ok);ctx.globalAlpha=.75;drawUnitType(ctx,selCard,ghost.x,ghost.y,-Math.PI/2,1,BS(selCard),G.time);ctx.globalAlpha=1}
}
function hud(){if(!G.started&&!G.over){const sb=$('startBtn'),tx=G.betweenT>0?`⏩ WAVE ${G.wave} IN ${Math.ceil(G.betweenT)}`:G.cleared?`🧟 START WAVE ${G.wave}`:'🧟 START WAVE';if(sb.textContent!==tx)sb.textContent=tx}
 $('hLives').textContent=Math.max(0,Math.ceil(G.lives));
 for(const b of $('spells').children){const k=b.dataset.k,rem=G.scd[k]||0,tot=spellCd(k);b.classList.toggle('ready',rem<=0&&G.started);b.classList.toggle('aim',G.aim===k);b.style.setProperty('--p',rem>0?(rem/tot*100).toFixed(1)+'%':'0%');b.lastChild.textContent=rem>0?Math.ceil(rem):''}$('hSup').textContent=fmt(G.sup);$('hLeft').textContent='🧟 '+(G.spawn.length+G.enemies.length);
 if(G.sup!==lastSup){lastSup=G.sup;refreshBar();if(selUnit)showPanel()}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(G&&bg){if(!G.paused){for(let i=0;i<G.speed;i++)update(dt);if(!G.over&&G.started){G.saveT=(G.saveT||0)+dt;if(G.saveT>2){G.saveT=0;saveBattle(6000)}}}render();hud()}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function flushNow(){if(G&&!G.over)saveBattle(6000);if(cloudTimer){clearTimeout(cloudTimer);cloudTimer=null}flushCloud()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushNow()});window.addEventListener('pagehide',flushNow);

/* ---------- LOBBY ---------- */
let tab='units';
function showLobby(){$('battle').classList.remove('on');$('lobby').classList.add('on');renderLobby()}
function mapPreview(M){const cv=document.createElement('canvas');cv.width=232;cv.height=232*1.5;cv.style.aspectRatio='2/3';const c=cv.getContext('2d');c.scale(232/W,232/W);
 c.fillStyle=M.t.ground;c.fillRect(0,0,W,H);const g=c.createRadialGradient(520,60,10,520,60,500);g.addColorStop(0,`rgba(${M.t.tint},${M.t.ta*1.8})`);g.addColorStop(1,`rgba(${M.t.tint},0)`);c.fillStyle=g;c.fillRect(0,0,W,H);
 c.lineCap='round';c.lineJoin='round';for(const[w,col]of[[70,M.t.path[0]],[56,'#5a4632']]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();M.path.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()}
 const e=M.path[M.path.length-1];c.fillStyle='#3d3449';rr(c,e[0]-54,e[1]-36,108,72,6);glow(c,e[0]-70,e[1]-20,40,'255,140,30');return cv}
function renderLobby(){
 normStats();setMap(save.map);const P=mp();
 const nc=TROPHIES.filter(t=>!save.trophies[t.id]&&t.get(save.stats)>=t.goal).length;$('trophTab').innerHTML='Trophies'+(nc?`<span class="bdg">${nc}</span>`:'');
 const rc=$('resumeCard');if(battleSnap&&MAPS[battleSnap.map]){const b=battleSnap;rc.innerHTML=`<div class="rt"><b>⚔️ ${b.mode==='endless'?'Endless run':'Battle'} in progress</b><span>Wave ${b.wave} on ${MAPS[b.map].name} · 🏚️ ${b.lives} · ${b.units.length} monsters placed</span></div><button id="resumeGo">Resume ▶</button>`;rc.classList.add('on');$('resumeGo').onclick=resumeBattle}else{rc.classList.remove('on');rc.innerHTML=''}
 const S=save.stats;$('lStats').innerHTML=`<div><b>${S.kills.toLocaleString()}</b>Zombies</div><div><b>${S.won}</b>Waves won</div><div><b>${S.lost}</b>Defeats</div><div><b>${S.best}</b>Best wave</div>`;setStatus(cloudState);
 const EN=save.mode==='endless';document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x.dataset.mode===save.mode));
 $('lMedals').textContent=save.medals;$('lWave').textContent=EN?'Endless':'Wave '+P.wave;$('lMap').textContent=(EN?'Endless night · ':'Next night · ')+MAP.name;$('deployBtn').textContent=EN?'Start endless run ♾️':'Defend the manor ▶';
 const mw=$('maps');mw.innerHTML='';for(const id of MAPORDER){const M=MAPS[id],st=save.maps[id]||{wave:1,best:0};const el=document.createElement('button');el.className='mcard'+(id===save.map?' on':'');
  el.appendChild(mapPreview(M));el.insertAdjacentHTML('beforeend',`<div class="mn">${M.name}</div><div class="md" style="color:${M.dc}">${M.diff}</div><div class="mw">${save.mode==='endless'?'Best ♾️ '+((save.endless||{})[id]||0):'Wave '+st.wave} · 🍬×${M.reward}</div>`);
  el.onclick=()=>{save.map=id;persist();renderLobby()};mw.appendChild(el)}
 const c=waveComp(P.wave);$('lIntel').innerHTML=Object.entries(c).map(([k,v])=>`<span class="chip${ENEMIES[k].air?' air':''}${k==='king'||k==='dragon'?' boss':''}">${ENEMIES[k].name} ×${v}${ENEMIES[k].air?' 🪽':''}</span>`).join('');
 if(EN){$('lIntel').innerHTML=`<span class="chip">Starts easy</span><span class="chip">Gets super hard</span><span class="chip boss">Boss every 10 waves</span><span class="chip">Monsters stay between waves</span>`;
  $('lBest').textContent=`Best endless wave on this map: ${save.endless[save.map]||0} · Candy is paid when the run ends`}
 else $('lBest').textContent=(P.best?`Best wave on this map: ${P.best}`:'Your first monster: the Skeleton. Earn candy to recruit more.')+` · Zombies ${MAP.hp<1?'weaker':MAP.hp>1?'+'+Math.round((MAP.hp-1)*100)+'% tougher':'normal'}`;
 const shop=$('shop');shop.innerHTML='';
 if(tab==='units'){for(const k of ORDER){const d=UNITS[k],own=!!save.unlocked[k];const card=document.createElement('div');card.className='card'+(own?'':' locked')+(k==='horseman'?' best1':'');card.appendChild(iconCanvas(k,58));
   card.insertAdjacentHTML('beforeend',`<div class="info"><div class="nm h">${d.name}${k==='horseman'?' 👑':''}</div><div class="ds">${d.desc}</div><div class="stats">${d.kind==='farm'?`<span>GROWS <b>🎃${d.dmg}</b> every <b>${d.rate}s</b></span>`:`<span>DMG <b>${d.dmg}</b></span><span>RNG <b>${d.range}</b></span><span>SPD <b>${(1/d.rate).toFixed(1)}/s</b></span>`}<span>COST <b>🎃${uc(k)}</b></span></div></div>`);
   const b=document.createElement('button');b.className='buy h'+(own?' owned':'');
   if(own)b.textContent='Ready';else{b.textContent='🍬 '+d.unlock;b.disabled=save.medals<d.unlock;b.onclick=()=>{if(save.medals<d.unlock)return;save.medals-=d.unlock;save.unlocked[k]=true;persist();renderLobby()}}
   card.appendChild(b);shop.appendChild(card)}}
 else if(tab==='spells'){for(const k of SPORDER){const sp=SPELLS[k],L=save.spells[k]||0,max=L>=5,cost=spCost(k,L);const card=document.createElement('div');card.className='card'+(L?'':' locked');
   card.innerHTML=`<div style="width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;background:#2a1f36;border-radius:50%;border:2px solid ${L?'#ff8a1f':'#3e2f4f'}">${sp.icon}</div><div class="info"><div class="nm h">${sp.name}</div><div class="ds">${sp.desc}</div><div class="stats"><span>${L?'LEVEL <b>'+L+'/5</b>':'LOCKED'}</span><span><b>${sp.info(Math.max(1,L))}</b></span><span>RECHARGE <b>${Math.round(sp.cd*(1-.08*lv('spellcd')))}s</b></span></div></div>`;
   const b=document.createElement('button');b.className='buy h'+(max?' owned':'');if(max)b.textContent='MAX';else{b.innerHTML=(L?'Upgrade<br>':'')+'🍬 '+cost;b.disabled=save.medals<cost;b.onclick=()=>{if(save.medals<cost)return;save.medals-=cost;save.spells[k]=L+1;persist();renderLobby()}}
   card.appendChild(b);shop.appendChild(card)}
  shop.insertAdjacentHTML('afterbegin','<div class="ds" style="color:var(--muted);font-size:13px;padding:0 4px">Spells appear as round buttons on the right side of the battle screen once you unlock them.</div>')}
 else if(tab==='troph'){const S=save.stats;const list=TROPHIES.map(t=>({t,cur:Math.min(t.goal,t.get(S)),done:!!save.trophies[t.id]})).sort((a,b)=>(a.done-b.done)||((b.cur>=b.t.goal)-(a.cur>=a.t.goal)));
  for(const{t,cur,done}of list){const ready=!done&&cur>=t.goal;const card=document.createElement('div');card.className='card'+(ready?' claim':'')+(done?' done':'');
   card.innerHTML=`<div style="width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;background:#2a1f36;border-radius:10px;${cur>=t.goal?'':'filter:grayscale(1)'}">${t.icon}</div><div class="info"><div class="nm h">${t.name}</div><div class="ds">${t.desc}</div><div class="stats"><span>${cur.toLocaleString()} / ${t.goal.toLocaleString()}</span><span>REWARD <b>🍬${t.r}</b></span></div><div class="prog"><i style="width:${cur/t.goal*100}%"></i></div></div>`;
   const b=document.createElement('button');b.className='buy h'+(done?' owned':'');if(done)b.textContent='✓ Claimed';else{b.textContent=ready?'Claim 🍬':'Locked';b.disabled=!ready;b.onclick=()=>{if(save.trophies[t.id]||t.get(save.stats)<t.goal)return;save.trophies[t.id]=true;save.medals+=t.r;persist();renderLobby()}}
   card.appendChild(b);shop.appendChild(card)}}
 else{for(const k in UPG){const u=UPG[k],l=lv(k),max=l>=u.max,cost=u.cost(l);const card=document.createElement('div');card.className='card';
   card.innerHTML=`<div style="width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;background:#2a1f36;border-radius:10px">${u.icon}</div><div class="info"><div class="nm h">${u.name}</div><div class="ds">${u.desc}</div><div class="stats"><span>LEVEL <b>${l}/${u.max}</b></span></div></div>`;
   const b=document.createElement('button');b.className='buy h'+(max?' owned':'');if(max)b.textContent='MAX';else{b.textContent='🍬 '+cost;b.disabled=save.medals<cost;b.onclick=()=>{if(save.medals<cost)return;save.medals-=cost;save[k]=lv(k)+1;persist();renderLobby()}}
   card.appendChild(b);shop.appendChild(card)}}
}
document.querySelectorAll('.mode').forEach(m=>m.onclick=()=>{save.mode=m.dataset.mode;persist();renderLobby()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));renderLobby()});
$('deployBtn').onclick=()=>startBattle();
$('resetBtn').onclick=function(){if(this.dataset.arm){save=JSON.parse(JSON.stringify(DEF));save.stats=null;normStats();battleSnap=null;storeBattle();persist();this.textContent='Reset all progress';delete this.dataset.arm;renderLobby()}else{this.dataset.arm=1;this.textContent='Tap again to confirm reset';setTimeout(()=>{delete this.dataset.arm;this.textContent='Reset all progress'},3000)}};
setMap(save.map);
setTimeout(initCloud,0);
if(document.fonts)document.fonts.ready.then(renderLobby);
renderLobby();
})();
