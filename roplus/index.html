<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoPlus</title>
<meta name="theme-color" content="#0b0e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e1c; --bg2:#131733; --card:#1c2142; --text:#f9f9f9; --muted:#cacaca;
  --accent:#0a84ff; --accent2:#00d1ff; --glow:rgba(0,170,255,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body{background:radial-gradient(ellipse at top,#1b2150 0%,#0b0e1c 55%) fixed}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{display:none}

/* ---------- STARTUP ANIMATION ---------- */
#intro{position:fixed;inset:0;z-index:999;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,#14204f 0%,#060814 70%);transition:opacity .8s ease}
#intro.hide{opacity:0;pointer-events:none}
.intro-stage{position:relative;width:min(560px,86vw);aspect-ratio:2/1}
.intro-stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc{fill:none;stroke:url(#arcGrad);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:1000;stroke-dashoffset:1000;filter:drop-shadow(0 0 10px #4fc3ff) drop-shadow(0 0 26px #1e88ff);
  animation:drawArc 1.6s cubic-bezier(.6,.05,.3,1) .3s forwards}
.spark{fill:#fff;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #5ad1ff);opacity:0;
  offset-path:path("M 40 250 Q 280 -60 520 250");animation:fly 1.6s cubic-bezier(.6,.05,.3,1) .3s forwards}
@keyframes drawArc{to{stroke-dashoffset:0}}
@keyframes fly{0%{offset-distance:0%;opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.intro-logo{position:absolute;left:0;right:0;top:46%;text-align:center;opacity:0;transform:scale(.85);
  animation:logoIn 1s ease 1.2s forwards}
@keyframes logoIn{to{opacity:1;transform:scale(1)}}
.intro-logo .wm{font-size:clamp(54px,12vw,104px)}
.intro-flash{position:absolute;inset:-40%;background:radial-gradient(circle,rgba(120,200,255,.35),transparent 60%);
  opacity:0;animation:flash 1.2s ease 1.7s forwards}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
#skipIntro{position:absolute;bottom:28px;right:28px;background:none;border:1px solid #ffffff44;color:#fff;
  padding:8px 16px;border-radius:6px;font-size:13px;letter-spacing:1px;opacity:.7}

/* ---------- WORDMARK ---------- */
.wm{font-family:Poppins,sans-serif;font-weight:800;letter-spacing:-1px;line-height:1;
  background:linear-gradient(180deg,#ffffff 0%,#dbe9ff 55%,#9fc6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm .plus{background:linear-gradient(180deg,#7fe0ff,#1e7bff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(0,170,255,.7));margin-left:2px}

/* ---------- PROFILES ---------- */
#profiles{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:36px}
#profiles.show{display:flex}
#profiles h1{font-size:32px;font-weight:600}
.plist{display:flex;gap:34px;flex-wrap:wrap;justify-content:center}
.prof{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);background:none;border:none;font-size:16px}
.prof .av{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:56px;
  border:4px solid transparent;transition:.25s;box-shadow:0 10px 30px #0008}
.prof:hover .av,.prof:focus .av{border-color:#fff;transform:scale(1.06)}
.prof:hover,.prof:focus{color:#fff;outline:none}

/* ---------- NAV ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:50;height:72px;display:flex;align-items:center;gap:36px;
  padding:0 36px;transition:background .3s}
header.solid{background:var(--bg)}
header .wm{font-size:34px}
nav{display:flex;gap:28px;flex:1}
nav a{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  position:relative;padding:6px 0;color:#f9f9f9}
nav a svg{width:20px;height:20px}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:#f9f9f9;border-radius:2px;
  transform:scaleX(0);transform-origin:left;transition:transform .25s cubic-bezier(.25,.46,.45,.94)}
nav a:hover::after,nav a.active::after{transform:scaleX(1)}
.me{display:flex;align-items:center;gap:12px;font-size:14px;background:none;border:none;color:#fff}
.me .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px}

main{padding-top:72px}
.page{display:none}.page.show{display:block}

/* ---------- HERO CAROUSEL ---------- */
.hero{position:relative;margin:20px 0 0;height:min(36vw,440px);min-height:220px}
.hero-track{position:relative;height:100%}
.slide{position:absolute;top:0;height:100%;width:calc(100% - 128px);left:64px;border-radius:8px;overflow:hidden;
  box-shadow:0 26px 30px -10px #000c,0 16px 10px -10px #000c;opacity:0;transition:opacity .7s ease;cursor:pointer;border:4px solid transparent}
.slide.on{opacity:1;z-index:2}
.slide:hover{border-color:#f9f9f9cc}
.slide img{width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000d 0%,#0008 38%,transparent 70%)}
.slide .info{position:absolute;z-index:2;left:48px;bottom:44px;max-width:46%}
.slide .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent2);margin-bottom:10px;text-transform:uppercase}
.slide h2{font-family:Poppins;font-size:clamp(20px,3vw,40px);line-height:1.1;margin-bottom:12px;text-shadow:0 2px 12px #000}
.slide p{color:#ddd;font-size:15px;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:10px;border:none;border-radius:6px;padding:13px 26px;font-size:15px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;transition:.2s}
.btn.play{background:#f9f9f9;color:#000}.btn.play:hover{background:#c6c6c6}
.btn.ghost{background:#0009;color:#fff;border:1px solid #f9f9f9}.btn.ghost:hover{background:#f9f9f9;color:#000}
.btn.round{width:48px;height:48px;padding:0;justify-content:center;border-radius:50%;background:#0009;border:2px solid #fff;color:#fff;font-size:24px}
.hero-arrow{position:absolute;top:0;bottom:0;width:64px;z-index:3;background:none;border:none;color:#fff;font-size:42px;opacity:0;transition:.2s}
.hero:hover .hero-arrow{opacity:.85}
.hero-arrow.l{left:0}.hero-arrow.r{right:0}
.dots{position:absolute;bottom:14px;right:84px;z-index:3;display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff55;transition:.3s}
.dots i.on{background:#fff;width:22px;border-radius:4px}

/* ---------- CATEGORY TILES ---------- */
.brands{display:grid;grid-template-columns:repeat(6,1fr);gap:22px;padding:34px 64px 10px}
.brand{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:3px solid #f9f9f91a;
  background:linear-gradient(160deg,#30355a,#1a1d33);box-shadow:0 26px 30px -10px #000b,0 16px 10px -10px #000b;
  transition:all .25s cubic-bezier(.25,.46,.45,.94);display:grid;place-items:center;cursor:pointer}
.brand:hover,.brand:focus{transform:scale(1.05);border-color:#f9f9f9cc;box-shadow:0 40px 58px -16px #000d,0 30px 22px -10px #000b;outline:none}
.brand .bimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .4s;filter:brightness(.55)}
.brand:hover .bimg{opacity:1}
.brand span{position:relative;font-family:Poppins;font-weight:800;font-size:clamp(13px,1.6vw,22px);letter-spacing:.5px;text-align:center;text-shadow:0 2px 10px #000}
.brand small{display:block;font-size:.55em;letter-spacing:3px;opacity:.75;font-weight:600}

/* ---------- ROWS ---------- */
.row{padding:22px 0 6px}
.row h3{font-size:20px;font-weight:600;padding:0 64px 12px;display:flex;align-items:center;gap:12px}
.row h3 .see{font-size:13px;color:var(--muted);font-weight:500;opacity:0;transition:.2s}
.row:hover h3 .see{opacity:1}
.rowwrap{position:relative}
.track{display:flex;gap:20px;overflow-x:auto;scroll-behavior:smooth;padding:12px 64px 26px;scroll-snap-type:x mandatory;scroll-padding:0 64px}
.card{flex:0 0 calc((100vw - 128px - 80px)/5);scroll-snap-align:start;position:relative;border-radius:8px;overflow:hidden;
  aspect-ratio:16/9;background:var(--card);border:3px solid #f9f9f91a;box-shadow:0 26px 30px -10px #000b,0 16px 10px -10px #000b;
  transition:all .25s cubic-bezier(.25,.46,.45,.94);cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover,.card:focus{transform:scale(1.05);border-color:#f9f9f9cc;outline:none;z-index:2}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,#000e);
  font-size:13px;font-weight:600;opacity:0;transition:.25s;line-height:1.3}
.card .cap em{display:block;font-style:normal;font-weight:500;color:var(--muted);font-size:11px;margin-top:3px}
.card:hover .cap,.card:focus .cap{opacity:1}
.card .badge{position:absolute;top:8px;left:8px;background:var(--accent);font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:4px}
.track.tall .card{flex-basis:calc((100vw - 128px - 120px)/7);aspect-ratio:9/16}
.track.circles .card{flex:0 0 140px;aspect-ratio:1;border-radius:50%}
.track.circles .card .cap{opacity:1;background:none;text-align:center;bottom:-38px;padding:0}
.track.circles{padding-bottom:56px}
.track.circles .card{overflow:visible}
.track.circles .card img{border-radius:50%}
.rarrow{position:absolute;top:12px;bottom:26px;width:58px;z-index:5;border:none;background:linear-gradient(90deg,#0b0e1cee,transparent);color:#fff;font-size:36px;opacity:0;transition:.2s}
.rarrow.r{right:0;background:linear-gradient(270deg,#0b0e1cee,transparent)}
.rarrow.l{left:0}
.rowwrap:hover .rarrow{opacity:1}

/* ---------- GRID PAGES ---------- */
.gridpage{padding:30px 64px 60px}
.gridpage h2{font-family:Poppins;font-size:32px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.grid .card{flex:none;width:auto}
.search{width:100%;background:#4b4e5a;border:none;color:#fff;font-size:clamp(20px,3vw,36px);padding:24px 30px;margin-bottom:30px;border-radius:4px;font-family:inherit}
.search:focus{outline:none;background:#5a5d69}
.empty{color:var(--muted);font-size:17px;padding:30px 0}

/* ---------- CREATOR PAGE ---------- */
.cbanner{position:relative;height:min(42vw,480px);overflow:hidden}
.cbanner img{width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.55);transform:scale(1.05)}
.cbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,transparent 60%),linear-gradient(90deg,#0b0e1ccc,transparent 70%)}
.cinfo{position:absolute;z-index:2;left:64px;bottom:40px;display:flex;gap:28px;align-items:flex-end;right:64px}
.cinfo .cav{width:140px;height:140px;border-radius:50%;border:4px solid #fff;object-fit:cover;flex-shrink:0;box-shadow:0 0 40px var(--glow)}
.cinfo h1{font-family:Poppins;font-size:clamp(28px,5vw,60px);line-height:1}
.cinfo .meta{color:var(--muted);margin:8px 0 18px;font-size:15px}
.cbtns{display:flex;gap:14px;align-items:center}

/* ---------- PLAYER (Disney+ style) ---------- */
#player{position:fixed;inset:0;z-index:200;background:#000;display:none;user-select:none;-webkit-user-select:none}
#player.show{display:block}
#pv,#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#pshield{position:absolute;inset:0;z-index:2}
#player.basic #pshield,#player.basic .pbot{display:none}
.pui{position:absolute;inset:0;z-index:3;pointer-events:none;transition:opacity .35s}
.pui .ptop,.pui .pbot,.pui .pmenu{pointer-events:auto}
#player.idle{cursor:none}#player.idle .pui{opacity:0}#player.idle .pui *{pointer-events:none}
.ptop{position:absolute;top:0;left:0;right:0;padding:22px 30px 80px;background:linear-gradient(#000c,transparent)}
.ptitle{position:absolute;left:130px;right:130px;top:24px;text-align:center;pointer-events:none}
.ptitle b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px #000}
.ptitle span{color:var(--muted);font-size:14px}
.pbot{position:absolute;left:0;right:0;bottom:0;padding:100px 36px 22px;background:linear-gradient(transparent,#000e)}
.pbar{display:flex;align-items:center;gap:20px}
.scrub{flex:1;height:26px;position:relative;cursor:pointer;display:flex;align-items:center;touch-action:none}
.scrub .rail{position:absolute;left:0;right:0;height:4px;background:#ffffff3a;border-radius:3px;overflow:hidden;transition:height .15s}
.scrub:hover .rail,.scrub.drag .rail{height:7px}
.scrub .rail i{position:absolute;left:0;top:0;bottom:0;width:0}
.scrub .buf{background:#ffffff55}.scrub .fill{background:linear-gradient(90deg,#2f8bff,#7fe3ff,#fff)}
.scrub .knob{position:absolute;left:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #ffffff30,0 0 14px #4fc3ff;transform:scale(.8);transition:transform .15s}
.scrub:hover .knob,.scrub.drag .knob{transform:scale(1)}
.scrub .tip{position:absolute;bottom:30px;transform:translateX(-50%);background:#000d;border:1px solid #ffffff33;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:600;display:none;white-space:nowrap}
.scrub:hover .tip,.scrub.drag .tip{display:block}
.ptime{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.pctrl{display:flex;align-items:center;gap:6px;margin-top:12px}
.pctrl .grow{flex:1}
.pb{background:none;border:none;color:#fff;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;opacity:.9;transition:.15s;flex-shrink:0}
.pb:hover,.pb:focus-visible{background:#ffffff1f;opacity:1;transform:scale(1.08);outline:none}
.pb svg{width:32px;height:32px}
.pb.wide{width:auto;border-radius:8px;padding:0 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:1.5px}
.pb.wide svg{width:24px;height:24px}
.volwrap{display:flex;align-items:center}
.vol{width:0;opacity:0;transition:.2s;accent-color:#fff;cursor:pointer}
.volwrap:hover .vol,.vol:focus{width:100px;opacity:1;margin:0 10px}
.pflash{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;border-radius:50%;background:#0009;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:4;font-family:Poppins;font-weight:800;font-size:26px}
.pflash svg{width:52px;height:52px}
.pflash.go{animation:pf .65s ease}
@keyframes pf{0%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
.pspin{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px;border-radius:50%;border:5px solid #ffffff1c;border-top-color:#2f8bff;border-right-color:#7fe3ff;animation:spin .9s linear infinite;z-index:4;display:none;pointer-events:none}
#player.loading .pspin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.pmenu{position:absolute;right:36px;bottom:120px;background:#131733f5;border:1px solid #ffffff22;border-radius:12px;padding:12px 0;min-width:240px;display:none;box-shadow:0 20px 50px #000b}
.pmenu.show{display:block}
.pmenu h4{font-size:11px;letter-spacing:2.4px;color:var(--muted);padding:10px 22px 6px}
.pmenu button{display:block;width:100%;background:none;border:none;color:#ddd;padding:10px 22px 10px 46px;font-size:15px;text-align:left;position:relative}
.pmenu button:hover{background:#ffffff14;color:#fff}
.pmenu button.on{color:#fff;font-weight:700}.pmenu button.on::before{content:"✓";position:absolute;left:20px;color:var(--accent2)}
.upnext{position:absolute;z-index:5;right:36px;bottom:140px;width:min(380px,82vw);background:#0b0e1cf2;border:2px solid #ffffff2a;border-radius:12px;overflow:hidden;display:none;box-shadow:0 20px 50px #000c;animation:upin .4s ease}
.upnext.show{display:block}
@keyframes upin{from{opacity:0;transform:translateY(20px)}}
.upnext img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.uinfo{padding:14px 16px 16px}
.uinfo small{color:var(--accent2);font-weight:800;letter-spacing:2px;font-size:11px}
.uinfo b{display:block;margin:6px 0 2px;font-size:15px;line-height:1.3}
.uinfo em{font-style:normal;color:var(--muted);font-size:13px}
.ubtns{display:flex;gap:10px;margin-top:12px}
.btn.sm{padding:9px 16px;font-size:12px}

/* ---------- DETAILS PAGE ---------- */
.dhero{position:relative;min-height:calc(100vh - 72px);display:flex;align-items:flex-end;margin-top:-72px;padding-top:72px;overflow:hidden}
.dbd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;animation:dzoom 18s ease-out forwards}
@keyframes dzoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0e1cf5 0%,#0b0e1cb0 38%,transparent 78%),linear-gradient(0deg,var(--bg) 0%,transparent 48%)}
.dcontent{position:relative;z-index:2;padding:0 64px 46px;max-width:780px;animation:upin .6s ease}
.dcreator{display:inline-flex;align-items:center;gap:12px;font-family:Poppins;font-weight:700;font-size:22px;margin-bottom:16px}
.dcreator img{width:48px;height:48px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.dtitle{font-family:Poppins;font-size:clamp(28px,4.4vw,58px);line-height:1.05;margin-bottom:16px;text-shadow:0 4px 20px #000}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:#ddd;font-size:15px;margin-bottom:26px}
.chip{border:1px solid #ddd;border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.5px}
.dbtns{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn.big{padding:16px 36px;font-size:16px}
.btn.round svg{width:22px;height:22px}
.btn.round.on{background:#f9f9f9;color:#000}
.dprog{margin-top:20px;width:280px;max-width:100%;height:4px;background:#ffffff44;border-radius:2px}
.dprog i{display:block;height:100%;background:#fff;border-radius:2px}
.dleft{font-size:13px;color:var(--muted);margin-top:7px}
.ddesc{margin-top:20px;color:#e5e5e5;font-size:17px;line-height:1.55;max-width:640px}
.tabs{display:flex;gap:44px;margin:6px 64px 0;border-bottom:2px solid #ffffff2a;overflow-x:auto}
.tabs button{background:none;border:none;color:#aaa;font-size:15px;font-weight:700;letter-spacing:1.8px;padding:16px 0;position:relative;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff}.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;background:#fff;border-radius:2px}
.tabpane{display:none;padding:28px 64px 40px}.tabpane.show{display:block}
.dinfo{display:grid;grid-template-columns:1.4fr 1fr;gap:50px}
.dinfo h4{font-size:22px;margin-bottom:12px}.dinfo p{color:#ddd;line-height:1.6}
.dinfo dt{color:var(--muted);font-size:14px;margin-top:16px}.dinfo dd{font-size:16px;margin-top:3px}

/* ---------- EXTRAS: progress, top 10 ---------- */
.card .prog{position:absolute;left:10px;right:10px;bottom:8px;height:4px;background:#ffffff40;border-radius:2px;z-index:1}
.card .prog i{display:block;height:100%;background:#fff;border-radius:2px}
.track.top10{gap:30px}
.t10{flex:0 0 calc((100vw - 128px - 90px)/4);display:flex;align-items:center;scroll-snap-align:start}
.t10 b{font-family:Poppins;font-weight:800;font-size:clamp(80px,10vw,160px);line-height:.8;color:var(--bg);-webkit-text-stroke:3px #9fc6ff;margin-right:-.14em;letter-spacing:-.06em;filter:drop-shadow(0 0 18px #0a84ff66);flex-shrink:0}
.t10 .card{flex:1 1 auto;min-width:0}

/* toast */
#toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,80px);background:#f9f9f9;color:#000;font-weight:600;padding:12px 22px;border-radius:6px;z-index:300;transition:.3s}
#toast.show{transform:translate(-50%,0)}

footer{padding:40px 64px 50px;color:#888;font-size:12px;text-align:center}
footer .wm{font-size:28px;display:inline-block;margin-bottom:10px}

@media (max-width:900px){
  header{padding:0 16px;gap:16px} nav a span{display:none} nav{gap:20px}
  .slide{width:calc(100% - 32px);left:16px}.slide .info{left:20px;bottom:20px;max-width:80%}.slide p{display:none}
  .brands{grid-template-columns:repeat(3,1fr);padding:24px 16px 0;gap:12px}
  .row h3{padding:0 16px 8px}.track{padding:10px 16px 20px;gap:12px;scroll-padding:0 16px}
  .card{flex-basis:calc((100vw - 44px)/2.2)}.track.tall .card{flex-basis:calc((100vw - 44px)/3.3)}
  .gridpage{padding:20px 16px}.cinfo{left:16px;right:16px}.cinfo .cav{width:90px;height:90px}
  .me span{display:none}.hero-arrow{display:none}.dots{right:30px}
  .dcontent{padding:0 16px 30px}.tabs{margin:0 16px;gap:26px}.tabpane{padding:20px 16px}.dinfo{grid-template-columns:1fr;gap:10px}
  .t10{flex-basis:calc((100vw - 44px)/1.5)}
  .pbot{padding:70px 14px 12px}.ptop{padding:14px 14px 60px}.ptitle{left:70px;right:20px;top:18px}.ptitle b{font-size:15px}
  .pb{width:44px;height:44px}.pb svg{width:26px;height:26px}.pb.wide span{display:none}.volwrap .vol{display:none}
  .upnext{right:14px;bottom:110px}.pmenu{right:14px;bottom:100px}
}
</style>
</head>
<body>

<!-- STARTUP ANIMATION -->
<div id="intro">
  <div class="intro-stage">
    <svg viewBox="0 0 560 280">
      <defs>
        <linearGradient id="arcGrad" x1="0" x2="1">
          <stop offset="0" stop-color="#1e5bff" stop-opacity="0"/>
          <stop offset=".25" stop-color="#2f8bff"/>
          <stop offset=".7" stop-color="#7fe3ff"/>
          <stop offset="1" stop-color="#ffffff"/>
        </linearGradient>
      </defs>
      <path class="arc" d="M 40 250 Q 280 -60 520 250"/>
      <circle class="spark" r="7"/>
    </svg>
    <div class="intro-flash"></div>
    <div class="intro-logo"><div class="wm">RoPlus<span class="plus">+</span></div></div>
  </div>
  <button id="skipIntro">SKIP</button>
</div>

<!-- WHO'S WATCHING -->
<div id="profiles">
  <h1>Who's watching?</h1>
  <div class="plist" id="plist"></div>
</div>

<header id="hdr">
  <a href="#home" class="wm">RoPlus<span class="plus">+</span></a>
  <nav>
    <a href="#home" data-p="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg><span>Home</span></a>
    <a href="#search" data-p="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search</span></a>
    <a href="#watchlist" data-p="watchlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg><span>Watchlist</span></a>
    <a href="#creators" data-p="creators"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg><span>Creators</span></a>
    <a href="#shorts" data-p="shorts"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="2" width="12" height="20" rx="3"/></svg><span>Shorts</span></a>
  </nav>
  <button class="me" id="meBtn"><span id="meName"></span><div class="av" id="meAv"></div></button>
</header>

<main>
  <section class="page" id="p-home">
    <div class="hero" id="hero">
      <div class="hero-track" id="heroTrack"></div>
      <button class="hero-arrow l" id="hL">‹</button><button class="hero-arrow r" id="hR">›</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="brands" id="brands"></div>
    <div id="rows"></div>
  </section>

  <section class="page" id="p-search"><div class="gridpage">
    <input class="search" id="q" placeholder="Search by creator, video or game" autocomplete="off">
    <div class="grid" id="sres"></div>
  </div></section>

  <section class="page" id="p-watchlist"><div class="gridpage"><h2>Watchlist</h2><div class="grid" id="wl"></div></div></section>
  <section class="page" id="p-creators"><div class="gridpage"><h2>Creators</h2><div class="grid" id="clist"></div></div></section>
  <section class="page" id="p-shorts"><div class="gridpage"><h2>Shorts</h2><div class="grid" id="slist" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))"></div></div></section>
  <section class="page" id="p-category"><div class="gridpage"><h2 id="catTitle"></h2><div class="grid" id="catGrid"></div></div></section>
  <section class="page" id="p-creator"><div id="cpage"></div></section>
  <section class="page" id="p-details"><div id="dpage"></div></section>

  <footer><div class="wm">RoPlus<span class="plus">+</span></div><br>Videos play from YouTube and belong to their creators.</footer>
</main>

<div id="player">
  <div id="pv"></div>
  <div id="pshield"></div>
  <div class="pspin"></div>
  <div class="pflash" id="pflash"></div>
  <div class="upnext" id="upnext"></div>
  <div class="pui">
    <div class="ptop">
      <button class="pb" id="pBack" title="Back (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></button>
      <div class="ptitle"><b id="pTitle"></b><span id="pSub"></span></div>
    </div>
    <div class="pmenu" id="pmenu"></div>
    <div class="pbot">
      <div class="pbar">
        <div class="scrub" id="scrub"><div class="rail"><i class="buf" id="sBuf"></i><i class="fill" id="sFill"></i></div><div class="knob" id="sKnob"></div><div class="tip" id="sTip">0:00</div></div>
        <div class="ptime" id="pTime">0:00</div>
      </div>
      <div class="pctrl">
        <button class="pb" id="bPlay" title="Play / Pause (Space)"></button>
        <button class="pb" id="bBack10" title="Back 10 seconds (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 3.5v4h4"/><text x="12.3" y="15.6" font-size="7.4" text-anchor="middle" fill="currentColor" stroke="none" font-weight="800" font-family="Inter,sans-serif">10</text></svg></button>
        <button class="pb" id="bFwd10" title="Forward 10 seconds (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 3.5v4h-4"/><text x="11.7" y="15.6" font-size="7.4" text-anchor="middle" fill="currentColor" stroke="none" font-weight="800" font-family="Inter,sans-serif">10</text></svg></button>
        <div class="volwrap"><button class="pb" id="bMute" title="Mute (M)"></button><input type="range" class="vol" id="vol" min="0" max="100" value="100" aria-label="Volume"></div>
        <div class="grow"></div>
        <button class="pb wide" id="bNext" title="Next video (N)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l10 7-10 7z"/><rect x="16.5" y="5" width="2.5" height="14" rx="1"/></svg><span>NEXT VIDEO</span></button>
        <button class="pb" id="bSet" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="pb" id="bFull" title="Full screen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb=(id,q='mqdefault')=>`https://i.ytimg.com/vi/${id}/${q}.jpg`;
const fmtViews=n=>!n?'':n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M views':n>=1e3?Math.round(n/1e3)+'K views':n+' views';
const ago=d=>{const s=(Date.now()-new Date(d))/1000,u=[[31536e3,'year'],[2592e3,'month'],[604800,'week'],[86400,'day'],[3600,'hour']];
  for(const[k,n]of u){if(s>=k){const v=Math.floor(s/k);return v+' '+n+(v>1?'s':'')+' ago'}}return 'just now'};
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('roplus_'+k))??d}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem('roplus_'+k,JSON.stringify(v))}catch(e){}}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}

/* ---------- intro ---------- */
let introDone=false;
function endIntro(){if(introDone)return;introDone=true;$('#intro').classList.add('hide');setTimeout(()=>$('#intro').remove(),900);showProfiles()}
setTimeout(endIntro,3300);$('#skipIntro').onclick=endIntro;

/* ---------- profiles ---------- */
const PROFILES=[{n:'Player 1',e:'🎮',c:'linear-gradient(135deg,#2f8bff,#00d1ff)'},{n:'Player 2',e:'🐶',c:'linear-gradient(135deg,#ff6a3d,#ffb23d)'},
  {n:'Player 3',e:'👾',c:'linear-gradient(135deg,#8e2de2,#ff4ecd)'},{n:'Kids',e:'⭐',c:'linear-gradient(135deg,#11998e,#38ef7d)'}];
let me=null;
function showProfiles(){
  $('#plist').innerHTML=PROFILES.map((p,i)=>`<button class="prof" data-i="${i}"><div class="av" style="background:${p.c}">${p.e}</div>${p.n}</button>`).join('');
  $('#profiles').classList.add('show');
  document.querySelectorAll('.prof').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('.prof')?.focus();
}
function pick(i){me=i;const p=PROFILES[i];$('#meName').textContent=p.n;$('#meAv').textContent=p.e;$('#meAv').style.background=p.c;
  $('#profiles').classList.remove('show');route()}
$('#meBtn').onclick=showProfiles;
const wlKey=()=>'wl'+me, histKey=()=>'hist'+me;
const getWL=()=>store.get(wlKey(),[]), getHist=()=>store.get(histKey(),[]);
const getProg=()=>store.get('prog'+me,{}), getLikes=()=>store.get('likes'+me,[]);

/* ---------- data ---------- */
let DATA=[],ALL=[],BYID={};
const CATS=[
  {k:'Minecraft',label:'MINECRAFT',sub:'BLOCK WORLDS',g:'linear-gradient(160deg,#3f8f3a,#1d3b1a)'},
  {k:'Fortnite',label:'FORTNITE',sub:'BATTLE ROYALE',g:'linear-gradient(160deg,#6a3df0,#24135a)'},
  {k:'Roblox',label:'ROBLOX',sub:'OBBYS & MORE',g:'linear-gradient(160deg,#e03c3c,#4a1212)'},
  {k:'Horror',label:'HORROR',sub:'JUMP SCARES',g:'linear-gradient(160deg,#5a1a1a,#0d0606)'},
  {k:'Variety',label:'VARIETY',sub:'ALL GAMES',g:'linear-gradient(160deg,#ff9a1f,#5a2c00)'},
  {k:'Music',label:'MUSIC',sub:'GAME SOUNDS',g:'linear-gradient(160deg,#1fb5ff,#08304a)'}];

fetch('../blockfix/videos.json?'+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d.creators.filter(c=>c.videos&&c.videos.length);
  DATA.forEach(c=>c.videos.forEach(v=>{v.creator=c.name;v.cid=c.id;v.game=c.game;ALL.push(v);BYID[v.id]=v}));
  ALL.sort((a,b)=>new Date(b.published)-new Date(a.published));
  buildHome();if(me!==null)route();
}).catch(()=>{$('#rows').innerHTML='<p class="empty" style="padding:40px 64px">Couldn\'t load videos right now. Try refreshing.</p>'});

const long=v=>!v.short;
function card(v,opts={}){
  const tall=v.short&&opts.tall;
  const attr=(opts.play||v.short)?'data-play':'data-v';
  const pr=opts.prog?getProg()[v.id]:null,pct=pr&&pr.d?Math.min(100,pr.t/pr.d*100):0;
  return `<div class="card" tabindex="0" ${attr}="${v.id}">${pct>1?`<div class="prog"><i style="width:${pct}%"></i></div>`:''}
    <img loading="lazy" src="${thumb(v.id,tall?'hqdefault':'mqdefault')}" alt="" ${tall?'style="object-fit:cover"':''}>
    ${opts.badge?`<div class="badge">${opts.badge}</div>`:''}
    <div class="cap">${esc(v.title)}<em>${esc(v.creator)} · ${fmtViews(v.views)}</em></div></div>`}
function shortCard(v){return `<div class="card" tabindex="0" data-play="${v.id}" style="aspect-ratio:9/16">
    <img loading="lazy" src="${thumb(v.id,'hqdefault')}" alt=""><div class="cap">${esc(v.title)}<em>${esc(v.creator)}</em></div></div>`}
function creatorCard(c){return `<div class="card" tabindex="0" data-c="${c.id}"><img loading="lazy" src="${esc(c.avatar||'')}" alt=""><div class="cap">${esc(c.name)}</div></div>`}

function row(title,items,opts={}){
  if(!items.length)return '';
  const id='r'+Math.random().toString(36).slice(2,8);
  return `<div class="row"><h3>${title}${opts.see?`<a class="see" href="${opts.see}">See all ›</a>`:''}</h3><div class="rowwrap">
    <button class="rarrow l" data-t="${id}" data-d="-1">‹</button>
    <div class="track ${opts.cls||''}" id="${id}">${items.join('')}</div>
    <button class="rarrow r" data-t="${id}" data-d="1">›</button></div></div>`}

function buildHome(){
  // hero: most viewed recent long videos, one per creator
  const seen=new Set(),heroV=[];
  [...ALL].filter(long).sort((a,b)=>(b.views||0)-(a.views||0)).forEach(v=>{if(!seen.has(v.creator)&&heroV.length<7){seen.add(v.creator);heroV.push(v)}});
  $('#heroTrack').innerHTML=heroV.map((v,i)=>`<div class="slide${i?'':' on'}" data-v="${v.id}">
    <img src="${thumb(v.id,'maxresdefault')}" onerror="this.src='${thumb(v.id,'hqdefault')}'" alt="">
    <div class="info"><div class="tag">${esc(v.creator)} · ${esc(v.game)}</div><h2>${esc(v.title)}</h2>
    <p>${fmtViews(v.views)} · ${ago(v.published)}</p>
    <button class="btn play" data-play="${v.id}">▶ Play</button> <button class="btn ghost" data-details="${v.id}">Details</button> <button class="btn round" data-wl="${v.id}" title="Watchlist">${getWL().includes(v.id)?'✓':'+'}</button></div></div>`).join('');
  $('#dots').innerHTML=heroV.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
  startHero(heroV.length);

  $('#brands').innerHTML=CATS.map(c=>{const ex=ALL.find(v=>v.game===c.k&&long(v));
    return `<div class="brand" tabindex="0" data-cat="${c.k}" style="background:${c.g}">
    ${ex?`<div class="bimg" style="background-image:url(${thumb(ex.id)})"></div>`:''}<span>${c.label}<small>${c.sub}</small></span></div>`}).join('');
  renderRows();
}
function renderRows(){
  const hist=getHist().map(id=>BYID[id]).filter(Boolean);
  const wl=getWL().map(id=>BYID[id]).filter(Boolean);
  const week=Date.now()-7*864e5;
  let h='';
  const prog=getProg();
  const cont=hist.filter(v=>{const p=prog[v.id];return !p||!p.d||p.t/p.d<.95});
  h+=row('Continue Watching',cont.slice(0,15).map(v=>card(v,{play:true,prog:true})));
  const top=[...ALL].filter(long).sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,10);
  h+=row('Top 10 on RoPlus Today',top.map((v,i)=>`<div class="t10"><b>${i+1}</b>${card(v)}</div>`),{cls:'top10'});
  h+=row('New on RoPlus',ALL.filter(long).slice(0,20).map(v=>card(v,{badge:new Date(v.published)>week?'NEW':''})));
  h+=row('Trending Now',[...ALL].filter(long).sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,20).map(v=>card(v)));
  h+=row('Popular Creators',DATA.map(creatorCard),{cls:'circles',see:'#creators'});
  h+=row('Shorts',ALL.filter(v=>v.short).slice(0,24).map(v=>card(v,{tall:true})),{cls:'tall',see:'#shorts'});
  h+=row('My Watchlist',wl.map(v=>card(v)),{see:'#watchlist'});
  if(hist[0]){const l=hist[0];h+=row('Because You Watched '+esc(l.title.length>42?l.title.slice(0,40)+'…':l.title),
    ALL.filter(v=>long(v)&&v.game===l.game&&v.id!==l.id&&v.cid!==l.cid).sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,20).map(v=>card(v)))}
  const likes=getLikes().map(id=>BYID[id]).filter(Boolean);
  h+=row('Videos You Liked',likes.map(v=>card(v)));
  h+=row('Hidden Gems',ALL.filter(v=>long(v)&&v.views&&v.views<400000).slice(0,20).map(v=>card(v)));
  CATS.forEach(c=>h+=row(c.k==='Music'?'Game Music':c.k==='Variety'?'Variety Gaming':c.k+' Hits',
    ALL.filter(v=>v.game===c.k&&long(v)).slice(0,20).map(v=>card(v)),{see:'#cat/'+c.k}));
  DATA.slice(0,6).forEach(c=>h+=row('More from '+esc(c.name),c.videos.filter(long).map(v=>card(v)),{see:'#creator/'+c.id}));
  $('#rows').innerHTML=h;
}

let heroI=0,heroT;
function startHero(n){
  const go=i=>{const s=document.querySelectorAll('.slide'),d=document.querySelectorAll('.dots i');if(!s.length)return;
    s[heroI].classList.remove('on');d[heroI].classList.remove('on');heroI=(i+n)%n;s[heroI].classList.add('on');d[heroI].classList.add('on')};
  const auto=()=>{clearInterval(heroT);heroT=setInterval(()=>go(heroI+1),6000)};
  $('#hL').onclick=()=>{go(heroI-1);auto()};$('#hR').onclick=()=>{go(heroI+1);auto()};auto();
}

/* ---------- pages ---------- */
function show(p){document.querySelectorAll('.page').forEach(e=>e.classList.toggle('show',e.id==='p-'+p));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.p===p));window.scrollTo(0,0)}
function route(){
  if(me===null||!ALL.length&&location.hash!=='#search'){show('home');return}
  const [p,arg]=location.hash.slice(1).split('/');
  if(p==='search'){show('search');doSearch();setTimeout(()=>$('#q').focus(),50)}
  else if(p==='watchlist'){show('watchlist');const w=getWL().map(id=>BYID[id]).filter(Boolean);
    $('#wl').innerHTML=w.length?w.map(v=>card(v)).join(''):'<p class="empty">Your watchlist is empty. Press + on any video to add it.</p>'}
  else if(p==='creators'){show('creators');$('#clist').innerHTML=DATA.map(c=>`<div class="card" tabindex="0" data-c="${c.id}" style="aspect-ratio:1">
    <img loading="lazy" src="${esc(c.avatar||'')}" alt=""><div class="cap" style="opacity:1">${esc(c.name)}<em>${esc(c.game)}</em></div></div>`).join('')}
  else if(p==='shorts'){show('shorts');$('#slist').innerHTML=ALL.filter(v=>v.short).map(shortCard).join('')}
  else if(p==='video'){const v=BYID[arg];if(!v)return show('home');show('details');detailsPage(v)}
  else if(p==='cat'){const c=CATS.find(x=>x.k===decodeURIComponent(arg));if(!c)return show('home');show('category');
    $('#catTitle').textContent=c.label.charAt(0)+c.label.slice(1).toLowerCase();
    $('#catGrid').innerHTML=ALL.filter(v=>v.game===c.k&&long(v)).map(v=>card(v)).join('')}
  else if(p==='creator'){const c=DATA.find(x=>x.id===arg);if(!c)return show('home');show('creator');creatorPage(c)}
  else{show('home');renderRows()}
}
window.addEventListener('hashchange',route);

function creatorPage(c){
  const top=c.videos.filter(long)[0]||c.videos[0];
  $('#cpage').innerHTML=`<div class="cbanner"><img src="${thumb(top.id,'maxresdefault')}" onerror="this.src='${thumb(top.id,'hqdefault')}'" alt="">
    <div class="cinfo"><img class="cav" src="${esc(c.avatar||'')}" alt=""><div><h1>${esc(c.name)}</h1>
    <div class="meta">${esc(c.game)} · ${esc(c.desc||'')}</div>
    <div class="cbtns"><button class="btn play" data-play="${top.id}">▶ Play Latest</button>
    <a class="btn ghost" href="https://www.youtube.com/channel/${esc(c.id)}" target="_blank" rel="noopener">YouTube Channel</a></div></div></div></div>
    ${row('Videos',c.videos.filter(long).map(v=>card(v)))}
    ${row('Shorts',c.videos.filter(v=>v.short).map(v=>card(v,{tall:true})),{cls:'tall'})}`;
}

/* ---------- details page ---------- */
const SVG_LIKE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 10v11H3V10zM7 10l4-8a3 3 0 0 1 3 3v4h5.5a2 2 0 0 1 2 2.3l-1.3 8A2 2 0 0 1 18.2 21H7"/></svg>';
const SVG_SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>';
function detailsPage(v){
  const c=DATA.find(x=>x.id===v.cid)||{},pr=getProg()[v.id];
  const pct=pr&&pr.d?Math.min(100,pr.t/pr.d*100):0,resumable=pct>1&&pct<95;
  let sugg=ALL.filter(x=>long(x)&&x.game===v.game&&x.cid!==v.cid).sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,24);
  if(sugg.length<10)sugg=sugg.concat([...ALL].filter(x=>long(x)&&x.id!==v.id&&!sugg.includes(x)).sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,12));
  const more=(c.videos||[]).filter(x=>long(x)&&x.id!==v.id),shorts=(c.videos||[]).filter(x=>x.short);
  const isNew=Date.now()-new Date(v.published)<7*864e5,hq=thumb(v.id,'hqdefault');
  $('#dpage').innerHTML=`<div class="dhero">
    <img class="dbd" src="${thumb(v.id,'maxresdefault')}" onerror="this.src='${hq}'" onload="if(this.naturalWidth<200)this.src='${hq}'" alt="">
    <div class="dcontent">
      <a class="dcreator" href="#creator/${esc(v.cid)}"><img src="${esc(c.avatar||'')}" alt="">${esc(v.creator)}</a>
      <h1 class="dtitle">${esc(v.title)}</h1>
      <div class="dmeta"><span>${new Date(v.published).getFullYear()}</span>•<span>${esc(v.game)}</span>•<span>${fmtViews(v.views)}</span><span class="chip">HD</span>${isNew?'<span class="chip">NEW</span>':''}${v.views>5e6?'<span class="chip">POPULAR</span>':''}</div>
      <div class="dbtns">
        <button class="btn play big" data-play="${v.id}">▶ ${resumable?'Continue':'Play'}</button>
        ${shorts.length?`<button class="btn ghost big" data-play="${shorts[0].id}">Short</button>`:''}
        <button class="btn round" data-wl="${v.id}" title="Watchlist">${getWL().includes(v.id)?'✓':'+'}</button>
        <button class="btn round${getLikes().includes(v.id)?' on':''}" data-like="${v.id}" title="Like">${SVG_LIKE}</button>
        <button class="btn round" data-share="${v.id}" title="Copy link">${SVG_SHARE}</button>
      </div>
      ${resumable?`<div class="dprog"><i style="width:${pct}%"></i></div><div class="dleft">${fmtT(pr.d-pr.t)} left</div>`:''}
      <p class="ddesc">Released ${ago(v.published)} by ${esc(v.creator)}. ${esc(c.desc||'')}</p>
    </div></div>
    <div class="tabs"><button class="on" data-tab="0">SUGGESTED</button>${more.length?`<button data-tab="1">MORE FROM ${esc(v.creator.toUpperCase())}</button>`:''}${shorts.length?'<button data-tab="2">SHORTS</button>':''}<button data-tab="3">DETAILS</button></div>
    <div class="tabpane show" data-pane="0"><div class="grid">${sugg.map(x=>card(x)).join('')}</div></div>
    <div class="tabpane" data-pane="1"><div class="grid">${more.map(x=>card(x)).join('')}</div></div>
    <div class="tabpane" data-pane="2"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${shorts.map(shortCard).join('')}</div></div>
    <div class="tabpane" data-pane="3"><div class="dinfo">
      <div><h4>${esc(v.title)}</h4><p>${esc(c.desc||'')}</p></div>
      <dl><dt>Creator</dt><dd>${esc(v.creator)}</dd><dt>Game</dt><dd>${esc(v.game)}</dd>
      <dt>Released</dt><dd>${new Date(v.published).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</dd>
      <dt>Views</dt><dd>${(v.views||0).toLocaleString()}</dd>
      <dt>YouTube</dt><dd><a href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener" style="text-decoration:underline">Watch on YouTube</a></dd></dl>
    </div></div>`;
}

/* ---------- search ---------- */
function doSearch(){const q=$('#q').value.trim().toLowerCase();
  if(!q){$('#sres').innerHTML=DATA.map(c=>creatorCard(c).replace('class="card"','class="card" style="aspect-ratio:1"').replace('class="cap"','class="cap" style="opacity:1"')).join('');return}
  const cs=DATA.filter(c=>c.name.toLowerCase().includes(q)||c.game.toLowerCase().includes(q));
  const vs=ALL.filter(v=>long(v)&&(v.title.toLowerCase().includes(q)||v.creator.toLowerCase().includes(q)||v.game.toLowerCase().includes(q))).slice(0,60);
  $('#sres').innerHTML=cs.map(c=>creatorCard(c).replace('class="cap"','class="cap" style="opacity:1"')).join('')+vs.map(v=>card(v)).join('')
    ||`<p class="empty">No results for "${esc(q)}".</p>`}
$('#q').addEventListener('input',doSearch);

/* ---------- player ---------- */
const IC={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1"/><rect x="14" y="4.5" width="4.5" height="15" rx="1"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z" fill="currentColor"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>'};
const fmtT=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const P=$('#player');
let yt=null,ytReady=false,cur=null,tickT=null,idleT=null,upState=null,lastSave=0,dragging=false,rate=store.get('rate',1);
window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(cur&&P.classList.contains('show')&&!P.classList.contains('basic'))startVideo(cur.id)};
(()=>{const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc)})();
$('#bPlay').innerHTML=IC.play;
setTimeout(()=>updVol(),0);

function nextOf(v){
  const own=(DATA.find(c=>c.id===v.cid)?.videos||[]).filter(long),i=own.findIndex(x=>x.id===v.id);
  const watched=new Set(getHist());
  const cand=[...own.slice(i+1),...own.slice(0,Math.max(i,0)),...ALL.filter(x=>long(x)&&x.game===v.game&&x.cid!==v.cid)].filter(x=>x.id!==v.id);
  return cand.find(x=>!watched.has(x.id))||cand[0]||null;
}
function resumeAt(id){const p=getProg()[id];return p&&p.d&&p.t>10&&p.t<p.d*.95?p.t:0}
function play(id){
  const v=BYID[id];if(!v)return;cur=v;upState=null;
  $('#pTitle').textContent=v.title;$('#pSub').textContent=v.creator+' · '+v.game;
  P.classList.add('show','loading');P.classList.remove('idle');document.body.style.overflow='hidden';
  $('#upnext').classList.remove('show');$('#pmenu').classList.remove('show');setBar(0,0,0);
  const h=getHist().filter(x=>x!==id);h.unshift(id);store.set(histKey(),h.slice(0,30));
  if(P.classList.contains('basic')||(!ytReady&&window.YT_FAILED))return fallback(id);
  if(ytReady)startVideo(id);
  else setTimeout(()=>{if(cur===v&&!ytReady){window.YT_FAILED=true;fallback(id)}},7000);
  wake();
}
function startVideo(id){
  const start=Math.floor(resumeAt(id));
  if(!yt){yt=new YT.Player('pv',{videoId:id,host:'https://www.youtube-nocookie.com',
    playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,fs:0,disablekb:1,start},
    events:{onReady:e=>{e.target.setVolume(store.get('vol',100));store.get('muted',false)?e.target.mute():e.target.unMute();e.target.setPlaybackRate(rate);e.target.playVideo();updVol()},
      onStateChange:onState,
      onError:()=>{toast("This video can't play on RoPlus");closePlayer()}}})}
  else{yt.loadVideoById({videoId:id,startSeconds:start});yt.setPlaybackRate(rate)}
  clearInterval(tickT);tickT=setInterval(tick,250);
}
function fallback(id){P.classList.add('basic');P.classList.remove('loading');
  $('#pv').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1&start=${Math.floor(resumeAt(id))}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`}
const ytOK=()=>yt&&typeof yt.getDuration==='function';
function tick(){
  if(!ytOK()||!cur)return;
  const t=yt.getCurrentTime()||0,d=yt.getDuration()||0,b=yt.getVideoLoadedFraction?yt.getVideoLoadedFraction():0;
  if(!dragging)setBar(t,d,b);
  if(d>0&&t>0&&Date.now()-lastSave>4000){lastSave=Date.now();const p=getProg();p[cur.id]={t,d,at:Date.now()};
    const ks=Object.keys(p);if(ks.length>200)delete p[ks.sort((a,b)=>p[a].at-p[b].at)[0]];store.set('prog'+me,p)}
  const left=d-t;
  if(store.get('autonext',true)&&d>60&&left<12&&left>0&&upState!=='cancel'&&yt.getPlayerState()===1)showUpNext(Math.ceil(left));
  else if(left>=12&&upState==='shown'){upState=null;$('#upnext').classList.remove('show')}
}
function setBar(t,d,b){const f=d?Math.min(1,t/d):0;$('#sFill').style.width=f*100+'%';$('#sKnob').style.left=f*100+'%';
  $('#sBuf').style.width=(b||0)*100+'%';$('#pTime').textContent=d?fmtT(d-t):'0:00'}
function showUpNext(sec){const n=nextOf(cur);if(!n)return;upState='shown';const u=$('#upnext');
  if(u.dataset.id!==n.id){u.dataset.id=n.id;u.innerHTML=`<img src="${thumb(n.id)}" alt=""><div class="uinfo"><small>UP NEXT</small><b>${esc(n.title)}</b><em>${esc(n.creator)}</em>
    <div class="ubtns"><button class="btn play sm" data-up="go">▶ Play <span id="uCount"></span></button><button class="btn ghost sm" data-up="cancel">Cancel</button></div></div>`}
  u.classList.add('show');$('#uCount').textContent='in '+sec}
function onState(e){const st=e.data;
  if(st===1){P.classList.remove('loading');$('#bPlay').innerHTML=IC.pause;wake()}
  else if(st===2){$('#bPlay').innerHTML=IC.play;P.classList.remove('idle');clearTimeout(idleT)}
  else if(st===3){P.classList.add('loading')}
  else if(st===0){$('#bPlay').innerHTML=IC.play;P.classList.remove('loading','idle');
    if(cur){const p=getProg();p[cur.id]={t:1,d:1,at:Date.now()};store.set('prog'+me,p)}
    const n=cur&&nextOf(cur);if(n&&upState!=='cancel'&&store.get('autonext',true))play(n.id)}
}
function flash(html){const f=$('#pflash');f.innerHTML=html;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function togglePlay(){if(!ytOK())return;if(yt.getPlayerState()===1){yt.pauseVideo();flash(IC.pause)}else{yt.playVideo();flash(IC.play)}}
function seekBy(n){if(!ytOK())return;yt.seekTo(Math.max(0,yt.getCurrentTime()+n),true);flash((n>0?'+':'−')+Math.abs(n));wake()}
function setVol(v){if(!ytOK())return;v=Math.max(0,Math.min(100,v));yt.setVolume(v);store.set('vol',v);if(v>0){yt.unMute();store.set('muted',false)}updVol(v)}
function toggleMute(){if(!ytOK())return;if(yt.isMuted()||!yt.getVolume()){yt.unMute();if(!yt.getVolume())yt.setVolume(50);store.set('muted',false)}else{yt.mute();store.set('muted',true)}updVol()}
function updVol(v){const m=store.get('muted',false);v=v??store.get('vol',100);$('#bMute').innerHTML=m||!v?IC.mute:IC.vol;$('#vol').value=m?0:v}
function toggleFull(){document.fullscreenElement?document.exitFullscreen():(P.requestFullscreen||P.webkitRequestFullscreen||(()=>{})).call(P)}
function playNext(){const n=cur&&nextOf(cur);if(n)play(n.id)}
function renderMenu(){const r=[.5,.75,1,1.25,1.5,2];
  $('#pmenu').innerHTML=`<h4>PLAYBACK SPEED</h4>${r.map(x=>`<button data-rate="${x}" class="${x===rate?'on':''}">${x===1?'Normal':x+'×'}</button>`).join('')}
    <h4>AUTOPLAY</h4><button data-auto="1" class="${store.get('autonext',true)?'on':''}">Play next video automatically</button>`}
function wake(){P.classList.remove('idle');clearTimeout(idleT);
  idleT=setTimeout(()=>{if(ytOK()&&yt.getPlayerState()===1&&!$('#pmenu').classList.contains('show')&&!dragging)P.classList.add('idle')},3000)}
function closePlayer(){
  if(ytOK()&&cur){lastSave=0;tick();yt.stopVideo()}
  clearInterval(tickT);P.classList.remove('show','loading','idle');document.body.style.overflow='';
  if(P.classList.contains('basic'))$('#pv').innerHTML='';
  if(document.fullscreenElement)document.exitFullscreen();
  const hsh=location.hash;if(!hsh||hsh==='#home')renderRows();else if(hsh.startsWith('#video/'))route();
}
$('#pBack').onclick=closePlayer;$('#bPlay').onclick=togglePlay;$('#bBack10').onclick=()=>seekBy(-10);$('#bFwd10').onclick=()=>seekBy(10);
$('#bMute').onclick=toggleMute;$('#vol').oninput=e=>setVol(+e.target.value);$('#bFull').onclick=toggleFull;$('#bNext').onclick=playNext;
$('#bSet').onclick=e=>{e.stopPropagation();renderMenu();$('#pmenu').classList.toggle('show');wake()};
$('#pshield').onclick=()=>{if($('#pmenu').classList.contains('show')){$('#pmenu').classList.remove('show');return}togglePlay();wake()};
$('#pshield').ondblclick=toggleFull;
P.addEventListener('mousemove',wake);P.addEventListener('touchstart',wake,{passive:true});
// scrubber
const sc=$('#scrub');
const frac=e=>{const r=sc.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
const dur=()=>ytOK()?yt.getDuration()||0:0;
sc.addEventListener('pointermove',e=>{const f=frac(e);$('#sTip').style.left=f*100+'%';$('#sTip').textContent=fmtT(f*dur());
  if(dragging){$('#sFill').style.width=f*100+'%';$('#sKnob').style.left=f*100+'%'}});
sc.addEventListener('pointerdown',e=>{dragging=true;sc.classList.add('drag');sc.setPointerCapture(e.pointerId);const f=frac(e);$('#sFill').style.width=f*100+'%';$('#sKnob').style.left=f*100+'%'});
sc.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;sc.classList.remove('drag');if(ytOK())yt.seekTo(frac(e)*dur(),true);wake()});

function toggleWL(id){let w=getWL();const on=!w.includes(id);if(on){w.unshift(id);toast('Added to Watchlist')}else{w=w.filter(x=>x!==id);toast('Removed from Watchlist')}
  store.set(wlKey(),w);document.querySelectorAll(`[data-wl="${id}"]`).forEach(b=>b.textContent=on?'✓':'+')}
function toggleLike(id,btn){let l=getLikes();const on=!l.includes(id);l=on?[id,...l]:l.filter(x=>x!==id);store.set('likes'+me,l);btn.classList.toggle('on',on);toast(on?'Liked':'Like removed')}
function share(id){const url=location.href.split('#')[0]+'#video/'+id;
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Link copied!')).catch(()=>prompt('Copy this link:',url))}

/* ---------- clicks & keys ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const up=t.closest('[data-up]');if(up){if(up.dataset.up==='go')playNext();else{upState='cancel';$('#upnext').classList.remove('show')}return}
  const rt=t.closest('[data-rate]');if(rt){rate=+rt.dataset.rate;store.set('rate',rate);if(ytOK())yt.setPlaybackRate(rate);renderMenu();return}
  const au=t.closest('[data-auto]');if(au){store.set('autonext',!store.get('autonext',true));renderMenu();return}
  const wl=t.closest('[data-wl]');if(wl){e.stopPropagation();toggleWL(wl.dataset.wl);return}
  const lk=t.closest('[data-like]');if(lk){toggleLike(lk.dataset.like,lk);return}
  const sh=t.closest('[data-share]');if(sh){share(sh.dataset.share);return}
  const dt=t.closest('[data-details]');if(dt){e.stopPropagation();location.hash='video/'+dt.dataset.details;return}
  const tb=t.closest('[data-tab]');if(tb){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===tb));
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('show',p.dataset.pane===tb.dataset.tab));return}
  const pb=t.closest('[data-play]');if(pb){play(pb.dataset.play);return}
  const ar=t.closest('.rarrow');if(ar){const tr=document.getElementById(ar.dataset.t);tr.scrollBy({left:ar.dataset.d*tr.clientWidth*.9});return}
  const v=t.closest('[data-v]');if(v){location.hash='video/'+v.dataset.v;return}
  const c=t.closest('[data-c]');if(c){location.hash='creator/'+c.dataset.c;return}
  const b=t.closest('[data-cat]');if(b){location.hash='cat/'+b.dataset.cat;return}
});
document.addEventListener('keydown',e=>{
  const inInput=/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='range';
  if(P.classList.contains('show')){
    const k=e.key.toLowerCase(),acts={' ':togglePlay,k:togglePlay,arrowleft:()=>seekBy(-10),j:()=>seekBy(-10),arrowright:()=>seekBy(10),l:()=>seekBy(10),
      f:toggleFull,m:toggleMute,n:playNext,arrowup:()=>ytOK()&&setVol(yt.getVolume()+10),arrowdown:()=>ytOK()&&setVol(yt.getVolume()-10),escape:closePlayer,backspace:closePlayer};
    if(acts[k]&&!(k===' '&&document.activeElement.tagName==='BUTTON')){e.preventDefault();acts[k]();wake()}
    return}
  if(e.key==='Enter'&&document.activeElement.matches('.card,.brand')){document.activeElement.click()}
  if(e.key==='Backspace'&&!inInput&&location.hash&&location.hash!=='#home'){history.back()}
});
window.addEventListener('scroll',()=>$('#hdr').classList.toggle('solid',scrollY>20));
</script>
</body>
