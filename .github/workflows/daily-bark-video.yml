# Makes a slow-scrolling video (with original music) of each new Daily Bark story,
# and uploads it to YouTube when the YouTube secrets are set.
#
# Without secrets: the video is saved under this run's "Artifacts" (Actions tab) to download.
# To upload automatically, add these repository secrets (Settings > Secrets and variables > Actions):
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN
# Optional repository variable YT_PRIVACY: public (default), unlisted or private.
name: Daily Bark video
on:
  push:
    branches: [main]
    paths: ["stories/*.html"]
  workflow_dispatch:
    inputs:
      date:
        description: "Story date to make a video for (YYYY-MM-DD). Leave empty for the newest story."
        required: false
      upload:
        description: "Upload to YouTube (if the secrets are set)"
        type: boolean
        default: true
concurrency: daily-bark-video
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pick the story
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            f="stories/${{ github.event.inputs.date }}.html"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # only stories that were newly added in this push (not edits to old ones)
            f=$(git diff --diff-filter=A --name-only HEAD~1 HEAD -- 'stories/*.html' | sort | tail -1)
          else
            f=$(ls stories/*.html | sort | tail -1)
          fi
          if [ -z "$f" ] || [ ! -f "$f" ]; then echo "No new story to make a video for."; echo "story=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "story=$f" >> "$GITHUB_OUTPUT"
          echo "name=daily-bark-$(basename "$f" .html)" >> "$GITHUB_OUTPUT"
          echo "Making a video for $f"
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.story != ''
        with:
          python-version: "3.12"
      - name: Install tools
        if: steps.pick.outputs.story != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          pip install -q playwright numpy pillow
          python -m playwright install --with-deps chromium
      - name: Make the video
        if: steps.pick.outputs.story != ''
        run: |
          python -m http.server 8766 >/dev/null 2>&1 &
          sleep 2
          mkdir -p out
          python .github/bark-video/make_video.py "${{ steps.pick.outputs.story }}" "out/${{ steps.pick.outputs.name }}.mp4"
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.story != ''
        with:
          name: ${{ steps.pick.outputs.name }}
          path: out/
          retention-days: 30
      - name: Upload to YouTube
        if: steps.pick.outputs.story != '' && (github.event_name == 'push' || github.event.inputs.upload == 'true')
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "YouTube secrets aren't set yet, so the video is only saved as a download (Artifacts)."; exit 0; fi
          [ -n "$YT_PRIVACY" ] || export YT_PRIVACY=public
          python .github/bark-video/upload_youtube.py "out/${{ steps.pick.outputs.name }}.mp4" "out/${{ steps.pick.outputs.name }}.json"
