name: Build Marquee TV app

# Builds the Fire TV / Google TV app and puts it on the website at
# https://thedailybark.dog/marquee/marquee.apk
on:
  push:
    paths:
      - 'marquee-tv/**'
      - '.github/workflows/marquee-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Load the permanent signing key
        env:
          KS: ${{ secrets.MARQUEE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > marquee-tv/marquee.keystore; echo "Using permanent key"; else echo "No MARQUEE_KEYSTORE_B64 secret yet - using a random debug key"; fi

      - name: Build the app
        working-directory: marquee-tv
        env:
          MARQUEE_KEY_PASSWORD: ${{ secrets.MARQUEE_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Put the app on the website
        run: |
          cp marquee-tv/app/build/outputs/apk/debug/app-debug.apk marquee/marquee.apk
          cp marquee-tv/app/build/outputs/apk/debug/app-debug.apk marquee/marqueetv.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marquee/marquee.apk marquee/marqueetv.apk
          git commit -m "Build Marquee TV app" || exit 0
          git pull --rebase
          git push
