name: Build Marquee TV app

# Builds the Fire TV / Google TV app and puts it on the website at
# https://thedailybark.dog/marquee/marquee.apk
on:
  push:
    paths:
      - 'marquee-tv/**'
      - '.github/workflows/marquee-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app
        working-directory: marquee-tv
        run: gradle assembleDebug --no-daemon

      - name: Put the app on the website
        run: |
          cp marquee-tv/app/build/outputs/apk/debug/app-debug.apk marquee/marquee.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marquee/marquee.apk
          git commit -m "Build Marquee TV app" || exit 0
          git pull --rebase
          git push
