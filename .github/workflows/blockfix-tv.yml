name: Build BlockFix TV app

# Builds the Fire TV / Google TV app and puts it on the website at
# https://thedailybark.dog/blockfix/blockfix.apk
on:
  push:
    paths:
      - 'blockfix-tv/**'
      - '.github/workflows/blockfix-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency: blockfix-tv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Load the permanent signing key (same one as CastTV)
        env:
          KS: ${{ secrets.MARQUEE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > blockfix-tv/marquee.keystore; echo "Using permanent key"; else echo "No key secret - using a random debug key"; fi

      - name: Build the app
        working-directory: blockfix-tv
        env:
          MARQUEE_KEY_PASSWORD: ${{ secrets.MARQUEE_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Put the app on the website
        run: |
          cp blockfix-tv/app/build/outputs/apk/debug/app-debug.apk blockfix/blockfix.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockfix/blockfix.apk
          git commit -m "Build BlockFix TV app" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
